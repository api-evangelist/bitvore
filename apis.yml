x-no-mcp-pointer: >-
  mcp/bitvore-mcp.yml exists but is status:candidate — a tool surface DERIVED from real operationIds, not
  something Bitvore serves. No MCPServer pointer is emitted, because Bitvore publishes no MCP server.
x-base-url-repair: >-
  On 2026-08-14 all 19 api entries carried the same baseURL, https://api.bitvore.com/v2/corp/, and the same corp
  humanURL — but only four of the nineteen serve a path under /v2/corp. Bitvore runs one host, api.bitvore.com,
  with absolute paths per product line, exactly as its own Swagger declares (servers[] is the bare host on all six
  groups). Each baseURL/humanURL was re-pointed from the path prefix its own linked OpenAPI actually serves —
  /bondapi/, /entityapi/, /idapi/, /intelapi/, /corpnews/, /econnews/, /muninews/, /portfolioapi/,
  /financialfiling/, /sentimentscores/ for the v1 legacy surface, /muni/api/ and /muni/alerts/ for the municipal
  surface, /v2/corp/ for the v2 corporate surface, /oauth/ for the token endpoint. No servers[] block was touched.
x-no-wellknown-pointer: >-
  well-known/bitvore-well-known.yml records SIX hosts probed and ZERO well-known documents found — every
  /.well-known/* path is a 404, or on the SPA hosts a 200 carrying the HTML shell. The 2026-08-07 pass wired a
  WellKnown pointer against that all-404 probe, which credited an absence as a presence. The pointer was removed
  on 2026-08-14. The probe file stays, because a recorded absence is valid data.
x-not-published: >-
  Deliberately absent, each verified by probe rather than assumed: no /.well-known/ documents on any of six hosts
  (404 on api.bitvore.com, bitvore.com and bondwave.com; the 200s on developer.bitvore.com and base.bitvore.com
  are the SPA HTML shell), no A2A agent card, no MCP server, no GraphQL endpoint, no AsyncAPI or webhook surface
  (the Alert API is a deprecated 2019 polling surface, not a push one), no client SDKs on npm/PyPI/RubyGems, no
  public GitHub repos, no status page (status.bitvore.com does not resolve), no security.txt,
  no vulnerability-disclosure program, no trust center or published certifications, no sandbox host or test-mode
  key prefix, no CLI, no embedded UI components, and no published pricing — access is sales-gated, with a free
