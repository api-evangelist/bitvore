aid: bitvore
name: Bitvore
description: >-
  Bitvore Corp. builds Cellenus, an AI/NLP platform that reads unstructured public text — global news,
  press releases, SEC filings and proxy statements, earnings-call transcripts — and turns it into
  structured material business events, signals, trended sentiment, and growth and risk scores. Coverage
  spans 500,000+ surveilled companies across 60,000+ sources, sold as two separately licensed datasets:
  Cellenus Corporate Intelligence (corporate and economic news, organizations, financial filings,
  sentiment scores) and Cellenus Municipal (municipal bond news by CUSIP, location, FIPS and sector),
  with an ESG signal and scoring layer over both. Access is by REST API, bulk dataset and changeset
  exports, and a Microsoft-certified Power Platform connector. Bitvore's fixed-income data-analytics
  unit was acquired by BondWave in November 2024; bitvore.com now redirects to bondwave.com/muni-news/,
  while developer.bitvore.com and api.bitvore.com remain live and serving the Cellenus API surface.
