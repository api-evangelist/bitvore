x-no-mcp-pointer: >-
  mcp/bitvore-mcp.yml exists but is status:candidate — a tool surface DERIVED from real operationIds, not
  something Bitvore serves. No MCPServer pointer is emitted, because Bitvore publishes no MCP server.
x-not-published: >-
  Deliberately absent, each verified by probe rather than assumed: no /llms.txt (404 on every host), no
  /.well-known/ documents (404 on api.bitvore.com; the 200s on developer.bitvore.com and base.bitvore.com
  are the SPA HTML shell), no A2A agent card, no MCP server, no AsyncAPI or webhook surface, no client SDKs
  on npm/PyPI/RubyGems, no public GitHub repos, no status page (status.bitvore.com does not resolve), no
  security.txt, no vulnerability-disclosure program, no trust center or published certifications, no
  published pricing (sales-gated), and no live Bitvore-hosted terms or privacy policy —
  bitvore.com/privacy-policy/ and bitvore.com/contact-us/, both cited by Bitvore's own Microsoft connector
  listing, now return 404.
