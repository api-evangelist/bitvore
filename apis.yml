    url: openapi/bitvore-legacy-openapi.yml
  - type: Documentation
    url: https://developer.bitvore.com/v1/docs/overview
  - type: Overlay
    url: overlays/bitvore-legacy-overlay.yaml
- name: Bitvore Custom APIs (deprecated)
  description: >-
    Two per-customer Swagger groups published alongside the main API and marked "Deprecated 2019" in
    their own info.version — an Alert/Muni/Portfolios surface and a Bond/Intel surface, both secured
    with HTTP Basic rather than the API-key or OAuth schemes the current APIs use. Captured because they
    are enumerated in the provider's own public /swagger-resources index and remain served.
  humanURL: https://developer.bitvore.com/v2/docs/api-reference
  baseURL: https://api.bitvore.com/
  tags:
  - legacy
  - deprecated
  properties:
  - type: OpenAPI
