apis:
- name: Cellenus Corporate API
  description: >-
    Corporate news and material business events for surveilled public and private companies, plus US
    economic news by location and FIPS code, organization lookup/match/detail with CUSIP, ISIN, SEDOL
    and FIGI alternate identifiers, SEC financial filing summaries and submissions, trended sentiment,
    growth and risk scores, organization portfolios, and bulk dataset and changeset exports. Swagger 2.0,
    28 paths across 37 operations. Authenticated with a licensed Corporate API key.
  humanURL: https://developer.bitvore.com/v2/docs/overview/corp
  baseURL: https://api.bitvore.com/v2/corp/
  tags:
  - financial-data
  - market-intelligence
  - company-data
  - news-api
  - esg
  - sentiment-analysis
  properties:
  - type: OpenAPI
    url: openapi/bitvore-corporate-openapi.yml
  - type: Documentation
    url: https://developer.bitvore.com/v2/docs/overview/corp
  - type: APIReference
    url: https://developer.bitvore.com/v2/docs/api-reference/corp
  - type: Overlay
    url: overlays/bitvore-corporate-overlay.yaml
- name: Cellenus Municipal API
  description: >-
    Municipal bond news and issuer events from the Cellenus Municipal dataset, searchable by CUSIP,
    state/county/city location, FIPS code, sector, or a saved CUSIP portfolio, plus US economic news
    for a geography and full CUSIP portfolio management. Swagger 2.0, 12 paths across 21 operations.
    Requires a separately licensed Municipal API key.
  humanURL: https://developer.bitvore.com/v2/docs/overview/muni
  baseURL: https://api.bitvore.com/v2/muni/
  tags:
  - municipal-bonds
  - fixed-income
  - financial-data
  - news-api
  - credit-risk
  properties:
  - type: OpenAPI
    url: openapi/bitvore-muni-openapi.yml
  - type: Documentation
    url: https://developer.bitvore.com/v2/docs/overview/muni
  - type: APIReference
    url: https://developer.bitvore.com/v2/docs/api-reference/muni
  - type: Overlay
    url: overlays/bitvore-muni-overlay.yaml
- name: Bitvore OAuth 2.0 Token API
  description: >-
    Bitvore's OAuth 2.0 authorization server. Exchanges a registered client id and the licensed API key
    (sent as client_secret) for a bearer access token using the client_credentials grant, so the API key
    is not transmitted on every call. Tokens are presented per RFC 6750; no refresh token is issued, so
    a new token must be requested on expiry. A single "Global" scope covers all Bitvore APIs.
  humanURL: https://developer.bitvore.com/v2/docs/security
  baseURL: https://api.bitvore.com/oauth/
  tags:
  - authentication
  - oauth2
  properties:
  - type: OpenAPI
    url: openapi/bitvore-security-openapi.yml
  - type: Documentation
    url: https://developer.bitvore.com/v2/docs/security
  - type: Overlay
    url: overlays/bitvore-security-overlay.yaml
- name: Bitvore Legacy (v1) API
  description: >-
    The pre-2021 unprefixed Bitvore surface, still served at api.bitvore.com — /corpnews, /muninews,
    /econnews, /entityapi (organization lookup, match and detail), /idapi (account-wide foreign-id to
    bvId mapping), /financialfiling, /portfolioapi and /sentimentscores. Superseded by the v2 Corporate
    and Municipal APIs; the published upgrade guide documents the parameter and path changes.
    Swagger 2.0, 22 paths across 33 operations.
  humanURL: https://developer.bitvore.com/v1/docs/overview
  baseURL: https://api.bitvore.com/
  tags:
  - financial-data
  - news-api
  - company-data
  - legacy
  properties:
