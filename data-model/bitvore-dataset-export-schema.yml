- table: RECORD
  level: CORE
  description: Record is an article for corporate entities, companies or organizations both public and private.
  columns:
  - column: LASTMODIFIED
    type: TIMESTAMP_TZ
    description: The date a record was last changed as yyyy-MM-dd hh:mm.
    example: ''
  - column: ARTICLETYPE
    type: TEXT
    description: Article Type - News or Press Release.
    example: News
  - column: SENTIMENT
    type: FLOAT
    description: Overall Sentiment of the record within a range of -1.0 (negative) and 1.0 (positive).
    example: 0.2709757
  - column: SOURCENAME
    type: TEXT
    description: Name (typically hostname) of the source of the record.
    example: businesswire.com, The Washington Daybook
  - column: ESGSENTIMENT
    type: FLOAT
    description: ESG Sentiment of the record within a range of -1.0 (negative) and 1.0 (positive).
    example: ''
  - column: SOURCEURL
    type: TEXT
    description: URL for the source of the record.
    example: https://gulffire.mdmpublishing.com/250000th-allison-transmission-is-produced-in-hungary/
  - column: KEY
    type: TEXT
    description: 56 character unique identifier for the data record, a record may be on multiple rows if more than one company
      is associated with it.
    example: 070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c
  - column: PUBLISHED_DATE
    type: TIMESTAMP_TZ
    description: Date/time the record was initially published at as yyyy-MM-dd hh:mm.
    example: ''
  - column: TIMESTAMP
    type: TIMESTAMP_TZ
    description: Time the record was ingested as yyyy-MM-dd hh:mm.
    example: ''
  - column: BODY
    type: TEXT
    description: Body of any specified article
    example: ''
  - column: TITLE
    type: TEXT
    description: Title of any specified article
    example: ALSN aquires Wile E. Coyote
  - column: SIGNIFICANCE
    type: TEXT
    description: Articles are classified by their significance. A highly significant article is one that is alert worthy
      whereas less significant articles are more relevant when performing research. This option will filter the results
      returned by the previous options listed.
    example: HIGH
  - column: PREVIEWIMAGEURL
    type: TEXT
    description: URL to an image that was used originally as a visual preview.
    example: http://acme.com/resources/coyote.jpg
- table: RECORD_CUSIPS
  level: CORE
  description: Captures all the CUSIPs in a given article, One article can have many CUSIPs and one CUSIP can be linked
    to many articles
  columns:
  - column: CID
    type: NUMBER
    description: Unique identifier that captures all cusips in a given article
    example: ''
  - column: KEY
    type: TEXT
    description: The identification number for a given article
    example: 070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c
- table: RECORD_LICENSE
  level: CORE
  description: Captures the license for an article. One article can have only one license.
  columns:
  - column: LICID
    type: NUMBER
    description: The license identification number for an article
    example: ''
  - column: KEY
    type: TEXT
    description: The identification number of any given article\nKey= Bitvore Record Rowkey
    example: 070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c
- table: RECORD_LOCATIONS
  level: CORE
  description: Captures the locations in the article. One article can mention multiple locations and one location can be
    mentioned in many article.
  columns:
  - column: COUNTRY
    type: TEXT
    description: Derived country from a given article
    example: UNITED STATES
  - column: KEY
    type: TEXT
    description: The identification number of any given article\nKey= Bitvore Record Rowkey
    example: 070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c
  - column: STATE
    type: TEXT
    description: Derived state from a given article
    example: California
  - column: COUNTY
    type: TEXT
    description: Derived locality/county from a given article
    example: Cupertino
  - column: CITY
    type: TEXT
    description: Derived city from a given article
    example: IRVINE
  - column: USAGE
    type: TEXT
    description: The way the location relates to the article. The value in usage can be labeled as 'Article' or 'Source'.
      If USAGE = 'Article' it means that that location is part of the article text. If USAGE = 'Source' then it means that
      the location was the source of the article.
    example: For a New York Times article that mentions India would have USA as Source and India as Article
