- table: SCORE_TYPE\n
  level: CORE
  description: 'There are 7 types of scores.\nSentiment: Scores for all articles regardless of signals present on the record\nGrowth:
    Scores for articles with growth-specific signals including:\nRecognitions, FinancialHealth, AssetTransactions, Labor,
    EquityTransactions, Facilities, Agreements, MergersAcquisitions, DebtTransactions, ProductMarkets, RealEstateTransactions,
    Earnings\nRisk: Scores for articles with risk-specific signals including:\nExecutiveChanges, BusinessRisk, LegalIssues,
    CreditRatings, Bankruptcy\nESG: Scores for articles with ESG-specific signals including all articles under the Environment,
    Social, and Governance signal class.\nE: Scores for articles with Environment signal class\nS: Scores for articles with
    Social signal class\nG: Scores for articles with Governance signal class\n'
  columns:
  - column: SCORETYPE
    type: NUMBER
    description: There are different types of scores like sentiment, ESG, growth and risk
    example: sentiment
  - column: NAME
    type: TEXT
    description: Name of the company.
    example: ACME Corp.
