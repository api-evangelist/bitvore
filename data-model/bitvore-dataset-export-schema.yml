name: Cellenus dataset export schema
description: The flat-file schema of the Cellenus dataset and changeset exports served by the Datasets API (GET /v2/corp/datasets/...
  and /v2/corp/changesets/...). Delivered as CSV. This is the bulk/SFTP projection of the same data the REST API returns
  as JSON, and it is the only place Bitvore publishes column-level types.
licensing_levels:
  CORE: included in the base Cellenus dataset licence
  PLUS: additional tables licensed separately (RECORD_SIMILARITY, RECORD_STATUS)
