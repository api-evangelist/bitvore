description: >-
  Bitvore runs NO separate sandbox host and issues no test-mode key prefix — there is one production host,
  https://api.bitvore.com, and one class of credential. What Bitvore does publish is an evaluation path (a free
  trial key, requested by email) and a set of real, downloadable seed fixtures (six CSV portfolios of Bitvore
  entity IDs) that let a new integrator exercise the portfolio + news flow end to end against live data without
  first assembling their own company list.
