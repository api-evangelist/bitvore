fixture_flow:
  description: The three-step flow Bitvore documents for loading a sample portfolio and querying it.
  steps:
  - step: 1
    action: Download one of the sample CSV files above.
  - step: 2
    action: Create a named portfolio.
    operation: handleAddPortfolioUsingPOST_1
    http: POST https://api.bitvore.com/v2/corp/portfolios
    body: '{ "name": "SP500Portfolio", "idScheme": "bvid" }'
    returns: the generated portfolio id
  - step: 3
    action: Upload the CSV as portfolio items.
    operation: handleUploadPortfolioItemsUsingPOST_1
    http: POST https://api.bitvore.com/v2/corp/portfolios/{portfolioId}/itemUploads
    encoding: multipart/form-data (file=@sp500.csv)
  - step: 4
    action: Query news matched against the portfolio.
    operation: handlePortfolioNewsSearchUsingGET
    http: GET https://api.bitvore.com/v2/corp/news?portfolioId={id}
  skill: skills/bitvore-portfolio-monitoring.md
