description: Bitvore publishes no rate limit for its own HTTP API — there is no 429 response, no X-RateLimit-* header,
  and no quota page anywhere on developer.bitvore.com; volume is governed by the commercial licence. The one published,
  enforceable numeric limit on a first-party Bitvore surface is the throttle declared on the Microsoft-certified
  Bitvore Cellenus Power Platform connector.
