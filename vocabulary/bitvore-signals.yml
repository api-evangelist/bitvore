  - name: Spinoff
    description: A company announces a spinoff of some part of it as a new company.
  - name: TenderOffer
    description: An offer to purchase some or all of shareholders' shares in a corporation is made.
  - name: TransactionAnnouncement
    description: An acquisition, merger or divestiture of some portion of a company is announced.
  - name: TransactionCompletion
    description: An acquisition, merger or divestiture of some portion of a company is completed.
  - name: TransactionFailure
    description: An acquisition, merger or divestiture of some portion of a company failed.
  - name: TransactionRumor
    description: An acquisition, merger or divestiture of some portion of a company is rumored.
- name: Patents
