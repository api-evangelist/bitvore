  - name: RegulatoryClearance
    description: A product (besides a drug) has received regulatory approval, permission to operate, etc.
  - name: PatentApproval
    description: A patent is approved.
  - name: PatentPlanning
    description: Planning related to upcoming products or changes/updates to existing products.
  - name: ProductTesting
    description: Testing related to upcoming products or changes/updates to existing products.
  - name: ProductLaunch
    description: A new product is announced.
  - name: ProductPricing
    description: Pricing related to upcoming products or changes/updates to existing products.
  - name: ProductRecall
    description: A product has been recalled due to defect.
  - name: RegulatoryClearance
    description: A product (besides a drug) has received regulatory approval, permission to operate, etc.
- name: RealEstateTransactions
  description: Transactions involving real estate.
  sub_signals:
  - name: Lease
    description: A property is leased.
  - name: PurchaseSale
    description: A property is bought or sold (expanding/reducing a portfolio).
- name: Recognitions
  description: A business entity is recognized publicly in some way.
  sub_signals:
  - name: Award
    description: A company receives an award.
  - name: Certification
    description: A company receives a significant certification.
  - name: DonationsFundraisers
    description: A company donates or raises funds for a cause.
  - name: Grants
    description: A company gives without requiring repayment for a specific purpose.
  - name: Ranking
    description: A company receives a ranking (Top xxx in Industry, etc.).
