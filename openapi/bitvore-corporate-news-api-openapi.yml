servers:
- url: https://api.bitvore.com/
tags:
- name: Corporate News
  description: Corp News API
paths:
  /corpnews:
    get:
      tags:
      - Corporate News
      summary: Corporate News Query
      description: "Provides a simple GET oriented corporate news search capability. The search criteria used when querying news includes the following options specified as query parameters which can used together to refine the search results: \n * Bitvore ID - A Bitvore ID, known as a BvId, uniquely identifies a company/organization. Querying by BvId returns only news articles where the identified company is an actor in the story.\n * Portfolio - A portfolio is made up of one or more companies (BvIds). Querying by portfolio returns only articles where at least one of the companies in the portfolio are an actor in the article. This option cannot be used with the BvId or Foreign ID options. \n * Foreign ID - If the Identification API is used to map BvIds to ID's foreign to the Bitvore system the ID's mapped to BvIds are considered foreign ID's which can be used using this parameter instead of a BvId. This option cannot be used with the BvId or Portfolio options. \n * Signal - An article can be classified by one or more signals indicating that the article describes an event, or events, identified in the Bitvore Signal taxonomy. The taxonomy is hierarchical and signal values are '.' encoded to represent that hierarchy, i.e., Labor.Hiring. Querying by signal returns only articles classified by the given signal. All child signals in the signal hierarchy will also be returned. For example querying for Labor will return Labor.Hiring and Labor.Strike articles. The signals currently supported can be found [here](http://developer.bitvore.com/v1/docs/api-reference/signals).\n * Free Form Text Search - A search for words or phrases can be performed against the articles matching any of the previous options listed. \n * Article Type - Type of articles to return, News or PressRelease. By default all types are returned.\n * Significance - Articles are classified by their significance. A highly significant article is one that is alert worthy whereas less significant articles are more relevant when performing research. This option will filter the results returned by the previous options listed. \n * Similarity - Indicates which (if any) similar articles should be returned, options are \n \"Usage\" and \"None\", default is \"None\". \"Usage\" indicates similar articles can be returned if they \n have different usage restrictions. In other word with this option two similar articles can be returned \n if one is FullUse and the other is FairUse. \n * Org Field - By default each company referenced in an article is identified by its ID and its name. Additional fields will be returned for each company if specified here. The available options are name, domainName, ticker, city, state, and country. If available the additional fields will be returned in the Org objects (ReferencedOrgs, MatchedOrgs, and MatchedArticleOrgs) in the article. Note: Returning additional fields may cause a small increase in latency. \n \n\n The following are some examples of using the API. \n\n To query for the news about IBM, BvId b00001ab7, published within the last 3 days in the PST timezone (using query param for api key): \n\n ```js\n GET /corpnews?bvId=b00001ab7&offset=3&tz=PST&key=xyz123 HTTP 1.1\n Accept: application/json\n ```\n \n\n To query for the news about a portfolio between 1:00 and 2:00 PM PST on 7/1/2018 (using HTTP header for api key): \n\n ```js\n GET /corpnews?portfolioId=12345&startDate=2018-07-01T13:00:00&endDate=2018-07-01T14:00:00&tz=PST HTTP 1.1\n Accept: application/json\n X-BV-APIKEY: xyz123... \n ```\n \n\n To query for the news about a company with a proprietary ID mapped to a BvId using the Identification API: \n\n ```js\n GET /corpnews?foreignId=PROPRIETARYID&offset=3&tz=PST&key=xyz123 HTTP 1.1\n Accept: application/json\n ```\n \n\n To query for M&A news between 7/1/2018 and 7/31/2018 : \n\n ```js\n GET /corpnews?signal=MergerAcquisition&startDate=2018-07-01&endDate=2018-07-31&tz=PST HTTP 1.1\n Accept: application/json\n X-BV-APIKEY: xyz123... \n ```\n \n\n To query for the news published within the last 3 days in the PST timezone and return tickers and domain names \n\n ```js\n GET /corpnews?&offset=3&tz=PST&orgField=ticker&orgField=domainName&key=xyz123 HTTP 1.1\n Accept: application/json\n ```\n \n\n The metadata tags of articles returned specific to corporate news in addition to the common tags above are: \n * Signals - 0 or more signals detected in the article encoded with '.' notation such as Labor.Hiring. \n * Referenced Orgs - 0 or more BvId/Name combinations identifying companies discussed in the article. \n \n\n A sample successful response is: \n\n ```js\n {\n \t\"success\": true,\n \t\"returned\": 1,\n \t\"total\": 1,\n \t\"response\": [\n \t\t{\n \t\t\t\"key\": \"070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c\",\n \t\t\t\"articleType\": \"News\",\n \t\t\t\"title\": \"ACME aquires Wile E. Coyote\",\n \t\t\t\"sourceName\": \"acme.com\",\n \t\t\t\"sourceUrl\": \"http://ct.moreover.com/?a=41646891667&p=5jw&v=1&x=yg6DsqTFf8IC8ym026-o0A\",\n \t\t\t\"previewImageUrl\": \"http://acme.com/resources/coyote.jpg\",\n \t\t\t\"excerpt\": \"The ACME corporation has completed the merger with Wile E. Coyote today ...\",\n \t\t\t\"signals\": [\"MergeAcquisition.AcquisitionComplete\"],\n \t\t\t\"referencedOrgs\": [ \n \t\t\t\t{ \"BvId\" : \"a00001aaa\", \"Name\" : \"ACME Corp\" }, \n \t\t\t\t{ \"BvId\" : \"a00001aab\", \"Name\" : \"Wile E. Coyote Inc\" } \n \t\t\t],\n \t\t\t\"matchedArticleOrgs\": [ \n \t\t\t\t{ \"BvId\" : \"a00001aaa\", \"Name\" : \"ACME Corp\" } \n \t\t\t],\n \t\t\t\"matchedOrgs\": [ \n \t\t\t\t{ \"BvId\" : \"a00001aac\", \"Name\" : \"A Company Manufacturing Everything\" } \n \t\t\t],\n \t\t\t\"significance\": \"HIGH\",\n \t\t\t\"sentiment\" : 0.22555919, \n \t\t\t\"publishedAt\": \"2017-06-29T21:41:19.109Z\",\n \t\t\t\"availableAt\": \"2017-06-29T21:41:21.109Z\",\n \t\t}\n \t]\n }\n ```\n \n\n Each article returned may have one or more groups of referenced articles. The referencedOrgs property holds the list of companies that were directly mentioned in the article and were considered the primary actors. In this example the article was about ACME merging with Wile E. Coyote which were considered the primary actors. \n\n If there is more than one primary actor in an article it is often the case that only a subset of those actors were in the original scope of the input query (bvIds or portfolio). The matchedArticleOrgs will hold that subset of primary actors which were part of the input query. The system will look for articles about subsidiaries of the companies in the original scope of the input query as well. When a subsidiary is the primary actor of a returned article it will be in the referencedOrgs and matchedArticlesOrg field, but the parent company that was specified in the query will be returned in the matchedOrgs property. \n\n In this example the original query was for articles about A Company Manufacturing Everything. The system found this article about its child company ACME. Therefore matchedArticleOrgs lists ACME and matchedOrgs lists A Company Manufacturing Everything which was in the original query. \n\n A sample unsuccessful response is: \n\n ```js\n {\n \t\"success\": false,\n \t\"reason\": \"Bad bvId found\",\n \t\"reasonSupport\": \"123456789 987654321\",\n \t\"count\": 0\n }\n ```\n"
      operationId: handleCorpSimpleSearchUsingGET
      parameters:
      - name: bvId
        in: query
        description: One or more Bitvore Iss identifying entities to retrieve news for, should not be used with the portfolio or foreignId parameters.
        required: false
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: portfolioId
        in: query
        description: Id identifying a portfolio to retrieve news for, should not be used with the bvId or foreignId parameters.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: articleType
        in: query
        description: One or more types of articles (i.e., News, PressRelease) to return. By default all types are returned.
        required: false
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: signal
        in: query
        description: One or more signals (i.e., Bankruptcy, Labor.Hiring) to restrict the returned news to.
        required: false
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: theme
        in: query
        description: One or more themes (i.e., Brexit, TradeWar) to restrict the returned news to.
        required: false
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: text
        in: query
        description: Keyword or phrase to search for news when not using a portfolio
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: foreignId
        in: query
        description: One or more Foreign IDs identifying the entities to retrieve news for, the IDs must be registered in an identification scheme associated with the API client. Should not be used with the bvId or portfolio parameters.
        required: false
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: startDate
        in: query
        description: News date to start from. Format is yyyy-mm-dd for daily news or yyyy-mm-dd'T'HH:mm if you want it down to the hour or minute. Should not be used if offset parameter is.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: endDate
        in: query
        description: News date to end with. Format is yyyy-mm-dd for daily (inclusive) news or yyyy-mm-dd'T'HH:mm if you want it down to the hour or minute. If startDate is used and endDate is not the default endDate is today.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: offset
        in: query
        description: Number of days back news should be returned for. Should not be used with startDate. Default is 31.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
      - name: tz
        in: query
        description: Timezone used in startDate and endDate.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: GMT
      - name: dateType
        in: query
        description: Indicates whether dates to query by should be published dates "published" or available dates (processing completed) "available". Default is published.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: published
      - name: pageNo
        in: query
        description: Page number of the total result set to return, default is 1.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: Number of results out of the total result set per page to return, default is 100, maximum is 1000.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: significance
        in: query
        description: Significance of articles to return, possible values are "HIGH" and "MEDIUM", default is "HIGH". The parameter is a threshold so a value of MEDIUM will return MEDIUM and HIGH significance articles.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: HIGH
      - name: similarity
        in: query
        description: Indicates which (if any) similar articles should be returned, options are "Usage" and "None", default is "None". "Usage" indicates similar articles can be returned if they have different usage restrictions.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: None
      - name: orgField
        in: query
        description: One or more fields to return for each organization associated with the returned articles, by default only the organization's Id and name is returned.
        required: false
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpNewsSearchResponseLegacy'
                originalRef: CorpNewsSearchResponseLegacy
        '401':
          description: Unauthorized to view intelligence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
      security:
      - API key:
        - Global
      - BasicAuth:
        - Global
      - OAuth:
        - Global
      deprecated: false
    post:
      tags:
      - Corporate News
      summary: Advanced Corporate News Query
      description: "Provides an advanced corporate news search capability. The search criteria used when querying news includes a more advanced approach to identifying the company, or organization, scope of the news to return as well as the other content oriented options listed above. The following are the options supported for identifying the organization scope: \n * Bitvore ID - A Bitvore ID, known as a BvId, uniquely identifies a company/organization. Querying by BvId returns only news articles where the identified company is an actor in the story.\n * Portfolio - A portfolio is made up of one or more companies (BvIds). Querying by portfolio returns only articles where at least one of the companies in the portfolio are an actor in the article. This option cannot be used with the BvId or Foreign ID options. \n * Foreign ID - If the Identification API is used to map BvIds to ID's foreign to the Bitvore system the ID's mapped to BvIds are considered foreign ID's which can be used using this parameter instead of a BvId. This option cannot be used with the BvId or Portfolio options. \n * Employees - Returns all articles referencing companies with an estimated number of employees that falls within a specified range using the format of lower-upper, i.e. 50-250. The upper bound may be omitted (50-) to indicate an unbounded range. The ranges must be defined using the predefined measurements: 1, 10, 50, 100, 250, 500, 1000, 5000, 10000. This option cannot be used with the BvId, Foreign ID, or Portfolio options. Note: On 1/11/2020 the range boundary of 200 was replaced by 100 and 250 and will be no longer supported on 7/1/2020. \n * Revenue - Returns all articles referencing companies with an estimated revenue that falls within a specified range using the format of lower-upper, i.e. 500-1000. The upper bound may be omitted (500-) to indicate an unbounded range. The ranges must be defined using the predefined measurements:  0, 1, 10, 50, 100, 500, 1000, 10000. This option cannot be used with the BvId, Foreign ID, or Portfolio options. Note: On 1/11/2020 the range boundary of 200 was replaced with 500 and will be no longer supported on 7/1/2020. \n * NAICS Industry - Returns all articles referencing companies operating within the industry identified by the specified [NAICS](https://www.naics.com/search/) code. \n * SIC Industry - Returns all articles referencing companies operating within the industry identified by the specified [SIC](https://www.osha.gov/pls/imis/sicsearch.html) code. \n * HQ Location - Returns all articles referencing companies whose headquarters is located in the specified location. The location is in the format of city/state/country, i.e., Los Angeles/California/United States. \n * HQ FIPS Area - Returns all articles referencing companies whose headquarters is located in the county or CBSA identified by the given FIPS code. FIPS codes for counties can be found [here](https://www.census.gov/prod/techdoc/cbp/95-96cd/fips-st.pdf). FIPS codes for CBSAs can be found [here](https://www2.census.gov/programs-surveys/cps/methodology/2015%20Geography%20Cover.pdf). Maps of CBSAs can be found [here](https://www.census.gov/geographies/reference-maps/2020/geo/cbsa.html). \n \n\n The following content oriented query options are also supported: \n * Signal - An article can be classified by one or more signals indicating that the article describes an event, or events, identified in the Bitvore Signal taxonomy. The taxonomy is hierarchical and signal values are '.' encoded to represent that hierarchy, i.e., Labor.Hiring. Querying by signal returns only articles classified by the given signal. All child signals in the signal hierarchy will also be returned. For example querying for Labor will return Labor.Hiring and Labor.Strike articles. The signals currently supported can be found [here](http://developer.bitvore.com/v1/docs/api-reference/signals).\n * Free Form Text Search - A search for words or phrases can be performed against the articles matching any of the previous options listed. \n * Article Type - Type of articles to return, News or PressRelease. By default all types are returned.\n * Significance - Articles are classified by their significance. A highly significant article is one that is alert worthy whereas less significant articles are more relevant when performing research. This option will filter the results returned by the previous options listed. \n * Usage - A news article may have licensing restrictions placed on it. If an article is governed by \n a fair use license Bitvore can only return excerpts to the article's content. To filter search \n results to only fair use content specify \"FairUse\" for the Usage option. To filter results to only \n commercially licensed content that grants full use of the content specify \"FullUse\" for the Usage option. \n Specifying \"All\", which is the default option, does not filter the results at all. \n * Org Field - By default each company referenced in an article is identified by its ID and its name. Additional fields will be returned for each company if specified here. The available options are name, domainName, ticker, city, state, and country. If available the additional fields will be returned in the Org objects (ReferencedOrgs, MatchedOrgs, and MatchedArticleOrgs) in the article. Note: Returning additional fields may cause a small increase in latency.\n \n\n The following are some examples of using the API. \n\n To query for the news about IBM, BvId b00001ab7, published within the last 3 days in the PST timezone (using HTTP header for api key): \n\n ```js\n POST /corpnews \n Accept: application/json\n X-BV-APIKEY: xyz123... \n\n { \n \t\"orgScope\": { \n \t\t\"ids\": [\"b00001ab7\"], \n \t\t\"orgIdScheme\": \"BVID\" \n \t}, \n \t\"offset\": 3, \n \t\"timezone\": \"PST\" \n } \n ```\n \n\n To query for the news about all executive changes between 9:00AM PST 7/1/2018 and 5:00PM PST on 7/31/2018: \n\n ```js\n POST /corpnews \n Accept: application/json\n X-BV-APIKEY: xyz123... \n\n { \n \t\"signal\": [\"ExecutiveChanges\"], \n \t\"startDate\": \"2018-07-01T09:00:00\", \n \t\"endDate\": \"2018-07-31T17:00:00\", \n \t\"timezone\": \"PST\" \n } \n ```\n \n\n To query for the news about a companies with annual revenue between 50M and 100M in the last 30 days: \n\n ```js\n POST /corpnews \n Accept: application/json\n X-BV-APIKEY: xyz123... \n\n { \n \t\"orgScope\": { \n \t\t\"revRange\": \"50-100\" \n \t}, \n \t\"offset\": 30, \n \t\"timezone\": \"PST\" \n } \n ```\n \n\n The metadata tags of articles returned specific to corporate news in addition to the common tags above are: \n * Signals - 0 or more signals detected in the article encoded with '.' notation such as Labor.Hiring. \n * Referenced Orgs - 0 or more BvId/Name combinations identifying companies discussed in the article. \n \n\n A sample successful response is: \n\n ```js\n {\n \t\"success\": true,\n \t\"returned\": 1,\n \t\"total\": 1,\n \t\"response\": [\n \t\t{\n \t\t\t\"key\": \"070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c\",\n \t\t\t\"articleType\": \"News\",\n \t\t\t\"title\": \"ACME acquires Wile E. Coyote\",\n \t\t\t\"sourceName\": \"acme.com\",\n \t\t\t\"sourceUrl\": \"http://ct.moreover.com/?a=41646891667&p=5jw&v=1&x=yg6DsqTFf8IC8ym026-o0A\",\n \t\t\t\"previewImageUrl\": \"http://acme.com/resources/coyote.jpg\",\n \t\t\t\"excerpt\": \"The ACME corporation has completed the merger with Wile E. Coyote today ...\",\n \t\t\t\"signals\": [\"MergeAcquisition.AcquisitionComplete\"],\n \t\t\t\"referencedOrgs\": [ \n \t\t\t\t{ \"BvId\" : \"a00001aaa\", \"Name\" : \"ACME Corp\" }, \n \t\t\t\t{ \"BvId\" : \"a00001aab\", \"Name\" : \"Wile E. Coyote Inc\" } \n \t\t\t],\n \t\t\t\"matchedArticleOrgs\": [ \n \t\t\t\t{ \"BvId\" : \"a00001aaa\", \"Name\" : \"ACME Corp\" } \n \t\t\t],\n \t\t\t\"matchedOrgs\": [ \n \t\t\t\t{ \"BvId\" : \"a00001aac\", \"Name\" : \"A Company Manufacturing Everything\" } \n \t\t\t],\n \t\t\t\"significance\": \"HIGH\",\n \t\t\t\"sentiment\" : 0.22555919, \n \t\t\t\"publishedAt\": \"2017-06-29T21:41:19.109Z\",\n \t\t\t\"availableAt\": \"2017-06-29T21:41:21.109Z\",\n \t\t}\n \t]\n }\n ```\n A sample unsuccessful response is: \n\n ```js\n {\n \t\"success\": false,\n \t\"reason\": \"Bad bvId found\",\n \t\"reasonSupport\": \"123456789 987654321\",\n \t\"count\": 0\n }\n ```\n"
      operationId: handleCorpAdvancedSearchUsingPOST
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpNewsSearchResponseLegacy'
                originalRef: CorpNewsSearchResponseLegacy
        '401':
          description: Unauthorized to view intelligence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
      security:
      - API key:
        - Global
      - BasicAuth:
        - Global
      - OAuth:
        - Global
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorporateNewsRequestLegacy'
              originalRef: CorporateNewsRequestLegacy
        description: request
        required: true
components:
  schemas:
    OrganizationReference:
      type: object
      properties:
        bvId:
          type: string
          example: b00001ab7
          description: Bitvore Id of the organization
        city:
          type: string
          example: IRVINE
          description: City the organization is headquartered in.
        country:
          type: string
          example: UNITED STATES
          description: Country the organization is headquartered in.
        domainName:
          type: string
          example: acme.com
          description: Domain name of the organization.
        factsetId:
          type: string
          example: 000DWY-E
          description: 'FactSet ID of the organization. (Requires License: ''FACTSET_ID'')'
        isin:
          type: string
          example: US5949181045
          description: 'ISIN of the organization. (Requires License: ''ISIN'')'
        name:
          type: string
          example: ACME Corp
          description: Name of the organization.
        state:
          type: string
          example: CA
          description: State (code) the organization is headquartered in.
        ticker:
          type: string
          example: ACME
          description: Primary ticker of the organization (if public).
      title: OrganizationReference
      description: Reference to an organization
    CorpNewsArticleLegacy:
      type: object
      properties:
        articleType:
          type: string
          example: PressRelease
          description: Type of article. Possible values are "News" and "PressRelease
        availableAt:
          type: string
          example: '2017-06-29T21:41:21.109Z'
          description: Date published
        excerpt:
          type: string
          example: ACME announces long awaited acquisition. The acquisition of Wile E. Coyote was announced Thursday.
          description: Fragment or snippet, of the article
        key:
          type: string
          example: 070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c
          description: Key uniquely identifying the article
        matchedArticleOrgs:
          type: array
          description: List of the primary actors that match the input organization scope directly or indirectly
          items:
            $ref: '#/components/schemas/OrganizationReference'
            originalRef: OrganizationReference
        matchedOrgs:
          type: array
          description: List of organizations that match the input organization scope that are primary actors in the article or related to those primary actors
          items:
            $ref: '#/components/schemas/OrganizationReference'
            originalRef: OrganizationReference
        phrases:
          type: array
          example: referendum, embassy_attack
          description: Key phrases identified in the news, only available when themes are also identified
          items:
            type: string
        previewImageUrl:
          type: string
          example: http://acme.com/resources/coyote.jpg
          description: URL of a preview image
        publishedAt:
          type: string
          example: '2017-06-29T21:41:21.109Z'
          description: Date available
        referencedOrgHierarchy:
          type: array
          description: List of organizations who are the primary actors in the article and their ancestors (if any)
          items:
            $ref: '#/components/schemas/OrganizationReference'
            originalRef: OrganizationReference
        referencedOrgs:
          type: array
          description: List of organizations who are the primary actors in the article
          items:
            $ref: '#/components/schemas/OrganizationReference'
            originalRef: OrganizationReference
        sentiment:
          type: number
          format: double
          example: 0.23456
          description: Sentiment of the article. The value is a decimal value between -1 and 1, under 0 is negative while over 0 is positive.
        signals:
          type: array
          example: Labor, Labor.Hiring
          description: Material situations/events identified in the news. Signals are represented by a hierarchical taxonomy and are '.' encoded to represent that hierarchy
          items:
            type: string
        significance:
          type: string
          example: HIGH
          description: Significance of the article. Possible values are "HIGH" and "MEDIUM"
        similarityClusterId:
          type: string
          example: 075005015cf083aba01f0826ecfe718e965b577c572166b14a77652e
          description: Id of the similarity cluster it belongs to.
        sourceName:
          type: string
          example: businesswire.com, The Washington Daybook
          description: Name or host name of the publisher of the article
        sourceUrl:
          type: string
          example: http://acme.com/press
          description: URL to the original source of the article
        themes:
          type: array
          example: Brexit, TradeWar
          description: Trending topics identified in the news
          items:
            type: string
        title:
          type: string
          example: ACME acquires Wile E. Coyote, Inc.
          description: Title
      title: CorpNewsArticleLegacy
      description: Corp news article.
    OrganizationQueryCriteriaLegacy:
      type: object
      properties:
        empRange:
          type: string
          example: 200-5000
          description: Employee range companies must fall in. The range is formatted as <lower>-<upper> where lower and upper must be one of 1, 10, 50, 200, 500, 1000, 5000, 10000. The upper bound can be omitted to report over 1B.
        fips:
          type: array
          example:
          - '35620'
          description: One or more FIPS codes identifying locations the companies must have their headquarters in.
          items:
            type: string
        location:
          type: array
          example:
          - Los Angeles/California/United States
          description: One or more locations companies must have their headquarters in.
          items:
            type: string
        naics:
          type: array
          example:
          - '221114'
          - '221115 '
          description: One or more NAICS codes identifying industries the companies must operate in.
          items:
            type: string
        revRange:
          type: string
          example: 50-200
          description: Revenue range (in millions) companies must fall in. The range is formatted as <lower>-<upper> where lower and upper must be one of 0, 1, 10, 50, 100, 200, 1000. The upper bound can be omitted to report over 1B.
        sic:
          type: array
          example:
          - '1311'
          - '1381'
          description: One or more SIC codes identifying industries the companies must operate in.
          items:
            type: string
      title: OrganizationQueryCriteriaLegacy
      description: Query criteria identifying the companies/organizations that should be the subject of the news to be returned.
    OrganizationScopeLegacy:
      type: object
      properties:
        bvId:
          type: array
          description: One or more Bitvore IDs identifying entities to retrieve news for.
          items:
            type: string
        foreignId:
          type: array
          description: One or more Foreign Ids identifying the entities to retrieve news for, the Ids must be registered in an identification scheme associated with the API client.
          items:
            type: string
        orgQuery:
          description: Query criteria identifying the entities to retrieve news for.
          $ref: '#/components/schemas/OrganizationQueryCriteriaLegacy'
          originalRef: OrganizationQueryCriteriaLegacy
        portfolioId:
          type: string
          description: Id identifying a portfolio to retrieve news for.
      title: OrganizationScopeLegacy
      description: Identifies the companies/organizations that should be the subject of the news to be returned. Only one of the supported options should be used at a time.
    ReasonResponse:
      type: object
      properties:
        reason:
          type: string
          example: Could not locate subject.
          description: Text reason for the failure (if not successful)
        reasonSupport:
          type: object
          example: Longer description of the missing subject.
          description: Additional information about the failure (if not successful)
        response:
          type: object
          description: Response payload
        success:
          type: boolean
          example: true
          description: Indicates whether the call was successful or not
      title: ReasonResponse
      description: A response used to explain a failure or issue with the request.
    CorpNewsSearchResponseLegacy:
      type: object
      required:
      - returned
      - total
      properties:
        reason:
          type: string
          example: Could not locate subject.
          description: Text reason for the failure (if not successful)
        reasonSupport:
          type: string
          example: Longer description of the missing subject.
          description: Additional information about the failure (if not successful)
        response:
          type: array
          description: Response payload
          items:
            $ref: '#/components/schemas/CorpNewsArticleLegacy'
            originalRef: CorpNewsArticleLegacy
        returned:
          type: integer
          format: int32
          example: 10
          description: Number of news articles returned by search, maximum amount dictated by the pageSize parameter used in search
        success:
          type: boolean
          example: true
          description: Indicates whether the call was successful or not
        total:
          type: integer
          format: int32
          example: 100
          description: Total Number of news articles found by search
      title: CorpNewsSearchResponseLegacy
      description: Corp news search response.
    CorporateNewsRequestLegacy:
      type: object
      properties:
        articleType:
          type: array
          example:
          - News
          - PressRelease
          description: One or more types of articles to return. By default all types are returned.
          items:
            type: string
        dateType:
          type: string
          example: available
          description: Indicates whether dates to query by should be published dates "published" or available dates (processing completed) "available". Default is published.
        endDate:
          type: string
          example: '2018-08-01T12:00:00'
          description: News date to end with. Format is yyyy-mm-dd for daily (inclusive) news or yyyy-mm-dd'T'HH:mm if you want it down to the hour or minute. If startDate is used and endDate is not the default endDate is today.
        offset:
          type: integer
          format: int32
          example: 14
          description: Number of days back news should be returned for. Should not be used with startDate. Default is 31.
        orgField:
          type: array
          example:
          - name
          - ticker
          description: One or more fields to return for each organization associated with the returned articles, by default only the organization's Id and name is returned. Available options are name, domainName, ticker, city, state, country
          items:
            type: string
        orgScope:
          description: Identifies the companies/organizations that should be the subject of the news to be returned. Only one of the supported options should be used at a time.
          $ref: '#/components/schemas/OrganizationScopeLegacy'
          originalRef: OrganizationScopeLegacy
        pageNo:
          type: integer
          format: int32
          example: 1
          description: Page number of the total result set to return, default is 1.
        pageSize:
          type: integer
          format: int32
          example: 100
          description: Number of results out of the total result set per page to return, default is 100, maximum is 1000.
        signal:
          type: array
          example:
          - Business.MergerAcquisitions
          - Business.FinancialFilings
          description: One or more signals to restrict the returned news to.
          items:
            type: string
        significance:
          type: string
          example: HIGH
          description: Significance of articles to return, possible values are "HIGH" and "MEDIUM", default is "HIGH". The parameter is a threshold so a value of MEDIUM will return MEDIUM and HIGH significance articles.
        similarity:
          type: string
          description: Indicates which (if any) similar articles should be returned, options are "Usage" and "None", default is "None". "Usage" indicates similar articles can be returned if they have different usage restrictions.
        startDate:
          type: string
          example: '2018-08-01T12:00:00'
          description: News date to start from. Format is yyyy-mm-dd for daily news or yyyy-mm-dd'T'HH:mm if you want it down to the hour or minute. Should not be used if offset parameter is.
        text:
          type: string
          example: blockchain
          description: Keyword or phrase to search for news when not using a portfolio
        theme:
          type: array
          example:
          - Brexit
          - TradeWar
          description: One or more themes to restrict the returned news to.
          items:
            type: string
        timezone:
          type: string
          example: PST
          description: Timezone used in startDate and endDate.
      title: CorporateNewsRequestLegacy
      description: Query criteria for returning corporate news.
  securitySchemes:
    API_key:
      type: apiKey
      name: X-BV-APIKEY
      in: header
    BasicAuth:
      type: http
      scheme: basic
    OAuth:
      type: oauth2
      flows:
        clientCredentials:
          scopes:
            Global: Includes all Bitvore APIs
          tokenUrl: https://api.bitvore.com/oauth/accesstoken
