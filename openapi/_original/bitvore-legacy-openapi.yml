paths:
  /corpnews:
    get:
      tags:
      - Corporate News
      summary: Corporate News Query
      description: "Provides a simple GET oriented corporate news search capability. The search criteria used when querying\
        \ news includes the following options specified as query parameters which can used together to refine the search results:\
        \ \n * Bitvore ID - A Bitvore ID, known as a BvId, uniquely identifies a company/organization. Querying by BvId returns\
        \ only news articles where the identified company is an actor in the story.\n * Portfolio - A portfolio is made up\
        \ of one or more companies (BvIds). Querying by portfolio returns only articles where at least one of the companies\
        \ in the portfolio are an actor in the article. This option cannot be used with the BvId or Foreign ID options. \n\
        \ * Foreign ID - If the Identification API is used to map BvIds to ID's foreign to the Bitvore system the ID's mapped\
        \ to BvIds are considered foreign ID's which can be used using this parameter instead of a BvId. This option cannot\
        \ be used with the BvId or Portfolio options. \n * Signal - An article can be classified by one or more signals indicating\
        \ that the article describes an event, or events, identified in the Bitvore Signal taxonomy. The taxonomy is hierarchical\
        \ and signal values are '.' encoded to represent that hierarchy, i.e., Labor.Hiring. Querying by signal returns only\
        \ articles classified by the given signal. All child signals in the signal hierarchy will also be returned. For example\
        \ querying for Labor will return Labor.Hiring and Labor.Strike articles. The signals currently supported can be found\
        \ [here](http://developer.bitvore.com/v1/docs/api-reference/signals).\n * Free Form Text Search - A search for words\
        \ or phrases can be performed against the articles matching any of the previous options listed. \n * Article Type\
        \ - Type of articles to return, News or PressRelease. By default all types are returned.\n * Significance - Articles\
        \ are classified by their significance. A highly significant article is one that is alert worthy whereas less significant\
        \ articles are more relevant when performing research. This option will filter the results returned by the previous\
        \ options listed. \n * Similarity - Indicates which (if any) similar articles should be returned, options are \n \"\
        Usage\" and \"None\", default is \"None\". \"Usage\" indicates similar articles can be returned if they \n have different\
        \ usage restrictions. In other word with this option two similar articles can be returned \n if one is FullUse and\
        \ the other is FairUse. \n * Org Field - By default each company referenced in an article is identified by its ID\
        \ and its name. Additional fields will be returned for each company if specified here. The available options are name,\
        \ domainName, ticker, city, state, and country. If available the additional fields will be returned in the Org objects\
        \ (ReferencedOrgs, MatchedOrgs, and MatchedArticleOrgs) in the article. Note: Returning additional fields may cause\
        \ a small increase in latency. \n \n\n The following are some examples of using the API. \n\n To query for the news\
        \ about IBM, BvId b00001ab7, published within the last 3 days in the PST timezone (using query param for api key):\
        \ \n\n ```js\n GET /corpnews?bvId=b00001ab7&offset=3&tz=PST&key=xyz123 HTTP 1.1\n Accept: application/json\n ```\n\
        \ \n\n To query for the news about a portfolio between 1:00 and 2:00 PM PST on 7/1/2018 (using HTTP header for api\
        \ key): \n\n ```js\n GET /corpnews?portfolioId=12345&startDate=2018-07-01T13:00:00&endDate=2018-07-01T14:00:00&tz=PST\
        \ HTTP 1.1\n Accept: application/json\n X-BV-APIKEY: xyz123... \n ```\n \n\n To query for the news about a company\
        \ with a proprietary ID mapped to a BvId using the Identification API: \n\n ```js\n GET /corpnews?foreignId=PROPRIETARYID&offset=3&tz=PST&key=xyz123\
        \ HTTP 1.1\n Accept: application/json\n ```\n \n\n To query for M&A news between 7/1/2018 and 7/31/2018 : \n\n ```js\n\
        \ GET /corpnews?signal=MergerAcquisition&startDate=2018-07-01&endDate=2018-07-31&tz=PST HTTP 1.1\n Accept: application/json\n\
        \ X-BV-APIKEY: xyz123... \n ```\n \n\n To query for the news published within the last 3 days in the PST timezone\
        \ and return tickers and domain names \n\n ```js\n GET /corpnews?&offset=3&tz=PST&orgField=ticker&orgField=domainName&key=xyz123\
        \ HTTP 1.1\n Accept: application/json\n ```\n \n\n The metadata tags of articles returned specific to corporate news\
        \ in addition to the common tags above are: \n * Signals - 0 or more signals detected in the article encoded with\
        \ '.' notation such as Labor.Hiring. \n * Referenced Orgs - 0 or more BvId/Name combinations identifying companies\
        \ discussed in the article. \n \n\n A sample successful response is: \n\n ```js\n {\n \t\"success\": true,\n \t\"\
        returned\": 1,\n \t\"total\": 1,\n \t\"response\": [\n \t\t{\n \t\t\t\"key\": \"070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c\"\
        ,\n \t\t\t\"articleType\": \"News\",\n \t\t\t\"title\": \"ACME aquires Wile E. Coyote\",\n \t\t\t\"sourceName\": \"\
        acme.com\",\n \t\t\t\"sourceUrl\": \"http://ct.moreover.com/?a=41646891667&p=5jw&v=1&x=yg6DsqTFf8IC8ym026-o0A\",\n\
        \ \t\t\t\"previewImageUrl\": \"http://acme.com/resources/coyote.jpg\",\n \t\t\t\"excerpt\": \"The ACME corporation\
        \ has completed the merger with Wile E. Coyote today ...\",\n \t\t\t\"signals\": [\"MergeAcquisition.AcquisitionComplete\"\
        ],\n \t\t\t\"referencedOrgs\": [ \n \t\t\t\t{ \"BvId\" : \"a00001aaa\", \"Name\" : \"ACME Corp\" }, \n \t\t\t\t{ \"\
        BvId\" : \"a00001aab\", \"Name\" : \"Wile E. Coyote Inc\" } \n \t\t\t],\n \t\t\t\"matchedArticleOrgs\": [ \n \t\t\t\
        \t{ \"BvId\" : \"a00001aaa\", \"Name\" : \"ACME Corp\" } \n \t\t\t],\n \t\t\t\"matchedOrgs\": [ \n \t\t\t\t{ \"BvId\"\
        \ : \"a00001aac\", \"Name\" : \"A Company Manufacturing Everything\" } \n \t\t\t],\n \t\t\t\"significance\": \"HIGH\"\
        ,\n \t\t\t\"sentiment\" : 0.22555919, \n \t\t\t\"publishedAt\": \"2017-06-29T21:41:19.109Z\",\n \t\t\t\"availableAt\"\
        : \"2017-06-29T21:41:21.109Z\",\n \t\t}\n \t]\n }\n ```\n \n\n Each article returned may have one or more groups of\
        \ referenced articles. The referencedOrgs property holds the list of companies that were directly mentioned in the\
        \ article and were considered the primary actors. In this example the article was about ACME merging with Wile E.\
        \ Coyote which were considered the primary actors. \n\n If there is more than one primary actor in an article it is\
        \ often the case that only a subset of those actors were in the original scope of the input query (bvIds or portfolio).\
        \ The matchedArticleOrgs will hold that subset of primary actors which were part of the input query. The system will\
        \ look for articles about subsidiaries of the companies in the original scope of the input query as well. When a subsidiary\
        \ is the primary actor of a returned article it will be in the referencedOrgs and matchedArticlesOrg field, but the\
        \ parent company that was specified in the query will be returned in the matchedOrgs property. \n\n In this example\
        \ the original query was for articles about A Company Manufacturing Everything. The system found this article about\
        \ its child company ACME. Therefore matchedArticleOrgs lists ACME and matchedOrgs lists A Company Manufacturing Everything\
        \ which was in the original query. \n\n A sample unsuccessful response is: \n\n ```js\n {\n \t\"success\": false,\n\
        \ \t\"reason\": \"Bad bvId found\",\n \t\"reasonSupport\": \"123456789 987654321\",\n \t\"count\": 0\n }\n ```\n"
      operationId: handleCorpSimpleSearchUsingGET
      produces:
      - application/json
      parameters:
      - name: bvId
        in: query
        description: One or more Bitvore Iss identifying entities to retrieve news for, should not be used with the portfolio
          or foreignId parameters.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: portfolioId
        in: query
        description: Id identifying a portfolio to retrieve news for, should not be used with the bvId or foreignId parameters.
        required: false
        type: string
        allowEmptyValue: false
      - name: articleType
        in: query
        description: One or more types of articles (i.e., News, PressRelease) to return. By default all types are returned.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: signal
        in: query
        description: One or more signals (i.e., Bankruptcy, Labor.Hiring) to restrict the returned news to.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: theme
        in: query
        description: One or more themes (i.e., Brexit, TradeWar) to restrict the returned news to.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: text
        in: query
        description: Keyword or phrase to search for news when not using a portfolio
        required: false
        type: string
        allowEmptyValue: false
      - name: foreignId
        in: query
        description: One or more Foreign IDs identifying the entities to retrieve news for, the IDs must be registered in
          an identification scheme associated with the API client. Should not be used with the bvId or portfolio parameters.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: startDate
        in: query
        description: News date to start from. Format is yyyy-mm-dd for daily news or yyyy-mm-dd'T'HH:mm if you want it down
          to the hour or minute. Should not be used if offset parameter is.
        required: false
        type: string
        allowEmptyValue: false
      - name: endDate
        in: query
        description: News date to end with. Format is yyyy-mm-dd for daily (inclusive) news or yyyy-mm-dd'T'HH:mm if you want
          it down to the hour or minute. If startDate is used and endDate is not the default endDate is today.
        required: false
        type: string
        allowEmptyValue: false
      - name: offset
        in: query
        description: Number of days back news should be returned for. Should not be used with startDate. Default is 31.
        required: false
        type: integer
        format: int32
        allowEmptyValue: false
      - name: tz
        in: query
        description: Timezone used in startDate and endDate.
        required: false
        type: string
        default: GMT
        allowEmptyValue: false
      - name: dateType
        in: query
        description: Indicates whether dates to query by should be published dates "published" or available dates (processing
          completed) "available". Default is published.
        required: false
        type: string
        default: published
        allowEmptyValue: false
      - name: pageNo
        in: query
        description: Page number of the total result set to return, default is 1.
        required: false
        type: integer
        default: 1
        format: int32
        allowEmptyValue: false
      - name: pageSize
        in: query
        description: Number of results out of the total result set per page to return, default is 100, maximum is 1000.
        required: false
        type: integer
        default: 100
        format: int32
        allowEmptyValue: false
      - name: significance
        in: query
        description: Significance of articles to return, possible values are "HIGH" and "MEDIUM", default is "HIGH". The parameter
          is a threshold so a value of MEDIUM will return MEDIUM and HIGH significance articles.
        required: false
        type: string
        default: HIGH
        allowEmptyValue: false
      - name: similarity
        in: query
        description: Indicates which (if any) similar articles should be returned, options are "Usage" and "None", default
          is "None". "Usage" indicates similar articles can be returned if they have different usage restrictions.
        required: false
        type: string
        default: None
        allowEmptyValue: false
      - name: orgField
        in: query
        description: One or more fields to return for each organization associated with the returned articles, by default
          only the organization's Id and name is returned.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      responses:
        '200':
          description: Success
          schema:
