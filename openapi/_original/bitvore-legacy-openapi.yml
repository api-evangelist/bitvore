  /econnews:
    get:
      tags:
      - Economic News
      summary: Economic News Query
      description: "Provides the ability to search for news relevant to economy of a location or region: \n * State - Querying\
        \ by state returns only news articles that have been written about events that have occurred within the given state.\
        \ \n * City - Querying by city returns only news articles that have been written about events that have occurred within\
        \ the given city. This option requires the use of the State option to avoid ambiguity. \n * FIPS - Querying by FIPS\
        \ code returns only news articles that have been written about events that have occurred within the given county or\
        \ CBSA. FIPS codes for counties can be found [here](https://www.census.gov/prod/techdoc/cbp/95-96cd/fips-st.pdf).\
        \ FIPS codes for CBSAs can be found [here](https://www2.census.gov/programs-surveys/cps/methodology/2015%20Geography%20Cover.pdf).\
        \ Maps of CBSAs can be found [here](https://www.census.gov/geographies/reference-maps/2020/geo/cbsa.html). \n * Free\
        \ Form Text Search - A search for words or phrases can be performed against the articles matching any of the previous\
        \ options listed. \n * Significance - Articles are classified by their significance. A highly significant article\
        \ is one that is alert worthy whereas less significant articles are more relevant when performing research. This option\
        \ will filter the results returned by the previous options listed. \n can affect performance. In order to guarantee\
        \ our SLA the number of articles returned will be reduced. \n \n\n The following is an example of using the API. \n\
        \n To query for the economic news about Irvine, California between 7/1/2018 and 7/31/2018 : \n\n ```js\n GET /econnews?state=ca&city=irvine&startDate=2018-07-01&endDate=2018-07-31&tz=PST\
        \ HTTP 1.1\n Accept: application/json\n X-BV-APIKEY: xyz123... \n ```\n \n\n A sample successful response is: \n\n\
        \ ```js\n {\n \t\"success\": true,\n \t\"returned\": 1,\n \t\"total\": 1, \n \t\"response\": [\n \t\t{\n \t\t\t\"\
        key\": \"070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c\",\n \t\t\t\"articleType\": \"News\",\n \t\t\t\"\
        title\": \"Irvine And Carlsbad Water Agreement\",\n \t\t\t\"sourceName\": \"dailyexpress.com\",\n \t\t\t\"sourceUrl\"\
        : \"http://ct.moreover.com/?a=41646891667&p=5jw&v=1&x=yg6DsqTFf8IC8ym026-o0A\",\n \t\t\t\"previewImageUrl\": \"http://dailyexpress.com/resources/irvine-carlsbad.jpg\"\
        ,\n \t\t\t\"excerpt\": \"Irvine has agreed to buy water from the City of Carlsbad. The Carlsbad desalination ...\"\
        ,\n \t\t\t\"locations\": [\"/Orange County/California/United States\", \"Los Angeles//California/United States\"],\n\
        \ \t\t\t\"sentiment\" : 0.28571313, \n \t\t\t\"significance\": \"HIGH\",\n \t\t\t\"publishedAt\": \"2017-06-29T21:41:19.109Z\"\
        ,\n \t\t\t\"availableAt\": \"2017-06-29T21:41:21.109Z\",\n \t\t}\n \t]\n }\n ```\n A sample unsuccessful response\
        \ is: \n\n ```js\n {\n \t\"success\": false,\n \t\"reason\": \"Invalid state specified\",\n \t\"reasonSupport\": \"\
        san irvine\",\n \t\"count\": 0\n }\n ```\n"
      operationId: handleEconSearchUsingGET
      produces:
      - application/json
      parameters:
      - name: state
        in: query
        description: State to retrieve municipal and economic news for. Must not be used with the cusip or portfolio parameters.
        required: false
        type: string
        allowEmptyValue: false
      - name: city
        in: query
        description: City to retrieve municipal and economic news for, must be used with the state parameter and not with
          the cusip or portfolio parameters.
        required: false
        type: string
        allowEmptyValue: false
      - name: fips
        in: query
        description: FIPS code to retrieve municipal and economic news for. Must not be used with the cusip or portfolio parameters.
        required: false
        type: string
        allowEmptyValue: false
      - name: text
        in: query
        description: Keyword or phrase to search for news when not using a portfolio
        required: false
        type: string
        allowEmptyValue: false
      - name: startDate
        in: query
        description: News date to start from. Format is yyyy-mm-dd for daily news or yyyy-mm-dd'T'HH:mm if you want it down
          to the hour or minute. Should not be used if offset parameter is.
        required: false
        type: string
        allowEmptyValue: false
      - name: endDate
        in: query
        description: News date to end with. Format is yyyy-mm-dd for daily (inclusive) news or yyyy-mm-dd'T'HH:mm if you want
          it down to the hour or minute. If startDate is used and endDate is not the default endDate is today.
        required: false
        type: string
        allowEmptyValue: false
      - name: offset
        in: query
        description: Number of days back news should be returned for. Should not be used with startDate. Default is 31.
        required: false
        type: integer
        format: int32
        allowEmptyValue: false
      - name: tz
        in: query
        description: Timezone used in startDate and endDate.
        required: false
        type: string
        default: GMT
        allowEmptyValue: false
      - name: dateType
        in: query
        description: Indicates whether dates to query by should be published dates "published" or available dates (processing
          completed) "available". Default is published.
        required: false
        type: string
        default: published
        allowEmptyValue: false
      - name: pageNo
        in: query
        description: Page number of the total result set to return, default is 1.
        required: false
        type: integer
        default: 1
        format: int32
        allowEmptyValue: false
      - name: pageSize
        in: query
        description: Number of results out of the total result set per page to return, default is 100, maximum is 1000.
        required: false
        type: integer
        default: 100
        format: int32
        allowEmptyValue: false
      - name: significance
        in: query
        description: Significance of articles to return, possible values are "HIGH" and "MEDIUM", default is "HIGH". The parameter
          is a threshold so a value of MEDIUM will return MEDIUM and HIGH significance articles.
        required: false
        type: string
        default: HIGH
        allowEmptyValue: false
