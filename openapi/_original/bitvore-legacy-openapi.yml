  /muninews:
    get:
      tags:
      - Muni News
      summary: Municipal News Query
      description: "Provides the ability to search for news relevant to municipal bonds. The search criteria used when querying\
        \ news includes the following options: \n * CUSIP - Querying by CUSIP returns only news articles where the identified\
        \ bond is somehow affected by the subject matter of an article.\n * Portfolio - A portfolio is made up of one or more\
        \ CUSIPs. Querying by portfolio returns only news articles where any of the bonds in the portfolio are affected by\
        \ the subject matter of an article. This option cannot be used with the CUSIP option. \n * State - Querying by state\
        \ returns only news articles that have been written about events that have occurred within the given state. This option\
        \ cannot be combined with the CUSIP or Portfolio options. \n * City - Querying by city returns only news articles\
        \ that have been written about events that have occurred within the given city. This option requires the use of the\
        \ State option to avoid ambiguity. This option cannot be combined with the CUSIP or Portfolio options. \n * FIPS -\
        \ Querying by FIPS code returns only news articles that have been written about events that have occurred within the\
        \ given county or CBSA. FIPS codes for counties can be found [here](https://www.census.gov/prod/techdoc/cbp/95-96cd/fips-st.pdf).\
        \ FIPS codes for CBSAs can be found [here](https://www2.census.gov/programs-surveys/cps/methodology/2015%20Geography%20Cover.pdf).\
        \ Maps of CBSAs can be found [here](https://www.census.gov/geographies/reference-maps/2020/geo/cbsa.html). \n * Sector\
        \ - Querying by sector returns only news articles that are written about the given sector. The sectors supported are:\
        \ \n \t* Development \n \t* Education \n \t* HigherEducation \n \t* PrimarySecondaryEducation \n \t* Health \n \t\
        * Housing \n \t* LocalGov \n \t* TaxRevenue \n \t* Transportation \n \t* Utility \n \n This option cannot be combined\
        \ with the CUSIP or Portfolio options. \n * Free Form Text Search - A search for words or phrases can be performed\
        \ against the articles matching any of the previous options listed. \n * Article Type - Type of articles to return,\
        \ News or PressRelease. By default all types are returned.\n * Significance - Articles are classified by their significance.\
        \ A highly significant article is one that is alert worthy whereas less significant articles are more relevant when\
        \ performing research. This option will filter the results returned by the previous options listed. \n can affect\
        \ performance. In order to guarantee our SLA the number of articles returned will be reduced. \n * Include CUSIPs\
        \ - Return ALL cusips affected by the subject matter of an article. This option requires a verified CGS license. \n\
        \ \n\n The following are some examples of using the API. \n\n To query for the news about the 00037CSW1 CUSIP published\
        \ within the last 3 days in the PST timezone (using query param for api key): \n\n ```js\n GET /muninews?cusip=00037CSW1&offset=3&tz=PST&key=xyz123\
        \ HTTP 1.1\n Accept: application/json\n ```\n \n\n To query for the news about a portfolio between 1:00 and 2:00 PM\
        \ PST on 7/1/2018 (using HTTP header for api key): \n\n ```js\n GET /muninews?portfolioId=12345&startDate=2018-07-01T13:00:00&endDate=2018-07-01T14:00:00&tz=PST\
        \ HTTP 1.1\n Accept: application/json\n X-BV-APIKEY: xyz123... \n ```\n \n\n To query for the news about the education\
        \ sector in California between 7/1/2018 and 7/31/2018 : \n\n ```js\n GET /muninews?state=ca&sector=education&startDate=2018-07-01&endDate=2018-07-31&tz=PST\
        \ HTTP 1.1\n Accept: application/json\n X-BV-APIKEY: xyz123... \n ```\n \n\n The metadata tags of articles specific\
        \ to municipal news returned in addition to the common tags above are: \n * CUSIPs - 0 or more CUSIPs identifying\
        \ bonds affected by the news article. \n * Sectors - 0 or more sectors the article is reporting news about. \n * Significance\
        \ - The significance of the article, high or medium. \n \n\n A sample successful response is: \n\n ```js\n {\n \t\"\
        success\": true,\n \t\"returned\": 1,\n \t\"total\": 1, \n \t\"response\": [\n \t\t{\n \t\t\t\"key\": \"070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c\"\
        ,\n \t\t\t\"articleType\": \"News\",\n \t\t\t\"title\": \"Irvine And Carlsbad Water Agreement\",\n \t\t\t\"sourceName\"\
        : \"dailyexpress.com\",\n \t\t\t\"sourceUrl\": \"http://ct.moreover.com/?a=41646891667&p=5jw&v=1&x=yg6DsqTFf8IC8ym026-o0A\"\
        ,\n \t\t\t\"previewImageUrl\": \"http://dailyexpress.com/resources/irvine-carlsbad.jpg\",\n \t\t\t\"excerpt\": \"\
        Irvine has agreed to buy water from the City of Carlsbad. The Carlsbad desalination ...\",\n \t\t\t\"matchedCusips\"\
        : [\"00037CSW1\"],\n \t\t\t\"locations\": [\"/Orange County/California/United States\", \"Los Angeles//California/United\
        \ States\"],\n \t\t\t\"sectors\": [\"Utilities\"],\n \t\t\t\"sentiment\" : 0.28571313, \n \t\t\t\"significance\":\
        \ \"HIGH\",\n \t\t\t\"publishedAt\": \"2017-06-29T21:41:19.109Z\",\n \t\t\t\"availableAt\": \"2017-06-29T21:41:21.109Z\"\
        ,\n \t\t}\n \t]\n }\n ```\n A sample unsuccessful response is: \n\n ```js\n {\n \t\"success\": false,\n \t\"reason\"\
        : \"Bad cusips found\",\n \t\"reasonSupport\": \"123456789 987654321\",\n \t\"count\": 0\n }\n ```\n"
      operationId: handleMuniSearchUsingGET
      produces:
      - application/json
      parameters:
      - name: portfolioId
        in: query
        description: Id identifying a portfolio to retrieve news for, should not be used with the cusip parameter.
        required: false
        type: string
        allowEmptyValue: false
      - name: cusip
        in: query
        description: One or more CUSIPs identifying the bonds to retrieve news for, should not be used with the portfolio
          parameter.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: state
        in: query
        description: State to retrieve news for. Must not be used with the cusip or portfolio parameters.
        required: false
        type: string
        allowEmptyValue: false
      - name: city
        in: query
        description: City to retrieve news for, must be used with the state parameter and not with the cusip or portfolio
          parameters.
        required: false
        type: string
        allowEmptyValue: false
      - name: fips
        in: query
        description: FIPS code to retrieve news for, must not be used with the cusip or portfolio parameters.
        required: false
        type: string
        allowEmptyValue: false
      - name: sector
        in: query
        description: Sector to retrieve news for, must be used with the state parameter and not with the cusip, or portfolio
          parameters.
        required: false
        type: string
        allowEmptyValue: false
      - name: articleType
        in: query
        description: One or more types of articles (i.e., News, PressRelease) to return. By default all types are returned.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: text
        in: query
        description: Keyword or phrase to search for news when not using a portfolio
        required: false
        type: string
        allowEmptyValue: false
      - name: startDate
        in: query
        description: News date to start from. Format is yyyy-mm-dd for daily news or yyyy-mm-dd'T'HH:mm if you want it down
          to the hour or minute. Should not be used if offset parameter is.
        required: false
        type: string
        allowEmptyValue: false
      - name: endDate
        in: query
        description: News date to end with. Format is yyyy-mm-dd for daily (inclusive) news or yyyy-mm-dd'T'HH:mm if you want
          it down to the hour or minute. If startDate is used and endDate is not the default endDate is today.
        required: false
        type: string
        allowEmptyValue: false
      - name: offset
        in: query
        description: Number of days back news should be returned for. Should not be used with startDate. Default is 31.
        required: false
        type: integer
        format: int32
        allowEmptyValue: false
      - name: tz
        in: query
        description: Timezone used in startDate and endDate.
        required: false
        type: string
        default: GMT
        allowEmptyValue: false
      - name: dateType
        in: query
        description: Indicates whether dates to query by should be published dates "published" or available dates (processing
          completed) "available". Default is published.
        required: false
        type: string
        default: published
        allowEmptyValue: false
      - name: pageNo
        in: query
        description: Page number of the total result set to return, default is 1.
        required: false
        type: integer
        default: 1
        format: int32
        allowEmptyValue: false
      - name: pageSize
        in: query
        description: Number of results out of the total result set per page to return, default is 100, maximum is 1000.
        required: false
        type: integer
        default: 100
        format: int32
        allowEmptyValue: false
      - name: significance
        in: query
        description: Significance of articles to return, possible values are "HIGH" and "MEDIUM", default is "HIGH". The parameter
          is a threshold so a value of MEDIUM will return MEDIUM and HIGH significance articles.
        required: false
        type: string
        default: HIGH
        allowEmptyValue: false
      - name: includeCusips
        in: query
        description: Return ALL CUSIPs affected by the article. This option requires a verified CUSIP license.
        required: false
        type: boolean
        default: false
        allowEmptyValue: false
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/MuniNewsSearchResponseLegacy'
            originalRef: MuniNewsSearchResponseLegacy
        '401':
          description: Unauthorized to view news
          schema:
            $ref: '#/definitions/ReasonResponse'
            originalRef: ReasonResponse
        '500':
          description: Internal error
          schema:
            $ref: '#/definitions/ReasonResponse'
            originalRef: ReasonResponse
      security:
      - API key:
        - Global
      - BasicAuth:
        - Global
      - OAuth:
        - Global
      deprecated: false
    post:
      tags:
      - Muni News
      summary: Advanced Municipal News Query
      description: "Provides an advanced municipal news search capability. The search criteria used when querying news includes\
        \ a more advanced approach to identifying locations, sections, and a larger number of cusips. The following are the\
        \ options supported for searching the news: \n * CUSIP - Querying by CUSIP returns only news articles where the identified\
        \ bond is somehow affected by the subject matter of an article. Up to 10000 CUSIPs can be queried. \n * Portfolio\
        \ - A portfolio is made up of one or more CUSIPs. Querying by portfolio returns only news articles where any of the\
        \ bonds in the portfolio are affected by the subject matter of an article. This option cannot be used with the CUSIP\
        \ option. \n * Location - Querying by city/state returns only news articles that have been written about events that\
        \ have occurred within a city and/or state. Locations are in the format of city/state/country, i.e., Los Angeles/California/United\
        \ States. United States is assumed if the country is not specified. \n * FIPS - Querying by FIPS code returns only\
        \ news articles that have been written about events that have occurred within the given county or CBSA. FIPS codes\
        \ for counties can be found [here](https://www.census.gov/prod/techdoc/cbp/95-96cd/fips-st.pdf). FIPS codes for CBSAs\
        \ can be found [here](https://www2.census.gov/programs-surveys/cps/methodology/2015%20Geography%20Cover.pdf). Maps\
        \ of CBSAs can be found [here](https://www.census.gov/geographies/reference-maps/2020/geo/cbsa.html). \n * Sector\
        \ - Querying by sector returns only news articles that are written about the given sector. The sectors supported are:\
        \ \n \t* Development \n \t* Education \n \t* HigherEducation \n \t* PrimarySecondaryEducation \n \t* Health \n \t\
        * Housing \n \t* LocalGov \n \t* TaxRevenue \n \t* Transportation \n \t* Utility \n \n This option cannot be combined\
        \ with the CUSIP or Portfolio options. \n * Free Form Text Search - A search for words or phrases can be performed\
        \ against the articles matching any of the previous options listed. \n * Article Type - Type of articles to return,\
        \ News or PressRelease. By default all types are returned.\n * Significance - Articles are classified by their significance.\
        \ A highly significant article is one that is alert worthy whereas less significant articles are more relevant when\
        \ performing research. This option will filter the results returned by the previous options listed. \n * Include CUSIPs\
        \ - Return ALL cusips affected by the subject matter of an article. This option requires a verified CGS license. \n\
        \ \n\n The following are some examples of using the API. \n\n To query for the news about 2 CUSIPs published within\
        \ the last 3 days in the PST timezone (using HTTP header for api key) : \n\n ```js\n POST /muninews \n Accept: application/json\n\
        \ X-BV-APIKEY: xyz123... \n\n { \n \t\"cusip\": [ \"123456789\", \"987654321\" ] \n \t\"offset\": 3, \n \t\"timezone\"\
        : \"PST\" \n } \n ```\n \n\n To query for the news about 2 CUSIPs published within the last 3 days in the PST timezone\
        \ (using HTTP header for api key) : \n\n ```js\n POST /muninews \n Accept: application/json\n X-BV-APIKEY: xyz123...\
        \ \n\n { \n \t\"cusip\": [ \"123456789\", \"987654321\" ] \n \t\"offset\": 3, \n \t\"timezone\": \"PST\" \n } \n ```\n\
        \ \n\n To query for the news about about education and development in Los Angeles and San Francisco between 9:00AM\
        \ PST 7/1/2018 and 5:00PM PST on 7/31/2018 : \n\n ```js\n POST /muninews \n Accept: application/json\n X-BV-APIKEY:\
        \ xyz123... \n\n { \n \t\"sector\": [ \"education\", \"development\" ], \n \t\"location\": [ \"Los Angeles/California\"\
        , \"San Francisco/California\" ], \n \t\"startDate\": \"2018-07-01T09:00:00\", \n \t\"endDate\": \"2018-07-31T17:00:00\"\
        , \n \t\"timezone\": \"PST\" \n } \n ```\n \n\n A sample successful response is: \n\n ```js\n {\n \t\"success\": true,\n\
        \ \t\"returned\": 1,\n \t\"total\": 1, \n \t\"response\": [\n \t\t{\n \t\t\t\"key\": \"070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c\"\
        ,\n \t\t\t\"articleType\": \"News\",\n \t\t\t\"title\": \"Irvine And Carlsbad Water Agreement\",\n \t\t\t\"sourceName\"\
        : \"dailyexpress.com\",\n \t\t\t\"sourceUrl\": \"http://ct.moreover.com/?a=41646891667&p=5jw&v=1&x=yg6DsqTFf8IC8ym026-o0A\"\
        ,\n \t\t\t\"previewImageUrl\": \"http://dailyexpress.com/resources/irvine-carlsbad.jpg\",\n \t\t\t\"excerpt\": \"\
        Irvine has agreed to buy water from the City of Carlsbad. The Carlsbad desalination ...\",\n \t\t\t\"locations\":\
        \ [\"/Orange County/California/United States\", \"Los Angeles//California/United States\"],\n \t\t\t\"sentiment\"\
        \ : 0.28571313, \n \t\t\t\"significance\": \"HIGH\",\n \t\t\t\"publishedAt\": \"2017-06-29T21:41:19.109Z\",\n \t\t\
        \t\"availableAt\": \"2017-06-29T21:41:21.109Z\",\n \t\t}\n \t]\n }\n ```\n A sample unsuccessful response is: \n\n\
        \ ```js\n {\n \t\"success\": false,\n \t\"reason\": \"Invalid state specified\",\n \t\"reasonSupport\": \"san irvine\"\
        ,\n \t\"count\": 0\n }\n ```\n"
      operationId: handleMuniAdvancedSearchUsingPOST
      consumes:
      - application/json
