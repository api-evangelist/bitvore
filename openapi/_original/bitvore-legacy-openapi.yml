      - API key:
        - Global
      - BasicAuth:
        - Global
      - OAuth:
        - Global
      deprecated: false
  /entityapi/entities:
    get:
      tags:
      - Entity
      summary: Organization Search
      description: "Search can be performed using one of two approaches, a lookup or a parameterized query. A lookup takes\
        \ a single string as input to matching entities. The following are the matching rules used. The search results are\
        \ ordered according to the rules. \n\n 1. Exact match on name (case insensitive)\n 2. Exact match on ticker\n 3. Exact\
        \ match on domain name\n 4. Exact match on alias (case insensitive)\n 5. Starts with on name (case insensitive)\n\
        \ 6. Starts with on ticker\n 7. Starts with on domain name\n 8. Starts with on alias (case insensitive)\n \n\n An\
        \ example of performing a lookup is as follows: \n\n ```js\n GET /entityapi/entities?lookup=acme HTTP 1.1\n Accept:\
        \ application/json\n ```\n A paramaterized query takes one or more search parameters. A parameter has a name and one\
        \ or more values. The search will match the company properties and relationships with the parameters and return only\
        \ those that match all input parameters. The following are the supported search parameters: \n\n * name - One or more\
        \ names to search for \n * ticker - One or more tickers to search for \n * domainName - One or more domain names to\
        \ search for. \n * location - One or more locations companies must have their headquarters in. Locations are in the\
        \ format of city/state code/country. If city or state is unspecified the appropriate / delimiters must still be included,\
        \ i.e., /California/United States.  Must not be used with fips or zip. \n * fips - One or more FIPS codes identifying\
        \ counties or CBSAs (metropolitan/micropolitan statistical areas) companies must have their headquarters in. FIPS\
        \ codes for counties can be found [here](https://www.census.gov/prod/techdoc/cbp/95-96cd/fips-st.pdf). FIPS codes\
        \ for CBSAs can be found [here](https://www2.census.gov/programs-surveys/cps/methodology/2015%20Geography%20Cover.pdf).\
        \ Maps of CBSAs can be found [here](https://www.census.gov/geographies/reference-maps/2020/geo/cbsa.html). Must not\
        \ be used with location or zip. \n * zip - One or more zip codes identifying ZIP Code Tabulation Areas (ZCTAs) companies\
        \ must have their headquarters in.  Must not be used with location or fips. \n * naics - One or more [NAICS](https://www.naics.com/search/)\
        \ codes identifying industries the companies must operate in. \n * sic - One or more [SIC](https://www.osha.gov/pls/imis/sicsearch.html)\
        \ codes identifying industries the companies must operate in. \n * revRange - Revenue range (in millions) companies\
        \ must fall in. The range is formated as lower-upper where lower and upper must be one of 0, 1, 10, 50, 100, 500,\
        \ 1000, 10000. The upper bound can be omitted to report over 10B. Note: On 1/11/2020 the range boundary of 200 was\
        \ replaced with 500 and will be no longer supported on 7/1/2020. \n * empRange - Employee range companies must fall\
        \ in. The range is formated as lower-upper where lower and upper must be one of 1, 10, 50, 100, 250, 500, 1000, 5000,\
        \ 10000. The upper bound can be omitted to report over 10000. Note: On 1/11/2020 the range boundary of 200 was replaced\
        \ by 100 and 250 and will be no longer supported on 7/1/2020. \n \n\n An example of performing a parameterized query\
        \ by domain name is \n\n ```js\n GET /entityapi/entities?domainName=acme.com HTTP 1.1\n Accept: application/json\n\
        \ ```\n \n\n 0 or more companies may be returned that match the supplied query criteria. Only summary information\
        \ for each matching company is supplied which includes the following fields: \n\n * ID \n * Name \n * Domain Name\
        \ \n * Ticker \n * State \n * Country \n * Parent \n * Monitoring State \n \n\n A sample successful response is: \n\
        \n ```js\n {\n \t\"success\": true,\n \t\"returned\": 1,\n \t\"total\": 1,\n \t\"response\": [\n \t\t{ \n \t\t\t\"\
        id\": \"b0004i9h2\", \n \t\t\t\"name\": \"LinkedIn\", \n \t\t\t\"domainName\": \"linkedin.com\", \n \t\t\t\"city\"\
        : \"Sunnyvale\", \n \t\t\t\"state\": \"CA\", \n \t\t\t\"country\": \"United States\", \n \t\t\t\"monitored\": \"active\"\
        , \n \t\t\t\"parent\": { \n \t\t\t\t\"id\": \"b00001adv\", \n \t\t\t\t\"name\": \"MICROSOFT CORPORATION\", \n \t\t\
        \t\t\"ticker\": \"MSFT\", \n \t\t\t\t\"domainName\": \"microsoft.com\", \n \t\t\t\t\"state\": \"WA\", \n \t\t\t\t\"\
        country\": \"United States\", \n \t\t\t\t\"monitored\": \"active\" \n \t\t\t} \n \t\t}, \n \t]\n }\n ```\n A sample\
        \ unsuccessful response is: \n\n ```js\n {\n \t\"success\": false,\n \t\"reason\": \"b00000000\",\n \t\"reasonSupport\"\
        : \"No company with BvId b00000000 found.\",\n \t\"returned\": 0,\n \t\"total\": 1\n }\n ```\n"
      operationId: handleOrgLookupUsingGET
