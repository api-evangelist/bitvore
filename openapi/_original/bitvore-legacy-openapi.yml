  /entityapi/matches:
    post:
      tags:
      - Entity
      summary: Organization Matching
      description: "Attempts to find companies matching input specifications made up of a list of property values. Multiple\
        \ companies can be matched in a single call. For each company to match a list of properties and values known by the\
        \ client (the input specification) are passed in. If possible the system will return a single matching company for\
        \ each input specification. If more than one company matches an input specification and there is not one company that\
        \ is more qualified than the others all the candidates will be returned. The following are the company properties\
        \ that can be used in input specifications. More than one value can be supplied for each indicating a match of any\
        \ of the values will be acceptable. \n * Name \n * DomainName \n * Ticker \n * NAICSCode \n * SICCode \n * City \n\
        \ * StateCode \n * Country \n \n\n In the following example we'll try to match two companies. In this case they will\
        \ actually be companies with the same name but by using different properties in the specifications we can see how\
        \ the system matches differently. The first specification will include the company name and the state it's in. The\
        \ second specification will include the company name and its domain name. \n\n ```js\n POST /matches \n Content-Type:\
        \ application/json \n Accept: application/json \n X-BV-APIKEY: xyz123... \n\n [ \n \t{ \n \t\t\"Name\": [\"Bank of\
        \ Commerce\"], \n \t\t\"StateCode\": [\"OK\"] \n \t}, \n \t{ \n \t\t\"Name\": [\"Bank of Commerce\"], \n \t\t\"DomainName\"\
        : [\"bocokonline.com\"] \n \t} \n ] \n ```\n The response to this request will have two sets of matching candidates:\
        \ \n\n ```js\n [ \n \t{ \n \t\t\"spec\": { \n \t\t\t\"Name\": [\"Bank Of Commerce\"], \n \t\t\t\"StateCode\": [\"\
        OK\"] \n \t\t}, \n \t\t\"candidates\": [ \n \t\t\t{ \n \t\t\t\t\"org\": { \n \t\t\t\t\t\"id\": \"d0007i2x0\", \n \t\
        \t\t\t\t\"name\": \"Bank of Commerce\", \n \t\t\t\t\t\"domainName\": \"bocokonline.com\", \n \t\t\t\t\t\"state\":\
        \ \"OK\", \n \t\t\t\t\t... \n \t\t\t\t}, \n \t\t\t\t\"hits\": [\"Name\",\"StateCode\"] \n \t\t\t}, \n \t\t\t{ \n \t\
        \t\t\t\"org\": { \n \t\t\t\t\t\"id\": \"d00078oes\", \n \t\t\t\t\t\"name\": \"Bank of Commerce\", \n \t\t\t\t\t\"\
        domainName\": \"bocokla.com\", \n \t\t\t\t\t\"state\": \"OK\", \n \t\t\t\t\t... \n \t\t\t\t}, \n \t\t\t\t\"hits\"\
        : [\"Name\",\"StateCode\"] \n \t\t\t}, \n \t\t\t{ \n \t\t\t\t\"org\": { \n \t\t\t\t\t\"id\": \"d0007v0mn\", \n \t\t\
        \t\t\t\"name\": \"BANK OF COMMERCE\", \n \t\t\t\t\t\"state\": \"OK\", \n \t\t\t\t\t... \n \t\t\t\t}, \n \t\t\t\t\"\
        hits\": [\"Name\",\"StateCode\"] \n \t\t\t} \n \t\t] \n \t}, \n \t{ \n \t\t\"spec\": { \n \t\t\t\"Name\": [\"Bank\
        \ Of Commerce\"], \n \t\t\t\"DomainName\": [\"bocokonline.com\"] \n \t\t}, \n \t\t\"candidates\": [ \n \t\t\t{ \n\
        \ \t\t\t\t\"org\": { \n \t\t\t\t\t\"id\": \"d0007i2x0\", \n \t\t\t\t\t\"name\": \"Bank of Commerce\", \n \t\t\t\t\t\
        \"domainName\": \"bocokonline.com\", \n \t\t\t\t\t\"state\": \"OK\", \n \t\t\t\t\t... \n \t\t\t\t}, \n \t\t\t\t\"\
        hits\": [\"Name\",\"DomainName\"] \n \t\t\t} \n \t\t] \n \t} \n ] \n ```\n The first set of candidates is returned\
        \ for the name/state combination. There are three companies with the input name and state code. Since that is the\
        \ only input the system could not narrow the candidates down any further. \n\n The second set of candidates is returned\
        \ for the same name but with a domain name instead of a state code. This input specification matched only one company\
        \ in the system which is returned. \n\n The properties that were matched for each candidate are returned in the \"\
        hits\" field. These will match the input specification properties. However, when matching names the system will attempt\
        \ to match the input name against the company names in the Knowledge Graph as well as any known aliases for companies.\
        \ If the input name matched an alias instead of a company name the \"Alias\" property will be returned in \"hits\"\
        ."
      operationId: handleOrgMatchingUsingPOST
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: specs
        description: specs
        required: true
        schema:
          type: array
          items:
            $ref: '#/definitions/OrganizationMatchingSpecification'
            originalRef: OrganizationMatchingSpecification
      responses:
        '200':
          description: Success.
          schema:
            $ref: '#/definitions/SingleOrganizationMatchingResultLegacy'
            originalRef: SingleOrganizationMatchingResultLegacy
        '400':
          description: Invalid parameter used.
          schema:
            $ref: '#/definitions/ReasonResponse'
            originalRef: ReasonResponse
        '500':
          description: Internal error.
          schema:
            $ref: '#/definitions/ReasonResponse'
            originalRef: ReasonResponse
      security:
      - API key:
        - Global
      - BasicAuth:
        - Global
      - OAuth:
        - Global
      deprecated: false
