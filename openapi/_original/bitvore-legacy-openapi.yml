  /sentimentscores:
    get:
      tags:
      - Sentiment Scores
      summary: Sentiment Score Query
      description: "### Sentiment Scores \n\n Returns the daily sentiment scores of a given type for the specified companies\
        \ over a period of time. The scores of up to 10 companies identified by their Bitvore ID (BvId) can be returned in\
        \ a single call. The time period requested can be up to one year. The call options are: \n * BvId - Up to 10 Bitvore\
        \ ID's of companies to return scores for. \n * Score - Type of score to return. Options are growth, risk, and sentiment\
        \ (overall sentiment for a company). \n * Start - First day of the time series to return. In the format of yyyy-MM-dd,\
        \ 2019-10-01 for example. \n * End - Last day of the time series to return. In the format of yyyy-MM-dd, 2019-10-09\
        \ for example. \n \n\n The following is an example of using the API to return the growth scores for IBM, BvId b00001ab7,\
        \ between October 1st and October 7th. \n\n ```js\n GET /sentimentscores?bvId=b00001ab7&score=growth&start=2019-10-01&end=2019-10-07&key=xyz123\
        \ HTTP 1.1\n Accept: application/json\n ```\n \n\n The API response will list the timeline of the returned data series\
        \ as a range. It will then list the scores per day in that range separately for each company requested. The list of\
        \ scores for a company will be identified by the company's BvId. An example of a response is as follows: \n\n ```js\n\
        \ {\n \t\"success\": true,\n \t\"response\": {\n \t\t{\n \t\t\t\"timeline\": {\n \t\t\t\t\"start\": \"2019-10-01\"\
        ,\n \t\t\t\t\"end\": \"2019-10-07\"\n \t\t\t},\n \t\t\t\"series\": [\n \t\t\t\t{\n \t\t\t\t\t\"bvId\": \"b00001ab7\"\
        ,\n \t\t\t\t\t\"scores\": [\n \t\t\t\t\t\t0.4936433,\n \t\t\t\t\t\t0.4936433,\n \t\t\t\t\t\t0.4936433,\n \t\t\t\t\t\
        \t0.15462846,\n \t\t\t\t\t\t0.15462846,\n \t\t\t\t\t\t0.11870702,\n \t\t\t\t\t\t0.11870702\n \t\t\t\t\t]\n \t\t\t\t\
        }\n \t\t\t]\n \t\t}\n \t}\n }\n ```\n"
      operationId: handleSentimentScoreQueryUsingGET
      produces:
      - application/json
      parameters:
      - name: bvId
        in: query
        description: Bitvore IDs (up to 10) of organizations to get sentiment scores for.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: score
        in: query
        description: Type of score to return. Acceptalbe values are sentiment, growth, risk.
        required: false
        type: string
        allowEmptyValue: false
      - name: start
        in: query
        description: Day of the first score to return. Format is yyyy-mm-dd.
        required: false
        type: string
        allowEmptyValue: false
      - name: end
        in: query
        description: Day of the last score to return. Format is yyyy-mm-dd.
        required: false
        type: string
        allowEmptyValue: false
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/OrganizationSentimentScoreResponseLegacy'
            originalRef: OrganizationSentimentScoreResponseLegacy
        '401':
          description: Unauthorized to view intelligence
          schema:
            $ref: '#/definitions/ReasonResponse'
            originalRef: ReasonResponse
        '500':
          description: Internal error
          schema:
            $ref: '#/definitions/ReasonResponse'
            originalRef: ReasonResponse
      security:
      - API key:
        - Global
      - BasicAuth:
        - Global
      - OAuth:
        - Global
      deprecated: false
securityDefinitions:
  API key:
    type: apiKey
    name: X-BV-APIKEY
    in: header
  BasicAuth:
    type: basic
  OAuth:
    type: oauth2
