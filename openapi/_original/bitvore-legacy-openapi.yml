    flow: application
    scopes:
      Global: Includes all Bitvore APIs
definitions:
  BasicResponse:
    type: object
    properties:
      response:
        type: object
        description: Response payload
      success:
        type: boolean
        example: true
        description: Indicates whether the call was successful or not
    title: BasicResponse
    description: Default response wrapper for API requests.
  CorpNewsArticleLegacy:
    type: object
    properties:
      articleType:
        type: string
        example: PressRelease
        description: Type of article. Possible values are "News" and "PressRelease
      availableAt:
        type: string
        example: '2017-06-29T21:41:21.109Z'
        description: Date published
      excerpt:
        type: string
        example: ACME announces long awaited acquisition. The acquisition of Wile E. Coyote was announced Thursday.
        description: Fragment or snippet, of the article
      key:
        type: string
        example: 070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c
        description: Key uniquely identifying the article
      matchedArticleOrgs:
        type: array
        description: List of the primary actors that match the input organization scope directly or indirectly
        items:
          $ref: '#/definitions/OrganizationReference'
          originalRef: OrganizationReference
      matchedOrgs:
        type: array
        description: List of organizations that match the input organization scope that are primary actors in the article
          or related to those primary actors
        items:
          $ref: '#/definitions/OrganizationReference'
          originalRef: OrganizationReference
      phrases:
        type: array
        example: referendum, embassy_attack
        description: Key phrases identified in the news, only available when themes are also identified
        items:
          type: string
      previewImageUrl:
        type: string
        example: http://acme.com/resources/coyote.jpg
        description: URL of a preview image
      publishedAt:
        type: string
        example: '2017-06-29T21:41:21.109Z'
        description: Date available
      referencedOrgHierarchy:
        type: array
        description: List of organizations who are the primary actors in the article and their ancestors (if any)
        items:
          $ref: '#/definitions/OrganizationReference'
          originalRef: OrganizationReference
      referencedOrgs:
        type: array
        description: List of organizations who are the primary actors in the article
        items:
          $ref: '#/definitions/OrganizationReference'
          originalRef: OrganizationReference
      sentiment:
        type: number
        format: double
        example: 0.23456
        description: Sentiment of the article. The value is a decimal value between -1 and 1, under 0 is negative while over
          0 is positive.
      signals:
        type: array
        example: Labor, Labor.Hiring
        description: Material situations/events identified in the news. Signals are represented by a hierarchical taxonomy
          and are '.' encoded to represent that hierarchy
        items:
          type: string
      significance:
        type: string
        example: HIGH
        description: Significance of the article. Possible values are "HIGH" and "MEDIUM"
      similarityClusterId:
        type: string
        example: 075005015cf083aba01f0826ecfe718e965b577c572166b14a77652e
        description: Id of the similarity cluster it belongs to.
      sourceName:
        type: string
        example: businesswire.com, The Washington Daybook
        description: Name or host name of the publisher of the article
      sourceUrl:
        type: string
        example: http://acme.com/press
        description: URL to the original source of the article
      themes:
        type: array
        example: Brexit, TradeWar
        description: Trending topics identified in the news
        items:
          type: string
      title:
        type: string
        example: ACME acquires Wile E. Coyote, Inc.
        description: Title
    title: CorpNewsArticleLegacy
    description: Corp news article.
  CorpNewsSearchResponseLegacy:
    type: object
    required:
    - returned
    - total
    properties:
      reason:
        type: string
        example: Could not locate subject.
        description: Text reason for the failure (if not successful)
      reasonSupport:
        type: string
        example: Longer description of the missing subject.
        description: Additional information about the failure (if not successful)
      response:
        type: array
        description: Response payload
        items:
          $ref: '#/definitions/CorpNewsArticleLegacy'
          originalRef: CorpNewsArticleLegacy
      returned:
        type: integer
        format: int32
        example: 10
        description: Number of news articles returned by search, maximum amount dictated by the pageSize parameter used in
          search
      success:
        type: boolean
        example: true
        description: Indicates whether the call was successful or not
      total:
        type: integer
        format: int32
        example: 100
        description: Total Number of news articles found by search
    title: CorpNewsSearchResponseLegacy
    description: Corp news search response.
  CorporateNewsRequestLegacy:
    type: object
    properties:
      articleType:
        type: array
        example:
        - News
        - PressRelease
        description: One or more types of articles to return. By default all types are returned.
        items:
          type: string
      dateType:
        type: string
        example: available
        description: Indicates whether dates to query by should be published dates "published" or available dates (processing
          completed) "available". Default is published.
      endDate:
        type: string
        example: '2018-08-01T12:00:00'
        description: News date to end with. Format is yyyy-mm-dd for daily (inclusive) news or yyyy-mm-dd'T'HH:mm if you want
          it down to the hour or minute. If startDate is used and endDate is not the default endDate is today.
      offset:
        type: integer
        format: int32
        example: 14
        description: Number of days back news should be returned for. Should not be used with startDate. Default is 31.
      orgField:
        type: array
        example:
        - name
        - ticker
        description: One or more fields to return for each organization associated with the returned articles, by default
          only the organization's Id and name is returned. Available options are name, domainName, ticker, city, state, country
        items:
          type: string
      orgScope:
        description: Identifies the companies/organizations that should be the subject of the news to be returned. Only one
          of the supported options should be used at a time.
        $ref: '#/definitions/OrganizationScopeLegacy'
        originalRef: OrganizationScopeLegacy
      pageNo:
        type: integer
        format: int32
        example: 1
        description: Page number of the total result set to return, default is 1.
      pageSize:
        type: integer
        format: int32
        example: 100
        description: Number of results out of the total result set per page to return, default is 100, maximum is 1000.
      signal:
        type: array
        example:
        - Business.MergerAcquisitions
        - Business.FinancialFilings
        description: One or more signals to restrict the returned news to.
        items:
          type: string
      significance:
        type: string
        example: HIGH
        description: Significance of articles to return, possible values are "HIGH" and "MEDIUM", default is "HIGH". The parameter
          is a threshold so a value of MEDIUM will return MEDIUM and HIGH significance articles.
      similarity:
        type: string
        description: Indicates which (if any) similar articles should be returned, options are "Usage" and "None", default
          is "None". "Usage" indicates similar articles can be returned if they have different usage restrictions.
      startDate:
        type: string
        example: '2018-08-01T12:00:00'
        description: News date to start from. Format is yyyy-mm-dd for daily news or yyyy-mm-dd'T'HH:mm if you want it down
          to the hour or minute. Should not be used if offset parameter is.
      text:
        type: string
        example: blockchain
        description: Keyword or phrase to search for news when not using a portfolio
      theme:
        type: array
        example:
        - Brexit
        - TradeWar
        description: One or more themes to restrict the returned news to.
        items:
          type: string
      timezone:
        type: string
        example: PST
        description: Timezone used in startDate and endDate.
    title: CorporateNewsRequestLegacy
    description: Query criteria for returning corporate news.
  EconomicNewsArticleLegacy:
    type: object
    properties:
      articleType:
        type: string
        example: PressRelease
        description: Type of article. Possible values are "News" and "PressRelease
      availableAt:
        type: string
        example: '2017-06-29T21:41:21.109Z'
        description: Date published
      excerpt:
        type: string
        example: ACME announces long awaited acquisition. The acquisition of Wile E. Coyote was announced Thursday.
        description: Fragment or snippet, of the article
      key:
        type: string
        example: 070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c
        description: Key uniquely identifying the article
      locations:
        type: array
        example: Irvine//California/United States, /San Diego County/California/United States
        description: Locations affected. A location is at the city or county level. It is encoded as city/county/state/country
          where if the city is specified the county will not be and vice-versa
        items:
          type: string
      previewImageUrl:
        type: string
        example: http://acme.com/resources/coyote.jpg
        description: URL of a preview image
      publishedAt:
        type: string
        example: '2017-06-29T21:41:21.109Z'
        description: Date available
      sentiment:
        type: number
        format: double
        example: 0.23456
        description: Sentiment of the article. The value is a decimal value between -1 and 1, under 0 is negative while over
          0 is positive.
      significance:
        type: string
        example: HIGH
        description: Significance of the article. Possible values are "HIGH" and "MEDIUM"
      sourceName:
        type: string
        example: businesswire.com, The Washington Daybook
        description: Name or host name of the publisher of the article
      sourceUrl:
        type: string
        example: http://acme.com/press
        description: URL to the original source of the article
      title:
        type: string
        example: ACME acquires Wile E. Coyote, Inc.
        description: Title
    title: EconomicNewsArticleLegacy
    description: Single economic news article.
  EconomicNewsSearchResponseLegacy:
    type: object
    required:
    - returned
    - total
    properties:
      reason:
        type: string
        example: Could not locate subject.
        description: Text reason for the failure (if not successful)
      reasonSupport:
        type: string
        example: Longer description of the missing subject.
        description: Additional information about the failure (if not successful)
      response:
        type: array
        description: Response payload
        items:
          $ref: '#/definitions/EconomicNewsArticleLegacy'
          originalRef: EconomicNewsArticleLegacy
      returned:
        type: integer
        format: int32
        example: 10
        description: Number of news articles returned by search, maximum amount dictated by the pageSize parameter used in
          search
      success:
        type: boolean
        example: true
        description: Indicates whether the call was successful or not
      total:
        type: integer
        format: int32
        example: 100
        description: Total Number of news articles found by search
    title: EconomicNewsSearchResponseLegacy
    description: Economic news search response.
