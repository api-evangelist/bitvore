  MunicipalNewsRequestLegacy:
    type: object
    properties:
      articleType:
        type: array
        example:
        - PressRelease
        description: One or more types of articles (i.e., News, PressRelease) to return. By default all types are returned.
        items:
          type: string
      cusip:
        type: array
        example:
        - '123456789'
        - '987654321'
        description: One or more CUSIPs identifying the bonds to retrieve news for, should not be used with the portfolio
          property.
        items:
          type: string
      dateType:
        type: string
        example: available
        description: Indicates whether dates to query by should be published dates "published" or available dates (processing
          completed) "available". Default is published.
      endDate:
        type: string
        example: '2018-08-01T12:00:00'
        description: News date to end with. Format is yyyy-mm-dd for daily (inclusive) news or yyyy-mm-dd'T'HH:mm if you want
          it down to the hour or minute. If startDate is used and endDate is not the default endDate is today.
      fips:
        type: array
        example:
        - '31080'
        - '06037'
        description: One or more FIPS codes to restrict the returned news to. Must not be used with the cusip or portfolio
          properties.
        items:
          type: string
      includeCusips:
        type: boolean
        example: true
        description: Return ALL cusips affected by the article. This option requires a verified CGS license, default is false
      location:
        type: array
        example:
        - los angeles/ca
        - fl
        description: One or more locations to restrict the returned news to. Can be a state code or a city/state combination.
          Must not be used with the cusip or portfolio properties.
        items:
          type: string
      offset:
        type: integer
        format: int32
        example: 14
        description: Number of days back news should be returned for. Should not be used with startDate. Default is 31.
      pageNo:
        type: integer
        format: int32
        example: 1
        description: Page number of the total result set to return, default is 1.
      pageSize:
        type: integer
        format: int32
        example: 100
        description: Number of results out of the total result set per page to return, default is 100, maximum is 1000.
      portfolioId:
        type: string
        example: 10001
        description: Id identifying a portfolio to retrieve news for, should not be used with the cusip property.
      sector:
        type: array
        example:
        - education
        description: Sector to retrieve news for, must be used with the location property and not with the cusip, or portfolio
          properties.
        items:
          type: string
      significance:
        type: string
        example: HIGH
        description: Significance of articles to return, possible values are "HIGH" and "MEDIUM", default is "HIGH". The property
          is a threshold so a value of MEDIUM will return MEDIUM and HIGH significance articles.
      startDate:
        type: string
        example: '2018-08-01T12:00:00'
        description: News date to start from. Format is yyyy-mm-dd for daily news or yyyy-mm-dd'T'HH:mm if you want it down
          to the hour or minute. Should not be used if offset property is.
      text:
        type: string
        example: blockchain
        description: Keyword or phrase to search for news when not using a portfolio
      timezone:
        type: string
        example: PST
        description: Timezone used in startDate and endDate.
    title: MunicipalNewsRequestLegacy
    description: Query criteria for returning municipal news.
