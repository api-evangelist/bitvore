  /financialfiling/submissions:
    get:
      tags:
      - Financial Filings
      summary: Financial Filings Submissions Query
      description: "Returns full submissions for the financial filings that meet the supplied criteria. Financial filings\
        \ can be selected with the following options: \n * Filing Type - Type of filing, i.e., 8-K, 10-Q, etc.\n * Bitvore\
        \ ID - A Bitvore ID, known as a BvId, uniquely identifies a company/organization. Querying by BvId returns only filings\
        \ submitted by that company.\n * Free Form Text Search - A search for words or phrases can be performed against the\
        \ filings matching any of the previous options listed. \n * Include Summary - If set to true a summary file will be\
        \ included with each submission with the fields described in the Get Summary operation. If false no summary file will\
        \ be included. \n * Org Field - By default the subject company of a filing is identified by its ID and its name. Additional\
        \ fields will be returned for each company if specified here. The available options are name, domainName, ticker,\
        \ city, state, and country. If available the additional fields will be returned in the Org object in the summary.\
        \ Note: Returning additional fields may cause a small increase in latency. This option is only applicable if summaries\
        \ are included. \n \n\n This API operation is a file download operation. This call will download a compressed file\
        \ holding the individual files from the original submission. Based on the Accept header provided by the client, the\
        \ download file will either be a gzipped tar file (application/x-gzip) or a zip file (application/zip and the default).\
        \ \n\n The following are some examples of using the API. \n\n To query for the filings submitted by IBM, BvId b00001ab7\
        \ within the last 30 days in the PST timezone using gzip compression (using query param for api key): \n\n ```js\n\
        \ GET /financialfiling/submissions?bvId=b00001ab7&offset=30&tz=PST&key=xyz123 HTTP 1.1\n Accept: application/x-gzip\n\
        \ ```\n \n\n To query for all the 10-Q filings submitted within the last 30 days in the PST timezone and return summary\
        \ information: \n\n ```js\n GET /financialfiling/submissions?filingType=10-Q&includeSummary=true&offset=30&tz=PST&key=xyz123\
        \ HTTP 1.1\n Accept: application/gzip\n ```\n \n\n The file that is downloaded as a result of this call when decompressed\
        \ (and extracted for the tar.gz option) will create a directory structure where each submission will get its own directory\
        \ named with the key of the submission. All of the files that are part of the submission and the optional summary\
        \ file will be placed in its directory. For example: \n\n ```\n 040000016b8b62e290bcb7e16fcb95b79000ad663679cbdb8566671c\
        \ \n \tsummary.json \n \tjune2019slb8-k.htm \n \tex991june2019slb.htm \n \tbxclogoa43.jpg \n \t1301787/000130178719000056/0001301787-19-000056.txt\
        \ \n 050000016b8b61adf8ad07fe0fd21063bd517de42f81fbfc5166671c \n \tsummary.json \n \teh1900853_8k.htm \n \teh1900853_ex0201.htm\
        \ \n \teh1900853_ex1001.htm \n \t0000950142-19-001409.txt \n ```\n"
      operationId: downloadFilingsUsingGET
      produces:
      - application/x-gzip
      - application/zip
      parameters:
      - name: filingType
        in: query
        description: Types of filings to return
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: bvId
        in: query
        description: Organizations of filings to return
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: includeSummary
        in: query
        description: Value of true will return a summary file with the filing files
        required: false
        type: boolean
        allowEmptyValue: false
      - name: text
        in: query
        description: Keyword or phrase to search for in the filings.
        required: false
        type: string
        allowEmptyValue: false
      - name: orgField
        in: query
        description: One or more fields to return for each organization associated with the returned articles, by default
          only the organization's Id and name is returned. Available options are name, domainName, ticker, city, state, country
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: startDate
        in: query
        description: Filing date to start from. Format is yyyy-mm-dd for daily filings or yyyy-mm-dd'T'HH:mm if you want it
          down to the hour or minute. Should not be used if offset parameter is.
        required: false
        type: string
        allowEmptyValue: false
      - name: endDate
        in: query
        description: Filing date to end with. Format is yyyy-mm-dd for daily (inclusive) filings or yyyy-mm-dd'T'HH:mm if
          you want it down to the hour or minute. If startDate is used and endDate is not the default endDate is today.
        required: false
        type: string
        allowEmptyValue: false
      - name: offset
        in: query
        description: Number of days back filings should be returned for. Should not be used with startDate. Default is 31.
        required: false
        type: integer
        format: int32
        allowEmptyValue: false
      - name: tz
        in: query
        description: Timezone used in startDate and endDate.
        required: false
        type: string
        default: GMT
        allowEmptyValue: false
      - name: dateType
        in: query
        description: Indicates whether dates to query by should be submission dates "submitted" or available dates (processing
          completed) "available". Default is submitted.
        required: false
        type: string
        default: submitted
        allowEmptyValue: false
      - name: pageNo
        in: query
        description: Page number of the total result set to return, default is 1.
        required: false
        type: integer
        default: 1
        format: int32
        allowEmptyValue: false
      - name: pageSize
        in: query
        description: Number of results out of the total result set per page to return, default is 100, maximum is 200.
        required: false
        type: integer
        default: 100
        format: int32
        allowEmptyValue: false
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/InputStreamResource'
            originalRef: InputStreamResource
        '401':
          description: Unauthorized to view filings
          schema:
            $ref: '#/definitions/ReasonResponse'
            originalRef: ReasonResponse
        '500':
          description: Internal error
          schema:
            $ref: '#/definitions/ReasonResponse'
            originalRef: ReasonResponse
      security:
      - API key:
        - Global
      - BasicAuth:
        - Global
      - OAuth:
        - Global
      deprecated: false
