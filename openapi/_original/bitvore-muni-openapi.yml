x-tagDescriptions:
  News API: "## News API \n\n The News APIs provide access to curated news annotated with metadata tags. There are three APIs\
    \ that access their own data sets, municipal, economic, and corporate. Each API has a specific way of querying the data\
    \ sets and specific data they return, which is described in each of the respective API descriptions, the [Municipal News\
    \ API](http://developer.bitvore.com/v2/docs/api-reference/corp?tagname=News%20API) and the [Economic News API](http://developer.bitvore.com/v2/docs/api-reference/corp?tagname=News%20API).\
    \ All of the API's are built on a common foundation described below. \n\n A news article is tagged with metadata that\
    \ describes the content of the article. Each data set has its own set of unique tags but there is a common set depicted\
    \ below \n\n ![News Article](https://bitvorestaticassets.blob.core.windows.net/api-docs/news-article.png) \n\n News queries\
    \ are time based. The news can be queried either within a specified time window or by a number of days back in history\
    \ from the current day. The dates used when specifying a time window can be based on the published date of an article\
    \ or the date which the article was made available by the system. When using a polling strategy to query the latest news\
    \ using the API, the available date is recommended as published dates can be less predictable. Due to the large number\
    \ of news articles that may be returned because of a broad criteria or a large window a limit on the number of articles\
    \ to return by the system can be specified. \n\n Responses to queries are capped at 1000 articles. It is possible however\
    \ that there are more than 1000 articles that match a given query. To accommodate queries that match more than the maximum\
    \ size the concept of paging is supported. A page is a set of articles returned by a single query. It may be less than\
    \ the total result set. The client can indicate which page they want returned on each call. This allows the client to\
    \ loop through the result set one page at a time until the entire result set is returned. \n\n Both the page to return\
    \ and the size of the page are specified by the client with the pageNo and pageSize parameters respectively. Each API\
    \ will list these parameter options as either query parameters or properties of the input message body. A query parameter\
    \ example is as follows: \n\n ```js\n GET ...&pageNo=1&pageSize=100 HTTP 1.1\n ```\n \n\n This instructs the API to return\
    \ the first page with a maximum of 100 articles in it. Each news response will identify the number of articles returned\
    \ for the current page and the total number of articles in the result set so the client can loop if needed. For example:\
    \ \n\n ```js\n {\n \t\"success\": true,\n \t\"returned\": 100,\n \t\"total\": 1000, \n \t... \n ``` \n The above response\
    \ indicates the requested page of 100 articles are in the response but there were a total of 1000 articles that matched\
    \ the query. To then ask for the second page of the result set the pageNo parameter would be incremented as follows: \n\
    \n ```js\n GET ...&pageNo=2&pageSize=100 HTTP 1.1\n ```\n \n\n In this example the next response will return the 101st\
    \ to 200th article in the result set. \n\n The corporate and municipal data sets require their own API key. The economic\
    \ data set is shared between the corporate and municipal data sets and does not require its own key. To register for an\
    \ API Key please contact the [Products Team](mailto:products@bitvore.com). The API key can be used directly or to obtain\
    \ an OAuth access token as described on the [Security APIs](http://developer.bitvore.com/v2/docs/security) page. \n\n"
  Portfolios API: "## Portfolios API \n\n Bitvore RESTful APIs useful for integrating with a muni portfolio so that querying\
    \ news articles can be focused on relevant muni information and performed in a simplified manner. \n\n The Municipal News\
    \ API key can be used to access the Portfolio APIs. To register for an API Key please contact [customer support](mailto:support@bitvore.com).\
    \ The API key can be used directly or to obtain an OAuth access token as described on the [Security APIs](http://developer.bitvore.com/v2/docs/security)\
    \ page. \n\n ### Portfolio Management API \n\n The Portfolio Management API provides the ability to create, or replicate\
    \ a portfolio in the Bitvore system. The entities to be tracked in the portfolio are identified by CUSIPs. The benefit\
    \ of creating a portfolio in Bitvore is the news APIs both take a portfolio ID as a parameter making it easy to retrieve\
    \ news for a portfolio. \n\n A set of sample CSV files listing companies found [here](http://developer.bitvore.com/v2/docs/api-reference/portfolios)\
    \ can be used to quickly create portfolios of your own. Simply download the CSV file you want to create your portfolio\
    \ with, create a new CUSIP portfolio, and then use the [Upload Portfolio Items](http://developer.bitvore.com/v2/docs/api-reference/corp?tagname=Portfolios%20API)\
    \ API call to fill the new portfolio from the CSV file. Note the portfolio ID generated and then use that ID when querying\
    \ for portfolio news using the [Muni News API](http://developer.bitvore.com/v2/docs/api-reference/muni?tagname=News%20API).\
    \ \n\n ## Custom Ids (Id Mapping) \n\n Portfolio items support the mapping of custom ids. These custom Ids are not required,\
    \ but when used along with the other APIs, it helps facilitate the mapping, discovery and identification of these ids\
    \ to existing Bitvore Ids. \n\n To include a mapping, construct an PortfolioItem and ItemCustomId as followed \n\n ```js\n\
    \ { \n \t \"id\": \"1823062A7\", \n \t \"customIds\": \n \t\t[{ \n \t\t\"id\": \"Clarkstown NY\", \n \t\t\"type\": \"\
    FOREIGN_NAME\" \n \t}, \n \t{ \n \t\t\"id\": \"0x000ABC\", \n \t\t\"type\": \"FOREIGN_ID\" \n \t}] \n } \n ```\n \n\n\
    \ Please note when using the Portfolio API, you should not mix the use of update items by 'Ids' and 'Items' as they can\
    \ overwrite existing data. \n \n\n "
