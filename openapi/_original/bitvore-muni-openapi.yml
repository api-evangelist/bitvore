swagger: '2.0'
info:
  description: "### Cellenus Municipal APIs\r\nThe Cellenus Municipal APIs consists of two main datasets, \"Muni & Economic\"\
    \ and \"Muni ESG\" which contains curated news articles that are relevant to municipal obligors and bonds, including news\
    \ about municipalities, economic news for geographic locations, and sector (healthcare, education, etc) specific news.\r\
    \n\r\nA typical news article in the dataset is depicted below.\r\n\r\n ![News Article](https://bitvorestaticassets.blob.core.windows.net/api-docs/muni-news-article.png)\r\
    \n\r\nAccess to the Municipal Dataset using the Precision News API requires its own license and API key.  To register\
    \ for an API Key please visit [here](http://developer.bitvore.com/v2/getting-started?section=obtain-api-key). \r\n\r\n\
    When you license the Municipal News APIs you are given access to two different Bitvore APIs, [Muni News](http://developer.bitvore.com/v2/docs/overview/muni?tagname=News%20API),\
    \ [Economic News](http://developer.bitvore.com/v2/docs/overview/muni?tagname=News%20API) and [Portfolio Management](http://developer.bitvore.com/v2/docs/overview//muni?tagname=Portfolios%20API).\r\
    \n\r\nThe [Municipal News API](http://developer.bitvore.com/v2/docs/overview/muni?tagname=News%20API) provides direct\
    \ access to the curated news based on CUSIP, portfolio, location, or business sector.\r\n\r\nThe [Economic News API](http://developer.bitvore.com/v2/docs/overview/muni?tagname=News%20API)\
    \ provides direct access to the curated news relevant to the economy of a location or region.\r\n\r\nThe [Portfolio Management\
    \ API](http://developer.bitvore.com/v2/docs/overview/muni?tagname=Portfolios%20API) provides the ability to create and\
    \ maintain portfolios of CUSIPs so that news can be queried in a single call from the [News API](http://developer.bitvore.com/v2/docs/overview/muni?tagname=News%20API)\
    \ for a given portfolio."
  version: '2.0'
  title: Muni APIs
  license:
    name: Copyright Bitvore Corp. 2026
host: api.bitvore.com
basePath: /
tags:
- name: News API
  description: Muni and Economic News
- name: Portfolios API
  description: Manage CUSIP-based Portfolios
paths:
  /v2/muni/econnews/byfips:
    get:
      tags:
      - News API
      summary: Economic News Search by FIPS
      description: "Provides the ability to search for news relevant to economy of a region: \n * FIPS - Querying by FIPS\
        \ code returns only news articles that have been written about events that have occurred within the given county or\
        \ CBSA. FIPS codes for counties can be found [here](https://www.census.gov/prod/techdoc/cbp/95-96cd/fips-st.pdf).\
        \ FIPS codes for CBSAs can be found [here](https://www2.census.gov/programs-surveys/cps/methodology/2015%20Geography%20Cover.pdf).\
        \ Maps of CBSAs can be found [here](https://www.census.gov/geographies/reference-maps/2020/geo/cbsa.html). \n * Free\
        \ Form Text Search - A search for words or phrases can be performed against the articles matching any of the previous\
        \ options listed. \n * Significance - Articles are classified by their significance. A highly significant article\
        \ is one that is alert worthy whereas less significant articles are more relevant when performing research. This option\
        \ will filter the results returned by the previous options listed. \n \n\n The following is an example of using the\
        \ API. \n\n To query for the economic news about the Los Angeles region using the FIPS code 037 between 7/1/2018 and\
        \ 7/31/2018 : \n\n ```js\n GET https://api.bitvore.com/v2/corp/econnews?fips=037&startDate=2018-07-01T00:00:00.000+07:00&endDate=2018-07-31T23:59:59.999+07:00\n\
        \ ```\n \n\n A sample successful response is: \n\n ```js\n {\n \t\"success\": true,\n \t\"returned\": 1,\n \t\"total\"\
        : 1, \n \t\"response\": [\n \t\t{\n \t\t\t\"key\": \"070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c\",\n\
        \ \t\t\t\"articleType\": \"News\",\n \t\t\t\"title\": \"Irvine And Carlsbad Water Agreement\",\n \t\t\t\"sourceName\"\
        : \"dailyexpress.com\",\n \t\t\t\"sourceUrl\": \"http://ct.moreover.com/?a=41646891667&p=5jw&v=1&x=yg6DsqTFf8IC8ym026-o0A\"\
        ,\n \t\t\t\"previewImageUrl\": \"http://dailyexpress.com/resources/irvine-carlsbad.jpg\",\n \t\t\t\"excerpt\": \"\
        Irvine has agreed to buy water from the City of Carlsbad. The Carlsbad desalination ...\",\n \t\t\t\"locations\":\
        \ [\"/Orange County/California/United States\", \"Los Angeles//California/United States\"],\n \t\t\t\"sentiment\"\
        \ : 0.28571313, \n \t\t\t\"esgSentiment\" : 0.78078979, \n \t\t\t\"significance\": \"HIGH\",\n \t\t\t\"articleLocations\"\
        : [\"United States\"],\n \t\t\t\"sourceLocation\": \"Germany\",\n \t\t\t\"publishedAt\": \"2017-06-29T21:41:19.109Z\"\
        ,\n \t\t\t\"availableAt\": \"2017-06-29T21:41:21.109Z\",\n \t\t}\n \t]\n }\n ```\n A sample unsuccessful response\
        \ is: \n\n ```js\n {\n \t\"success\": false,\n \t\"reason\": \"Invalid state specified\",\n \t\"reasonSupport\": \"\
        san irvine\",\n \t\"count\": 0\n }\n ```\n"
      operationId: handleFipsEconSearchUsingGET_1
      produces:
      - '*/*'
      parameters:
      - name: fips
        in: query
        description: FIPS code to retrieve municipal and economic news for.
        required: true
        type: string
        allowEmptyValue: false
      - name: text
        in: query
        description: Keyword or phrase to search for news
        required: false
        type: string
        allowEmptyValue: false
      - name: startDate
        in: query
        description: News date to start from. Time offset will be converted to UTC (Z).
        required: false
        type: string
        format: date-time
        allowEmptyValue: false
        x-example: '2021-04-10T00:00:00Z'
      - name: endDate
        in: query
        description: News date to end with. Time offset will be converted to UTC (Z)
        required: false
        type: string
        format: date-time
        allowEmptyValue: false
        x-example: '2021-04-11T23:59:59Z'
      - name: dateType
        in: query
        description: Indicates whether dates to query by should be published dates "published" or available dates (processing
          completed) "available". Default is published.
        required: false
        type: string
        default: published
        allowEmptyValue: false
      - name: pageNo
        in: query
        description: Page number of the total result set to return, default is 1.
        required: false
        type: integer
        default: 1
        format: int32
        allowEmptyValue: false
      - name: pageSize
        in: query
        description: Number of results out of the total result set per page to return, default is 100, maximum is 1000.
        required: false
        type: integer
        default: 100
        format: int32
        allowEmptyValue: false
      - name: significance
        in: query
        description: Significance of articles to return, possible values are "HIGH" and "MEDIUM", default is "HIGH". The parameter
          is a threshold so a value of MEDIUM will return MEDIUM and HIGH significance articles.
        required: false
        type: string
        default: HIGH
        allowEmptyValue: false
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/MuniNewsResponse'
            originalRef: MuniNewsResponse
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ReasonResponse'
            originalRef: ReasonResponse
        '500':
          description: Internal error
          schema:
            $ref: '#/definitions/ReasonResponse'
            originalRef: ReasonResponse
      security:
      - API key:
        - Global
      - OAuth:
        - Global
      deprecated: false
  /v2/muni/econnews/bylocation:
    get:
      tags:
      - News API
      summary: Economic News Search by Location
      description: "Provides the ability to search for news relevant to economy of a location: \n * State - Querying by state\
        \ returns only news articles that have been written about events that have occurred within the given state. \n * City\
        \ - Querying by city returns only news articles that have been written about events that have occurred within the\
        \ given city. This option requires the use of the State option to avoid ambiguity. \n * Free Form Text Search - A\
        \ search for words or phrases can be performed against the articles matching any of the previous options listed. \n\
        \ * Significance - Articles are classified by their significance. A highly significant article is one that is alert\
        \ worthy whereas less significant articles are more relevant when performing research. This option will filter the\
        \ results returned by the previous options listed. \n \n\n The following is an example of using the API. \n\n To query\
        \ for the economic news about Irvine, California between 7/1/2018 and 7/31/2018 : \n\n ```js\n GET https://api.bitvore.com/v2/corp/econnews?state=ca&city=irvine&startDate=2018-07-01T00:00:00.000+07:00&endDate=2018-07-31T23:59:59.999+07:00\n\
        \ ```\n \n\n A sample successful response is: \n\n ```js\n {\n \t\"success\": true,\n \t\"returned\": 1,\n \t\"total\"\
        : 1, \n \t\"response\": [\n \t\t{\n \t\t\t\"key\": \"070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c\",\n\
        \ \t\t\t\"articleType\": \"News\",\n \t\t\t\"title\": \"Irvine And Carlsbad Water Agreement\",\n \t\t\t\"sourceName\"\
        : \"dailyexpress.com\",\n \t\t\t\"sourceUrl\": \"http://ct.moreover.com/?a=41646891667&p=5jw&v=1&x=yg6DsqTFf8IC8ym026-o0A\"\
        ,\n \t\t\t\"previewImageUrl\": \"http://dailyexpress.com/resources/irvine-carlsbad.jpg\",\n \t\t\t\"excerpt\": \"\
        Irvine has agreed to buy water from the City of Carlsbad. The Carlsbad desalination ...\",\n \t\t\t\"locations\":\
        \ [\"/Orange County/California/United States\", \"Los Angeles//California/United States\"],\n \t\t\t\"sentiment\"\
        \ : 0.28571313, \n \t\t\t\"esgSentiment\" : 0.78078979, \n \t\t\t\"significance\": \"HIGH\",\n \t\t\t\"articleLocations\"\
        : [\"United States\"],\n \t\t\t\"sourceLocation\": \"Germany\",\n \t\t\t\"publishedAt\": \"2017-06-29T21:41:19.109Z\"\
        ,\n \t\t\t\"availableAt\": \"2017-06-29T21:41:21.109Z\",\n \t\t}\n \t]\n }\n ```\n A sample unsuccessful response\
        \ is: \n\n ```js\n {\n \t\"success\": false,\n \t\"reason\": \"Invalid state specified\",\n \t\"reasonSupport\": \"\
        san irvine\",\n \t\"count\": 0\n }\n ```\n"
      operationId: handleEconSearchUsingGET_2
      produces:
      - '*/*'
      parameters:
      - name: state
        in: query
        description: State (code) to retrieve municipal and economic news for.
        required: true
        type: string
        allowEmptyValue: false
        x-example: CA
      - name: city
        in: query
        description: City to retrieve municipal and economic news for.
        required: false
        type: string
        allowEmptyValue: false
      - name: text
        in: query
        description: Keyword or phrase to search for news
        required: false
        type: string
        allowEmptyValue: false
      - name: startDate
        in: query
        description: News date to start from. Time offset will be converted to UTC (Z).
        required: false
        type: string
        format: date-time
        allowEmptyValue: false
        x-example: '2021-04-10T00:00:00Z'
      - name: endDate
        in: query
        description: News date to end with. Time offset will be converted to UTC (Z)
        required: false
        type: string
        format: date-time
        allowEmptyValue: false
        x-example: '2021-04-11T23:59:59Z'
      - name: dateType
        in: query
        description: Indicates whether dates to query by should be published dates "published" or available dates (processing
          completed) "available". Default is published.
        required: false
        type: string
        default: published
        allowEmptyValue: false
      - name: pageNo
        in: query
        description: Page number of the total result set to return, default is 1.
        required: false
        type: integer
        default: 1
        format: int32
        allowEmptyValue: false
      - name: pageSize
        in: query
        description: Number of results out of the total result set per page to return, default is 100, maximum is 1000.
        required: false
        type: integer
        default: 100
        format: int32
        allowEmptyValue: false
      - name: significance
        in: query
        description: Significance of articles to return, possible values are "HIGH" and "MEDIUM", default is "HIGH". The parameter
          is a threshold so a value of MEDIUM will return MEDIUM and HIGH significance articles.
        required: false
        type: string
        default: HIGH
        allowEmptyValue: false
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/MuniNewsResponse'
            originalRef: MuniNewsResponse
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ReasonResponse'
            originalRef: ReasonResponse
        '500':
          description: Internal error
          schema:
            $ref: '#/definitions/ReasonResponse'
            originalRef: ReasonResponse
      security:
      - API key:
        - Global
      - OAuth:
        - Global
      deprecated: false
  /v2/muni/news:
    get:
      tags:
      - News API
      summary: Municipal News Search by CUSIP
      description: "Provides the ability to search for news relevant to municipal bonds. The search criteria used when querying\
        \ news includes the following options: \n * CUSIP - Querying by CUSIP returns only news articles where the identified\
        \ bond is somehow affected by the subject matter of an article.\n * Sector - Querying by sector returns only news\
        \ articles that are written about the given sector. The sectors supported are: \n \t* Development \n \t* Education\
        \ \n \t* HigherEducation \n \t* PrimarySecondaryEducation \n \t* Health \n \t* Housing \n \t* LocalGov \n \t* TaxRevenue\
        \ \n \t* Transportation \n \t* Utility \n \n * Signal - An article can be classified by one or more signals indicating\
        \ that the article describes an event, or events, identified in the Bitvore Signal taxonomy. The taxonomy is hierarchical\
        \ and signal values are '.' encoded to represent that hierarchy, i.e., Environment.ClimateChange. Querying by signal\
        \ returns only articles classified by the given signal. All child signals in the signal hierarchy will also be returned.\
        \ For example querying for Environment.ClimateChange will return Environment.ClimateChange.AirQuality and Environment.ClimateChange.GHGEmissions\
        \ etc. articles. The signals currently supported can be found [here](http://developer.bitvore.com/v2/docs/api-reference/signals).\n\
        \ * Free Form Text Search - A search for words or phrases can be performed against the articles matching any of the\
        \ previous options listed. \n * Article Type - Type of articles to return, News or PressRelease. By default all types\
        \ are returned.\n * Significance - Articles are classified by their significance. A highly significant article is\
        \ one that is alert worthy whereas less significant articles are more relevant when performing research. This option\
        \ will filter the results returned by the previous options listed. \n * Include CUSIPs - Return all CUSIPs affected\
        \ by the subject matter of an article. This option requires a verified CGS license. \n \n\n The metadata tags of articles\
        \ specific to municipal news returned in addition to the common tags above are: \n * CUSIPs - 0 or more CUSIPs identifying\
        \ bonds affected by the news article. \n * Sectors - 0 or more sectors the article is reporting news about. \n * Significance\
        \ - The significance of the article, high or medium. \n \n\n A sample successful response is: \n\n ```js\n {\n \t\"\
        success\": true,\n \t\"returned\": 1,\n \t\"total\": 1, \n \t\"response\": [\n \t\t{\n \t\t\t\"key\": \"070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c\"\
        ,\n \t\t\t\"articleType\": \"News\",\n \t\t\t\"title\": \"Irvine And Carlsbad Water Agreement\",\n \t\t\t\"sourceName\"\
        : \"dailyexpress.com\",\n \t\t\t\"sourceUrl\": \"http://ct.moreover.com/?a=41646891667&p=5jw&v=1&x=yg6DsqTFf8IC8ym026-o0A\"\
        ,\n \t\t\t\"previewImageUrl\": \"http://dailyexpress.com/resources/irvine-carlsbad.jpg\",\n \t\t\t\"excerpt\": \"\
        Irvine has agreed to buy water from the City of Carlsbad. The Carlsbad desalination ...\",\n \t\t\t\"matchedCusips\"\
        : [\"00037CSW1\"],\n \t\t\t\"locations\": [\"/Orange County/California/United States\", \"Los Angeles//California/United\
        \ States\"],\n \t\t\t\"sectors\": [\"Utilities\"],\n \t\t\t\"sentiment\" : 0.28571313, \n \t\t\t\"significance\":\
        \ \"HIGH\",\n \t\t\t\"articleLocations\": [\"United States\"],\n \t\t\t\"sourceLocation\": \"United States\",\n \t\
        \t\t\"publishedAt\": \"2017-06-29T21:41:19.109Z\",\n \t\t\t\"availableAt\": \"2017-06-29T21:41:21.109Z\",\n \t\t}\n\
        \ \t]\n }\n ```\n A sample unsuccessful response is: \n\n ```js\n {\n \t\"success\": false,\n \t\"reason\": \"Bad\
        \ cusips found\",\n \t\"reasonSupport\": \"123456789 987654321\",\n \t\"count\": 0\n }\n ```\n"
      operationId: handleCusipMuniSearchUsingGET
      produces:
      - '*/*'
      parameters:
      - name: cusip
        in: query
        description: One or more CUSIPs identifying the bonds to retrieve news for.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: articleType
        in: query
        description: One or more types of articles (i.e., News, PressRelease) to return. By default all types are returned.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: signals
        in: query
        description: 'One or more signals. (Requires license: ''ESG'')'
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: text
        in: query
        description: Keyword or phrase to search for news
        required: false
        type: string
        allowEmptyValue: false
      - name: significance
        in: query
        description: Significance of articles to return, possible values are "HIGH" and "MEDIUM", default is "HIGH". The parameter
          is a threshold so a value of MEDIUM will return MEDIUM and HIGH significance articles.
        required: false
        type: string
        default: HIGH
        allowEmptyValue: false
      - name: includeCusips
        in: query
        description: 'Return ALL cusips affected by the article. (Requires license: ''CUSIP'')'
        required: false
        type: boolean
        default: false
        allowEmptyValue: false
      - name: startDate
        in: query
        description: News date to start from. Time offset will be converted to UTC (Z).
        required: false
        type: string
        format: date-time
        allowEmptyValue: false
        x-example: '2021-04-10T00:00:00Z'
      - name: endDate
        in: query
        description: News date to end with. Time offset will be converted to UTC (Z)
        required: false
        type: string
        format: date-time
        allowEmptyValue: false
        x-example: '2021-04-11T23:59:59Z'
      - name: dateType
        in: query
        description: Indicates whether dates to query by should be published dates "published" or available dates (processing
          completed) "available". Default is published.
        required: false
        type: string
        default: published
        allowEmptyValue: false
      - name: pageNo
        in: query
        description: Page number of the total result set to return, default is 1.
        required: false
        type: integer
        default: 1
        format: int32
        allowEmptyValue: false
      - name: pageSize
        in: query
        description: Number of results out of the total result set per page to return, default is 100, maximum is 1000.
        required: false
        type: integer
        default: 100
        format: int32
        allowEmptyValue: false
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/MuniNewsResponse'
            originalRef: MuniNewsResponse
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/BasicResponse'
            originalRef: BasicResponse
        '500':
          description: Internal error
          schema:
            $ref: '#/definitions/BasicResponse'
            originalRef: BasicResponse
      security:
      - API key:
        - Global
      - OAuth:
        - Global
      deprecated: false
    post:
      tags:
      - News API
      summary: Advanced Municipal News Search
      description: "Provides an advanced municipal news search capability. The search criteria used when querying news includes\
        \ a more advanced approach to identifying locations, sections, and a larger number of cusips. The following are the\
        \ options supported for searching the news: \n * CUSIP - Querying by CUSIP returns only news articles where the identified\
        \ bond is somehow affected by the subject matter of an article. Up to 10000 CUSIPs can be queried. \n * Portfolio\
        \ - A portfolio is made up of one or more CUSIPs. Querying by portfolio returns only news articles where any of the\
        \ bonds in the portfolio are affected by the subject matter of an article. This option cannot be used with the CUSIP\
        \ option. \n * Location - Querying by city/state returns only news articles that have been written about events that\
        \ have occurred within a city and/or state. Locations are in the format of city/state/country, i.e., Los Angeles/California/United\
        \ States. United States is assumed if the country is not specified. \n * FIPS - Querying by FIPS code returns only\
        \ news articles that have been written about events that have occurred within the given county or CBSA. FIPS codes\
        \ for counties can be found [here](https://www.census.gov/prod/techdoc/cbp/95-96cd/fips-st.pdf). FIPS codes for CBSAs\
        \ can be found [here](https://www2.census.gov/programs-surveys/cps/methodology/2015%20Geography%20Cover.pdf). Maps\
        \ of CBSAs can be found [here](https://www.census.gov/geographies/reference-maps/2020/geo/cbsa.html). \n * Sector\
        \ - Querying by sector returns only news articles that are written about the given sector. The sectors supported are:\
        \ \n \t* Development \n \t* Education \n \t* HigherEducation \n \t* PrimarySecondaryEducation \n \t* Health \n \t\
        * Housing \n \t* LocalGov \n \t* TaxRevenue \n \t* Transportation \n \t* Utility \n \n This option cannot be combined\
        \ with the CUSIP or Portfolio options. \n * Signal - An article can be classified by one or more signals indicating\
        \ that the article describes an event, or events, identified in the Bitvore Signal taxonomy. The taxonomy is hierarchical\
        \ and signal values are '.' encoded to represent that hierarchy, i.e., Environment.ClimateChange. Querying by signal\
        \ returns only articles classified by the given signal. All child signals in the signal hierarchy will also be returned.\
        \ For example querying for Environment.ClimateChange will return Environment.ClimateChange.AirQuality and Environment.ClimateChange.GHGEmissions\
        \ etc. articles. The signals currently supported can be found [here](http://developer.bitvore.com/v2/docs/api-reference/signals).\n\
        \ * Free Form Text Search - A search for words or phrases can be performed against the articles matching any of the\
        \ previous options listed. \n * Article Type - Type of articles to return, News or PressRelease. By default all types\
        \ are returned.\n * Significance - Articles are classified by their significance. A highly significant article is\
        \ one that is alert worthy whereas less significant articles are more relevant when performing research. This option\
        \ will filter the results returned by the previous options listed. \n * Include CUSIPs - Return ALL cusips affected\
        \ by the subject matter of an article. This option requires a verified CGS license. \n \n\n The following are some\
        \ examples of using the API. \n\n To query for the news about 2 CUSIPs published within the last 3 days in the PST\
        \ timezone (using HTTP header for api key) : \n\n ```js\n POST https://api.bitvore.com/v2/muni/news \n Accept: application/json\n\
        \ X-BV-APIKEY: xyz123... \n\n { \n \t\"cusip\": [ \"123456789\", \"987654321\" ] \n \t\"startDate\": \"2018-07-01T09:00:00.000Z\"\
        , \n \t\"endDate\": \"2018-07-31T17:00:00.000Z\" \n } \n ```\n \n\n To query for the news about about education and\
        \ development in Los Angeles and San Francisco between 9:00AM PST 7/1/2018 and 5:00PM PST on 7/31/2018 : \n\n ```js\n\
        \ POST https://api.bitvore.com/v2/muni/news \n Accept: application/json\n X-BV-APIKEY: xyz123... \n\n { \n \t\"sector\"\
        : [ \"education\", \"development\" ], \n \t\"location\": [ \"Los Angeles/California\", \"San Francisco/California\"\
        \ ], \n \t\"startDate\": \"2018-07-01T09:00:00.000Z\", \n \t\"endDate\": \"2018-07-31T17:00:00.000Z\" \n } \n ```\n\
        \ \n\n A sample successful response is: \n\n ```js\n {\n \t\"success\": true,\n \t\"returned\": 1,\n \t\"total\":\
        \ 1, \n \t\"response\": [\n \t\t{\n \t\t\t\"key\": \"070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c\",\n\
