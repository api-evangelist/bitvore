  /v2/muni/news/byfips:
    get:
      tags:
      - News API
      summary: Municipal News Search by FIPS
      description: "Provides the ability to search for news relevant to municipal bonds using a FIPS location identifier.\
        \ The search criteria used when querying news includes the following options: \n * FIPS - Querying by FIPS code returns\
        \ only news articles that have been written about events that have occurred within the given county or CBSA. FIPS\
        \ codes for counties can be found [here](https://www.census.gov/prod/techdoc/cbp/95-96cd/fips-st.pdf). FIPS codes\
        \ for CBSAs can be found [here](https://www2.census.gov/programs-surveys/cps/methodology/2015%20Geography%20Cover.pdf).\
        \ Maps of CBSAs can be found [here](https://www.census.gov/geographies/reference-maps/2020/geo/cbsa.html). \n * Sector\
        \ - Querying by sector returns only news articles that are written about the given sector. The sectors supported are:\
        \ \n \t* Development \n \t* Education \n \t* HigherEducation \n \t* PrimarySecondaryEducation \n \t* Health \n \t\
        * Housing \n \t* LocalGov \n \t* TaxRevenue \n \t* Transportation \n \t* Utility \n \n * Signal - An article can be\
        \ classified by one or more signals indicating that the article describes an event, or events, identified in the Bitvore\
        \ Signal taxonomy. The taxonomy is hierarchical and signal values are '.' encoded to represent that hierarchy, i.e.,\
        \ Environment.ClimateChange. Querying by signal returns only articles classified by the given signal. All child signals\
        \ in the signal hierarchy will also be returned. For example querying for Environment.ClimateChange will return Environment.ClimateChange.AirQuality\
        \ and Environment.ClimateChange.GHGEmissions etc. articles. The signals currently supported can be found [here](http://developer.bitvore.com/v2/docs/api-reference/signals).\n\
        \ * Free Form Text Search - A search for words or phrases can be performed against the articles matching any of the\
        \ previous options listed. \n * Article Type - Type of articles to return, News or PressRelease. By default all types\
        \ are returned.\n * Significance - Articles are classified by their significance. A highly significant article is\
        \ one that is alert worthy whereas less significant articles are more relevant when performing research. This option\
        \ will filter the results returned by the previous options listed. \n * Include CUSIPs - Return ALL cusips affected\
        \ by the subject matter of an article. This option requires a verified CGS license. \n \n\n The metadata tags of articles\
        \ specific to municipal news returned in addition to the common tags above are: \n * CUSIPs - 0 or more CUSIPs identifying\
        \ bonds affected by the news article. \n * Sectors - 0 or more sectors the article is reporting news about. \n * Significance\
        \ - The significance of the article, high or medium. \n \n\n The following is an example of using the API. \n\n To\
        \ query for the news about the education sector in California between 7/1/2018 and 7/31/2018 : \n\n ```js\n GET https://api.bitvore.com/v2/muni/news/byfips?fips=06059&sector=education&startDate=2018-07-01T00:00:00.000+07:00&endDate=2018-07-31T23:59:59.999+07:00\n\
        \ ```\n \n\n A sample successful response is: \n\n ```js\n {\n \t\"success\": true,\n \t\"returned\": 1,\n \t\"total\"\
        : 1, \n \t\"response\": [\n \t\t{\n \t\t\t\"key\": \"070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c\",\n\
        \ \t\t\t\"articleType\": \"News\",\n \t\t\t\"title\": \"Irvine And Carlsbad Water Agreement\",\n \t\t\t\"sourceName\"\
        : \"dailyexpress.com\",\n \t\t\t\"sourceUrl\": \"http://ct.moreover.com/?a=41646891667&p=5jw&v=1&x=yg6DsqTFf8IC8ym026-o0A\"\
        ,\n \t\t\t\"previewImageUrl\": \"http://dailyexpress.com/resources/irvine-carlsbad.jpg\",\n \t\t\t\"excerpt\": \"\
        Irvine has agreed to buy water from the City of Carlsbad. The Carlsbad desalination ...\",\n \t\t\t\"matchedCusips\"\
        : [\"00037CSW1\"],\n \t\t\t\"locations\": [\"/Orange County/California/United States\", \"Los Angeles//California/United\
        \ States\"],\n \t\t\t\"sectors\": [\"Utilities\"],\n \t\t\t\"sentiment\" : 0.28571313, \n \t\t\t\"significance\":\
        \ \"HIGH\",\n \t\t\t\"articleLocations\": [\"United States\"],\n \t\t\t\"sourceLocation\": \"United States\",\n \t\
        \t\t\"publishedAt\": \"2017-06-29T21:41:19.109Z\",\n \t\t\t\"availableAt\": \"2017-06-29T21:41:21.109Z\",\n \t\t}\n\
        \ \t]\n }\n ```\n A sample unsuccessful response is: \n\n ```js\n {\n \t\"success\": false,\n \t\"reason\": \"Bad\
        \ cusips found\",\n \t\"reasonSupport\": \"123456789 987654321\",\n \t\"count\": 0\n }\n ```\n"
      operationId: handleFipsMuniSearchUsingGET
      produces:
      - '*/*'
      parameters:
      - name: fips
        in: query
        description: FIPS code to retrieve news for
        required: true
        type: string
        allowEmptyValue: false
      - name: articleType
        in: query
        description: One or more types of articles (i.e., News, PressRelease) to return. By default all types are returned.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: sector
        in: query
        description: Sector to retrieve news for
        required: false
        type: string
        allowEmptyValue: false
      - name: signals
        in: query
        description: 'One or more signals. (Requires license: ''ESG'')'
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: significance
        in: query
        description: Significance of articles to return, possible values are "HIGH" and "MEDIUM", default is "HIGH". The parameter
          is a threshold so a value of MEDIUM will return MEDIUM and HIGH significance articles.
        required: false
        type: string
        default: HIGH
        allowEmptyValue: false
      - name: text
        in: query
        description: Keyword or phrase to search for news
        required: false
        type: string
        allowEmptyValue: false
      - name: includeCusips
        in: query
        description: 'Return ALL cusips affected by the article. (Requires license: ''CUSIP'')'
        required: false
        type: boolean
        default: false
        allowEmptyValue: false
      - name: startDate
        in: query
        description: News date to start from. Time offset will be converted to UTC (Z).
        required: false
        type: string
        format: date-time
        allowEmptyValue: false
        x-example: '2021-04-10T00:00:00Z'
      - name: endDate
        in: query
        description: News date to end with. Time offset will be converted to UTC (Z)
        required: false
        type: string
        format: date-time
        allowEmptyValue: false
        x-example: '2021-04-11T23:59:59Z'
      - name: dateType
        in: query
        description: Indicates whether dates to query by should be published dates "published" or available dates (processing
          completed) "available". Default is published.
        required: false
        type: string
        default: published
        allowEmptyValue: false
      - name: pageNo
        in: query
        description: Page number of the total result set to return, default is 1.
        required: false
        type: integer
        default: 1
        format: int32
        allowEmptyValue: false
      - name: pageSize
        in: query
        description: Number of results out of the total result set per page to return, default is 100, maximum is 1000.
        required: false
        type: integer
        default: 100
        format: int32
        allowEmptyValue: false
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/MuniNewsResponse'
            originalRef: MuniNewsResponse
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/BasicResponse'
            originalRef: BasicResponse
        '500':
          description: Internal error
          schema:
            $ref: '#/definitions/BasicResponse'
            originalRef: BasicResponse
      security:
      - API key:
        - Global
      - OAuth:
        - Global
      deprecated: false
