securityDefinitions:
  API key:
    type: apiKey
    name: X-BV-APIKEY
    in: header
  OAuth:
    type: oauth2
    tokenUrl: https://api.bitvore.com/oauth/accesstoken
    flow: application
    scopes:
      Global: Includes all Bitvore APIs
definitions:
  BasicResponse:
    type: object
    properties:
      response:
        type: object
        description: Response payload
      success:
        type: boolean
        example: true
        description: Indicates whether the call was successful or not
    title: BasicResponse
    description: Default response wrapper for API requests.
  EconNewsResponse:
    type: object
    properties:
      response:
        type: array
        description: Response payload
        items:
          $ref: '#/definitions/EconomicNewsArticle'
          originalRef: EconomicNewsArticle
      returned:
        type: integer
        format: int32
        example: 10
        description: Number of items return
      success:
        type: boolean
        example: true
        description: Indicates whether the call was successful or not
      total:
        type: integer
        format: int32
        example: 100
        description: Total number of items available
    title: EconNewsResponse
    description: A paged result response.
  EconomicNewsArticle:
    type: object
    properties:
      articleLocations:
        type: array
        example: United States
        description: The countries that the article is likely about.
        items:
          type: string
      articleType:
        type: string
        example: PressRelease
        description: Type of article. Possible values are "News" and "PressRelease
      availableAt:
        type: string
        example: '2017-06-29T21:41:21.109Z'
        description: Date available
      esgSentiment:
        type: number
        format: double
        example: 0.78078
        description: ESG Sentiment of the article. The value is a decimal value between -1 and 1, under 0 is negative while
          over 0 is positive.
      excerpt:
        type: string
        example: ACME announces long awaited acquisition. The acquisition of Wile E. Coyote was announced Thursday.
        description: Fragment or snippet, of the article
      key:
        type: string
        example: 070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c
        description: Key uniquely identifying the article
      locations:
        type: array
        example: Irvine//California/United States, /San Diego County/California/United States
        description: Locations affected. A location is at the city or county level. It is encoded as city/county/state/country
          where if the city is specified the county will not be and vice-versa
        items:
          type: string
      previewImageUrl:
        type: string
        example: http://acme.com/resources/coyote.jpg
        description: URL of a preview image
      publishedAt:
        type: string
        example: '2017-06-29T21:41:21.109Z'
        description: Date published
      sentiment:
        type: number
        format: double
        example: 0.23456
        description: Sentiment of the article. The value is a decimal value between -1 and 1, under 0 is negative while over
          0 is positive.
      significance:
        type: string
        example: HIGH
        description: Significance of the article. Possible values are "HIGH" and "MEDIUM"
      sourceLocation:
        type: string
        example: Germany
        description: The country that is likely the source of the article.
      sourceName:
        type: string
        example: businesswire.com, The Washington Daybook
        description: Name or host name of the publisher of the article
      sourceUrl:
        type: string
        example: http://acme.com/press
        description: URL to the original source of the article
      title:
        type: string
        example: ACME acquires Wile E. Coyote, Inc.
        description: Title
    title: EconomicNewsArticle
    description: Single economic news article.
  InputStream:
    type: object
    title: InputStream
  ItemCustomId:
    type: object
    properties:
      id:
        type: string
        example: 00XAD6
        description: A custom id of the portfolio item
        maxLength: 40
      type:
        type: string
        example: FOREIGN_ID
        description: A type or name of the custom id
        maxLength: 40
    title: ItemCustomId
    description: A user managed id of the portfolio item. Can be used to map customer Ids to Bitvore Ids.
  MuniNewsArticle:
    type: object
    properties:
      articleLocations:
        type: array
        example: United States
        description: The countries that the article is likely about.
        items:
          type: string
      articleType:
        type: string
        example: PressRelease
        description: Type of article. Possible values are "News" and "PressRelease
      availableAt:
        type: string
        example: '2017-06-29T21:41:21.109Z'
        description: Date available
      cusips:
        type: array
        example: 02361DAP5, 002824AV2
        description: CUSIPs affected by the article. Required valid CUSIP license and permission.
        items:
          type: string
      esgSentiment:
        type: number
        format: double
        example: 0.78078
        description: ESG Sentiment of the article. The value is a decimal value between -1 and 1, under 0 is negative while
          over 0 is positive.
      excerpt:
        type: string
        example: ACME announces long awaited acquisition. The acquisition of Wile E. Coyote was announced Thursday.
        description: Fragment or snippet, of the article
      key:
        type: string
        example: 070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c
        description: Key uniquely identifying the article
      locations:
        type: array
        example: Irvine//California/United States, /San Diego County/California/United States
        description: Locations affected. A location is city or county level. It is encoded as city/county/state/country where
          if the city is specified the county will not be and vice-versa
        items:
          type: string
      matchedCusips:
        type: array
        example: 02361DAP5, 002824AV2
        description: CUSIPs affected by the article that match the input CUSIPs, or are contained in the supplied portfolio.
        items:
          type: string
      previewImageUrl:
        type: string
        example: http://acme.com/resources/coyote.jpg
        description: URL of a preview image
      publishedAt:
        type: string
        example: '2017-06-29T21:41:21.109Z'
        description: Date published
      sectors:
        type: array
        example: Education, Utilities
        description: Sectors which the article belongs to.
        items:
          type: string
      sentiment:
        type: number
        format: double
        example: 0.23456
        description: Sentiment of the article. The value is a decimal value between -1 and 1, under 0 is negative while over
          0 is positive.
      signals:
        type: array
        example:
        - Environment.ClimateChange
        - Social.EmployeeStandards.FairWagesBenefits
        description: 'Signals and topics. See glossary for available values. (Requires license: ''ESG'')'
        items:
          type: string
      significance:
        type: string
        example: HIGH
        description: Significance of the article. Possible values are "HIGH" and "MEDIUM"
      sourceLocation:
        type: string
        example: Germany
        description: The country that is likely the source of the article.
      sourceName:
        type: string
        example: businesswire.com, The Washington Daybook
        description: Name or host name of the publisher of the article
      sourceUrl:
        type: string
        example: http://acme.com/press
        description: URL to the original source of the article
      title:
        type: string
        example: ACME acquires Wile E. Coyote, Inc.
        description: Title
    title: MuniNewsArticle
    description: Muni news article.
  MuniNewsResponse:
    type: object
    properties:
      response:
        type: array
        description: Response payload
        items:
          $ref: '#/definitions/MuniNewsArticle'
          originalRef: MuniNewsArticle
      returned:
        type: integer
        format: int32
        example: 10
        description: Number of items return
      success:
        type: boolean
        example: true
        description: Indicates whether the call was successful or not
      total:
        type: integer
        format: int32
        example: 100
        description: Total number of items available
    title: MuniNewsResponse
    description: A paged result response.
  MunicipalNewsRequest:
    type: object
    properties:
      articleType:
        type: array
        example:
        - PressRelease
        description: One or more types of arcticles (i.e., News, PressRelease) to return. By default all types are returned.
        items:
          type: string
      cusip:
        type: array
        example:
        - '123456789'
        - '987654321'
        description: One or more CUSIPs identifying the bonds to retrieve news for, should not be used with the portfolio
          property.
        items:
          type: string
      dateType:
        type: string
        example: available
        description: Indicates whether dates to query by should be published dates "published" or available dates (processing
          completed) "available". Default is published.
      endDate:
        type: string
        format: date-time
        example: '2021-04-11T23:59:59.999Z'
        description: News date to end with. Time offset will be converted to UTC (Z)
      fips:
        type: array
        example:
        - '31080'
        - '06037'
        description: One or more FIPS codes to restrict the returned news to. Must not be used with the cusip or portfolio
          properties.
        items:
          type: string
      includeCusips:
        type: boolean
        example: true
        description: Return ALL cusips affected by the article. This option requires a verified CGS license, default is false
      location:
        type: array
        example:
        - los angeles/ca
        - fl
        description: One or more locations to restrict the returned news to. Can be a state code or a city/state combination.
          Must not be used with the cusip or portfolio properties.
        items:
          type: string
      pageNo:
        type: integer
        format: int32
        example: 1
        description: Page number of the total result set to return, default is 1.
      pageSize:
        type: integer
        format: int32
        example: 100
        description: Number of results out of the total result set per page to return, default is 100, maximum is 1000.
      portfolioId:
        type: integer
        format: int64
        example: 10001
        description: Id identifying a portfolio to retrieve news for, should not be used with the cusip property.
      sector:
        type: array
        example:
        - education
        description: Sector to retrieve news for, must be used with the location property and not with the cusip, or portfolio
          properties.
        items:
          type: string
      signals:
        type: array
        example:
        - Environment.ClimateChange
        - Social.EmployeeStandards.FairWagesBenefits
        description: 'Signals and events. See glossary for available values. (Requires license: ''ESG'')'
        items:
          type: string
      significance:
        type: string
        example: HIGH
        description: Significance of articles to return, possible values are "HIGH" and "MEDIUM", default is "HIGH". The property
          is a threshold so a value of MEDIUM will return MEDIUM and HIGH significance articles.
      startDate:
        type: string
        format: date-time
        example: '2021-04-10T00:00:00.000Z'
        description: News date to start from. Time offset will be converted to UTC (Z)
      text:
        type: string
        example: blockchain
        description: Keyword or phrase to search for news when not using a portfolio
    title: MunicipalNewsRequest
    description: Query criteria for returning municipal news.
  PortfolioItem:
    type: object
    required:
    - id
    properties:
      customIds:
        type: array
        description: 'Optional: Up to 4 client defined custom ids. Convenience property to map client Ids with Bitvore Ids.'
        items:
          $ref: '#/definitions/ItemCustomId'
          originalRef: ItemCustomId
      id:
        type: string
        example: 008000AA7
        description: Unique Id of the portfolio item, the format is dictated by the Id scheme used by the portfolio
      name:
        type: string
        example: ACME Corp
        description: Name of the portfolio item, not required for API input but will be returned from API calls
    title: PortfolioItem
    description: Identifies an item in a portfolio
  PortfolioItemIdsResponse:
    type: object
    required:
    - count
    properties:
      count:
        type: integer
        format: int32
        example: 1
        description: Number of portfolio item ids returned
      reason:
        type: string
        example: Could not locate subject.
        description: Text reason for the failure (if not successful)
      reasonSupport:
        type: string
        example: Longer description of the missing subject.
        description: Additional information about the failure (if not successful)
      response:
        type: array
        description: Response payload
        items:
          type: string
      success:
        type: boolean
        example: true
        description: Indicates whether the call was successful or not
    title: PortfolioItemIdsResponse
    description: A response used to explain a failure or issue with the request.
  PortfolioItemResponse:
    type: object
    required:
    - count
    properties:
      count:
        type: integer
        format: int32
        example: 1
        description: Number of portfolio items returned
      reason:
        type: string
        example: Could not locate subject.
        description: Text reason for the failure (if not successful)
      reasonSupport:
        type: string
        example: Longer description of the missing subject.
        description: Additional information about the failure (if not successful)
      response:
        type: array
        description: Response payload
        items:
          $ref: '#/definitions/PortfolioItem'
          originalRef: PortfolioItem
      success:
        type: boolean
        example: true
        description: Indicates whether the call was successful or not
    title: PortfolioItemResponse
    description: Portfolio item response.
  PortfolioResponse:
    type: object
    required:
    - count
    properties:
      count:
        type: integer
        format: int32
        example: 1
        description: Number of portfolios returned
      reason:
        type: string
        example: Could not locate subject.
        description: Text reason for the failure (if not successful)
      reasonSupport:
        type: string
        example: Longer description of the missing subject.
        description: Additional information about the failure (if not successful)
      response:
        type: array
        description: Response payload
        items:
          $ref: '#/definitions/PortfolioSummary'
          originalRef: PortfolioSummary
      success:
        type: boolean
        example: true
        description: Indicates whether the call was successful or not
    title: PortfolioResponse
    description: Portfolio response.
  PortfolioSummary:
    type: object
    required:
    - id
    - name
    properties:
      id:
        type: integer
        format: int64
        example: 25
        description: Unique Id of the portfolio
      idScheme:
        type: string
        description: Scheme used for identifying porfolio items, supported values are "cusip" for Muni API and "bvid" for
          Corp API
      name:
        type: string
        example: My Portfolio
        description: Name of the portfolio
    title: PortfolioSummary
    description: Summary information about a portfolio.
  ReasonResponse:
    type: object
    properties:
      reason:
        type: string
        example: Could not locate subject.
        description: Text reason for the failure (if not successful)
      reasonSupport:
        type: object
        example: Longer description of the missing subject.
        description: Additional information about the failure (if not successful)
      response:
        type: object
        description: Response payload
      success:
        type: boolean
        example: true
        description: Indicates whether the call was successful or not
    title: ReasonResponse
    description: A response used to explain a failure or issue with the request.
