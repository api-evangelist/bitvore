openapi: 3.2.0
info:
  title: Bitvore News API
  license:
    name: Copyright Bitvore Corp. 2026
  version: '1.0'
  description: 'Operations tagged News API across 2 of this provider''s published API definitions: bitvore-corporate-openapi.yml, bitvore-muni-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.bitvore.com/
tags:
- name: News API
  description: Precision and Economic News
paths:
  /v2/corp/econnews/byfips:
    get:
      tags:
      - News API
      summary: Economic News Search by FIPS
      description: 'Provides the ability to search for news relevant to economy of a region:

        * FIPS - Querying by FIPS code returns only news articles that have been written about events that have occurred within the given county or CBSA. FIPS codes for counties can be found here. FIPS codes for CBSAs can be found here. Maps of CBSAs can be found here.

        * Free Form Text Search - A search for words or phrases can be performed against the articles matching any of the previous options listed.

        * Significance - Articles are classified by their significance. A highly significant article is one that is alert worthy whereas less significant articles are more relevant when performing research. This option will filter the results returned by the previous options listed.


        The following is an example of using the API.


        To query for the economic news about the Los Angeles region using the FIPS code 037 between 7/1/2018 and 7/31/2018 :


        ```js

        GET https://api.bitvore.com/v2/corp/econnews?fips=037&startDate=2018-07-01T00:00:00.000+07:00&endDate=2018-07-31T23:59:59.999+07:00

        ```


        A sample successful response is:


        ```js

        {

        "success": true,

        "returned": 1,

        "total": 1,

        "response": [

        {

        "key": "070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c",

        "articleType": "News",

        "title": "Irvine And Carlsbad Water Agreement",

        "sourceName": "dailyexpress.com",

        "sourceUrl": "http://ct.moreover.com/?a=41646891667&p=5jw&v=1&x=yg6DsqTFf8IC8ym026-o0A",

        "previewImageUrl": "http://dailyexpress.com/resources/irvine-carlsbad.jpg",

        "excerpt": "Irvine has agreed to buy water from the City of Carlsbad. The Carlsbad desalination ...",

        "locations": ["/Orange County/California/United States", "Los Angeles//California/United States"],

        "sentiment" : 0.28571313,

        "esgSentiment" : 0.78078979,

        "significance": "HIGH",

        "articleLocations": ["United States"],

        "sourceLocation": "Germany",

        "publishedAt": "2017-06-29T21:41:19.109Z",

        "availableAt": "2017-06-29T21:41:21.109Z",

        }

        ]

        }

        ```

        A sample unsuccessful response is:


        ```js

        {

        "success": false,

        "reason": "Invalid state specified",

        "reasonSupport": "san irvine",

        "count": 0

        }

        ```'
      operationId: handleFipsEconSearchUsingGET
      parameters:
      - name: fips
        in: query
        description: FIPS code to retrieve municipal and economic news for.
        required: true
        allowEmptyValue: false
        schema:
          type: string
      - name: text
        in: query
        description: Keyword or phrase to search for news
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: startDate
        in: query
        description: News date to start from. Time offset will be converted to UTC (Z).
        required: false
        allowEmptyValue: false
        x-example: '2021-04-10T00:00:00Z'
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: News date to end with. Time offset will be converted to UTC (Z)
        required: false
        allowEmptyValue: false
        x-example: '2021-04-11T23:59:59Z'
        schema:
          type: string
          format: date-time
      - name: dateType
        in: query
        description: Indicates whether dates to query by should be published dates "published" or available dates (processing completed) "available". Default is published.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: published
      - name: pageNo
        in: query
        description: Page number of the total result set to return, default is 1.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: Number of results out of the total result set per page to return, default is 100, maximum is 1000.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: significance
        in: query
        description: Significance of articles to return, possible values are "HIGH" and "MEDIUM", default is "HIGH". The parameter is a threshold so a value of MEDIUM will return MEDIUM and HIGH significance articles.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: HIGH
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MuniNewsResponse'
                originalRef: MuniNewsResponse
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
        '500':
          description: Internal error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
      security:
      - API key:
        - Global
      - OAuth:
        - Global
      deprecated: false
    servers:
    - url: https://api.bitvore.com/
  /v2/corp/econnews/bylocation:
    get:
      tags:
      - News API
      summary: Economic News Search by Location
      description: 'Provides the ability to search for news relevant to economy of a location:

        * State - Querying by state returns only news articles that have been written about events that have occurred within the given state.

        * City - Querying by city returns only news articles that have been written about events that have occurred within the given city. This option requires the use of the State option to avoid ambiguity.

        * Free Form Text Search - A search for words or phrases can be performed against the articles matching any of the previous options listed.

        * Significance - Articles are classified by their significance. A highly significant article is one that is alert worthy whereas less significant articles are more relevant when performing research. This option will filter the results returned by the previous options listed.


        The following is an example of using the API.


        To query for the economic news about Irvine, California between 7/1/2018 and 7/31/2018 :


        ```js

        GET https://api.bitvore.com/v2/corp/econnews?state=ca&city=irvine&startDate=2018-07-01T00:00:00.000+07:00&endDate=2018-07-31T23:59:59.999+07:00

        ```


        A sample successful response is:


        ```js

        {

        "success": true,

        "returned": 1,

        "total": 1,

        "response": [

        {

        "key": "070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c",

        "articleType": "News",

        "title": "Irvine And Carlsbad Water Agreement",

        "sourceName": "dailyexpress.com",

        "sourceUrl": "http://ct.moreover.com/?a=41646891667&p=5jw&v=1&x=yg6DsqTFf8IC8ym026-o0A",

        "previewImageUrl": "http://dailyexpress.com/resources/irvine-carlsbad.jpg",

        "excerpt": "Irvine has agreed to buy water from the City of Carlsbad. The Carlsbad desalination ...",

        "locations": ["/Orange County/California/United States", "Los Angeles//California/United States"],

        "sentiment" : 0.28571313,

        "esgSentiment" : 0.78078979,

        "significance": "HIGH",

        "articleLocations": ["United States"],

        "sourceLocation": "Germany",

        "publishedAt": "2017-06-29T21:41:19.109Z",

        "availableAt": "2017-06-29T21:41:21.109Z",

        }

        ]

        }

        ```

        A sample unsuccessful response is:


        ```js

        {

        "success": false,

        "reason": "Invalid state specified",

        "reasonSupport": "san irvine",

        "count": 0

        }

        ```'
