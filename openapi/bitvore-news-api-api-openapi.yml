        ```js

        GET https://api.bitvore.com/v2/muni/news/byportfolio?portfolioId=12345&startDate=2018-07-01T13:00:00.000+07:00&endDate=2018-07-01T14:00:00.000+07:00 ```


        The metadata tags of articles specific to municipal news returned in addition to the common tags above are:

