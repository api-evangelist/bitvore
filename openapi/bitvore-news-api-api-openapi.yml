  /v2/muni/news:
    get:
      tags:
      - News API
      summary: Municipal News Search by CUSIP
      description: 'Provides the ability to search for news relevant to municipal bonds. The search criteria used when querying news includes the following options:

        * CUSIP - Querying by CUSIP returns only news articles where the identified bond is somehow affected by the subject matter of an article.

        * Sector - Querying by sector returns only news articles that are written about the given sector. The sectors supported are:

        * Development

        * Education

        * HigherEducation

        * PrimarySecondaryEducation

        * Health

        * Housing

        * LocalGov

        * TaxRevenue

        * Transportation

        * Utility


        * Signal - An article can be classified by one or more signals indicating that the article describes an event, or events, identified in the Bitvore Signal taxonomy. The taxonomy is hierarchical and signal values are ''.'' encoded to represent that hierarchy, i.e., Environment.ClimateChange. Querying by signal returns only articles classified by the given signal. All child signals in the signal hierarchy will also be returned. For example querying for Environment.ClimateChange will return Environment.ClimateChange.AirQuality and Environment.ClimateChange.GHGEmissions etc. articles. The signals currently supported can be found here.

        * Free Form Text Search - A search for words or phrases can be performed against the articles matching any of the previous options listed.

        * Article Type - Type of articles to return, News or PressRelease. By default all types are returned.

        * Significance - Articles are classified by their significance. A highly significant article is one that is alert worthy whereas less significant articles are more relevant when performing research. This option will filter the results returned by the previous options listed.

        * Include CUSIPs - Return all CUSIPs affected by the subject matter of an article. This option requires a verified CGS license.


        The metadata tags of articles specific to municipal news returned in addition to the common tags above are:

        * CUSIPs - 0 or more CUSIPs identifying bonds affected by the news article.

        * Sectors - 0 or more sectors the article is reporting news about.

        * Significance - The significance of the article, high or medium.


        A sample successful response is:


        ```js

        {

        "success": true,

        "returned": 1,

        "total": 1,

        "response": [

        {

        "key": "070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c",

        "articleType": "News",

        "title": "Irvine And Carlsbad Water Agreement",

        "sourceName": "dailyexpress.com",

        "sourceUrl": "http://ct.moreover.com/?a=41646891667&p=5jw&v=1&x=yg6DsqTFf8IC8ym026-o0A",

