          down to the hour or minute. Should not be used if offset parameter is.
        required: false
        type: string
        allowEmptyValue: false
      - name: endDate
        in: query
        description: Filing date to end with. Format is yyyy-mm-dd for daily (inclusive) filings or yyyy-mm-dd'T'HH:mm if
          you want it down to the hour or minute. If startDate is used and endDate is not the default endDate is today.
        required: false
        type: string
        allowEmptyValue: false
      - name: offset
        in: query
        description: Number of days back filings should be returned for. Should not be used with startDate. Default is 31.
        required: false
        type: integer
        format: int32
        allowEmptyValue: false
      - name: tz
