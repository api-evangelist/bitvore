            originalRef: ReasonResponse
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/AccessDeniedResponse'
            originalRef: AccessDeniedResponse
        '500':
          description: Internal error
          schema:
            $ref: '#/definitions/InternalErrorResponse'
            originalRef: InternalErrorResponse
      security:
      - API key:
        - Global
      - OAuth:
        - Global
      deprecated: false
  /v2/corp/organizations/match:
    post:
      tags:
      - Organizations API
      summary: Organization Matching
      description: "Attempts to find companies matching input specifications made up of a list of property values. Multiple\
        \ companies can be matched in a single call. For each organization to match a list of properties and values known\
        \ by the client (the input specification) are passed in. If possible the system will return a single matching organization\
        \ for each input specification. If more than one organization matches an input specification and there is not one\
        \ organization that is more qualified than the others all the candidates will be returned. The following are the organization\
        \ properties that can be used in input specifications. More than one value can be supplied for each indicating a match\
        \ of any of the values will be acceptable. \n * Name \n * DomainName \n * Ticker \n * CUSIP - Requires license: 'CUSIP'\
        \ \n * FIGI \n * ISIN - Requires license: 'ISIN' \n * SEDOL - Requires license: 'SEDOL' \n * NAICSCode \n * SICCode\
        \ \n * City \n * StateCode \n * Country \n \n\n Tickers formats: \n * Nonqualified - Basic ticker symbol (e.g. T,\
        \ XOM) \n * Region Qualified - &lt;region&gt;:&lt;ticker&gt; (e.g. US:T, US:XOM) \n * Exchange Qualified - &lt;exchange&gt;:&lt;ticker&gt;\
        \ (e.g. NYS:T, NAS:XOM) \n \n\n In the following example we'll try to match two companies. In this case they will\
        \ actually be companies with the same name but by using different properties in the specifications we can see how\
        \ the system matches differently. The first specification will include the organization name and the state it's in.\
        \ The second specification will include the organization name and its domain name. \n\n \n\n ```js\n POST https://api.bitvore.com/v2/corp/organizations/match\
        \ \n Content-Type: application/json \n Accept: application/json \n X-BV-APIKEY: xyz123... \n\n [ \n \t{ \n \t\t\"\
        Name\": [\"Bank of Commerce\"], \n \t\t\"State\": [\"Oklahoma\"] \n \t}, \n \t{ \n \t\t\"Name\": [\"Bank of Commerce\"\
        ], \n \t\t\"DomainName\": [\"bocokonline.com\"] \n \t} \n ] \n ```\n \n\n \n\n The first set of candidates is returned\
        \ for the name/state combination. There are three companies with the input name and state code. Since that is the\
        \ only input the system could not narrow the candidates down any further. \n\n The second set of candidates is returned\
        \ for the same name but with a domain name instead of a state code. This input specification matched only one organization\
        \ in the system which is returned. \n\n The properties that were matched for each candidate are returned in the \"\
        hits\" field. These will match the input specification properties. However, when matching names the system will attempt\
        \ to match the input name against the organization's names in the Knowledge Graph as well as any known aliases for\
        \ companies. If the input name matched an alias instead of a organization name the \"Alias\" property will be returned\
        \ in \"hits\"."
      operationId: handleOrgMatchingUsingPOST_1
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - in: body
        name: specs
        description: specs
        required: true
        schema:
          type: array
          items:
            $ref: '#/definitions/OrgSpec'
            originalRef: OrgSpec
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/SingleOrganizationMatchingResult'
            originalRef: SingleOrganizationMatchingResult
        '400':
          description: Invalid parameter
          schema:
            $ref: '#/definitions/ReasonResponse'
            originalRef: ReasonResponse
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/AccessDeniedResponse'
            originalRef: AccessDeniedResponse
        '500':
          description: Internal error
          schema:
            $ref: '#/definitions/InternalErrorResponse'
            originalRef: InternalErrorResponse
      security:
      - API key:
        - Global
      - OAuth:
        - Global
      deprecated: false
  /v2/corp/organizations/search:
    post:
      tags:
      - Organizations API
      summary: Organization Search
      description: "A search query takes one or more search parameters. A parameter has a name and one or more values. The\
        \ search will match the organization properties and relationships with the parameters and return only those that have\
        \ an EXACT match on all input parameters. The following are the supported search parameters: \n\n * name - One or\
        \ more names to search for \n * ticker - One or more tickers to search for \n * domainName - One or more domain names\
        \ to search for. \n * location - One or more locations companies must have their headquarters in. Locations are in\
        \ the format of city/state code/country. If city or state is unspecified the appropriate / delimiters must still be\
        \ included, i.e., /California/United States.  Must not be used with fips or zip. \n * fips - One or more FIPS codes\
        \ identifying counties or CBSAs (metropolitan/micropolitan statistical areas) companies must have their headquarters\
        \ in. FIPS codes for counties can be found [here](https://www.census.gov/prod/techdoc/cbp/95-96cd/fips-st.pdf). FIPS\
        \ codes for CBSAs can be found [here](https://www2.census.gov/programs-surveys/cps/methodology/2015%20Geography%20Cover.pdf).\
        \ Maps of CBSAs can be found [here](https://www.census.gov/geographies/reference-maps/2020/geo/cbsa.html). Must not\
        \ be used with location or zip. \n * zip - One or more zip codes identifying ZIP Code Tabulation Areas (ZCTAs) companies\
        \ must have their headquarters in.  Must not be used with location or fips. \n * naics - One or more [NAICS](https://www.naics.com/search/)\
        \ codes identifying industries the companies must operate in. \n * sic - One or more [SIC](https://www.osha.gov/pls/imis/sicsearch.html)\
        \ codes identifying industries the companies must operate in. \n * revRange - Revenue range (in millions) companies\
        \ must fall in. The range is formated as lower-upper where lower and upper must be one of 0, 1, 10, 50, 100, 500,\
        \ 1000, 10000. The upper bound can be omitted to report over 10B. \n * empRange - Employee range companies must fall\
        \ in. The range is formated as lower-upper where lower and upper must be one of 1, 10, 50, 100, 250, 500, 1000, 5000,\
        \ 10000. The upper bound can be omitted to report over 10000. \n \n\n Example Request: \n\n \n\n ```js\n POST https://api.bitvore.com/v2/corp/organizations?domainName=acme.com\n\
        \ ```\n \n\n \n\n 0 or more companies may be returned that match the supplied query criteria. Only summary information\
        \ for each matching organization is supplied which includes the following fields: \n\n * ID \n * Name \n * Domain\
        \ Name \n * Ticker \n * State \n * Country \n * Parent \n \n\n "
      operationId: handleOrgSearchUsingPOST
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - name: name
        in: query
        description: One or more names to search for.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: ticker
        in: query
        description: One or more tickers to search for.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: domainName
        in: query
        description: One or more domain names to search for.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: location
        in: query
        description: One or more locations organization must have their headquarters in.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: fips
        in: query
        description: One or more FIPS codes identifying locations the companies must have their headquarters in.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: zip
        in: query
        description: One or more zip codes identifying locations the companies must have their headquarters in.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: naicsCode
        in: query
        description: One or more NAICS codes identifying industries the companies must operate in.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: sicCode
        in: query
        description: One or more SIC codes identifying industries the companies must operate in.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: revRange
        in: query
        description: Revenue range (in millions) companies must fall in. The range is formated as lower-upper where lower
          and upper must be one of 0, 1, 10, 50, 100, 200, 1000. The upper bound can be ommited to report over 1B.
        required: false
        type: string
        allowEmptyValue: false
      - name: empRange
        in: query
        description: Employee range companies must fall in. The range is formated as lower-upper where lower and upper must
          be one of 1, 10, 50, 200, 500, 1000, 5000, 10000. The upper bound can be ommited to report over 1B.
        required: false
        type: string
        allowEmptyValue: false
      - name: pageNo
        in: query
        description: Page number of the total result set to return, default is 1.
        required: false
        type: integer
        default: 1
        format: int32
        allowEmptyValue: false
      - name: pageSize
        in: query
        description: Number of results out of the total result set per page to return, default is 100, maximum is 1000.
        required: false
        type: integer
        default: 100
        format: int32
        allowEmptyValue: false
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/OrgResultsResponse'
            originalRef: OrgResultsResponse
        '400':
          description: Invalid parameter
          schema:
            $ref: '#/definitions/ReasonResponse'
            originalRef: ReasonResponse
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/AccessDeniedResponse'
            originalRef: AccessDeniedResponse
        '500':
          description: Internal error
          schema:
            $ref: '#/definitions/InternalErrorResponse'
            originalRef: InternalErrorResponse
      security:
      - API key:
        - Global
      - OAuth:
        - Global
      deprecated: false
