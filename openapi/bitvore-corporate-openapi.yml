swagger: '2.0'
info:
  description: "### Cellenus Corporate APIs\r\nThe Cellenus Corporate APIs consists of three main datasets, \"Corporate, Market\
    \ & Industry\", \"ESG\", and \"Thematic Trending\" which provide news, events, press releases relevant to corporate entities,\
    \ typically identifying signals that affect them. Bitvore currently surveils most public companies traded on US and international\
    \ exchanges, US companies and international companies. Additionally, new companies required by a customer can be requested\
    \ to be added to our surveillance.\r\n\r\nThe Corporate APIs also includes access to economic news for geographic locations\
    \ in the United States.\r\n\r\nA typical record in the dataset is depicted below.\r\n\r\n![News Article](https://bitvorestaticassets.blob.core.windows.net/api-docs/corp-news-article.png)\r\
    \n\r\nAccess to the Corporate Datasets using the Corporate APIs requires its own license and API key.  To register for\
    \ an API Key please visit [here](http://developer.bitvore.com/v2/getting-started?section=obtain-api-key). \r\n\r\nThe\
    \ Cellenus Corporate APIs, include [Corporate News API](http://developer.bitvore.com/v2/docs/overview/corp?tagname=News%20API),\
    \ [Ecomomic News](http://developer.bitvore.com/v2/docs/overview/corp?tagname=News%20API), [Organizations](http://developer.bitvore.com/v2/docs/overview/corp?tagname=Organizations%20API),\
    \ [Portfolio Integration](http://developer.bitvore.com/v2/docs/overview/corp?tagname=Portfolios%20API), [Sentiment Scores](http://developer.bitvore.com/v2/docs/overview/corp?tagname=Sentiment%20Scores%20API),\
    \ [Financial Filings](http://developer.bitvore.com/v2/docs/overview/corp?tagname=Filings%20API) and [Datasets](http://developer.bitvore.com/v2/docs/overview/corp?tagname=Datasets%20API).\r\
    \n\r\nThe [Corporate News API](http://developer.bitvore.com/v2/docs/overview/corp?tagname=News%20API) provides direct\
    \ access to the curated news based on company ID (Bitvore ID), portfolio, customer ID, industry, location, and certain\
    \ company characteristics such as number of employees and annual revenue.\r\n\r\nThe [Economic News API](http://developer.bitvore.com/v2/docs/overview/corp?tagname=News%20API)\
    \ provides direct access to the curated news relevant to the economy of a location or region.\r\n\r\nThe [Organizations\
    \ API](http://developer.bitvore.com/v2/docs/overview/corp?tagname=Organizations%20API) provides the ability to search\
    \ for companies by a variety of company characteristics such as name, web domain, ticker, industry, location, number of\
    \ employees, and annual revenue. Each company is uniquely identified by a Bitvore ID which can be used as input to query\
    \ the [News API](http://developer.bitvore.com/v2/docs/overview).\r\n\r\nThe [Portfolios API](http://developer.bitvore.com/v2/docs/overview/corp?tagname=Portfolios%20API)\
    \ provides the ability to either create and maintain portfolios of companies so that news can be queried in a single call\
    \ from the [News API](http://developer.bitvore.com/v2/docs/overview/corp?tagname=News%20API) for a given portfolio or\
    \ to map your own company ID scheme to Bitvore's so you can query the [News API](http://developer.bitvore.com/v2/docs/overview/corp?tagname=News%20API)\
    \ with your own IDs.\r\n\r\nThe [Filings API](http://developer.bitvore.com/v2/docs/overview/corp?tagname=Filings%20API)\
    \ provides direct access to the financial filings submitted to regulatory agencies such as the SEC on behalf of companies\
    \ found in the [Organizations API](http://developer.bitvore.com/v2/docs/overview/corp?tagname=Organizations%20API).\r\n\
    \r\nThe [Datasets API](http://developer.bitvore.com/v2/docs/overview/corp?tagname=Datasets%20API) provides dataset and\
    \ changeset exporting. This API provides offline data consumption that can be used with external tools.\r\n\r\n"
  version: '2.1'
  title: Corporate APIs
  license:
    name: Copyright Bitvore Corp. 2026
host: api.bitvore.com
basePath: /
tags:
- name: Datasets API
  description: Export Files and Reports
- name: Filings API
  description: Financial Filings, Submissions and Summaries
- name: News API
  description: Precision and Economic News
- name: Organizations API
  description: Organization Details and Search
- name: Portfolios API
  description: Manage Organization-based Portfolios
- name: Sentiment Scores API
  description: Organization Scores
paths:
  /v2/corp/changesets:
    get:
      tags:
      - Datasets API
      summary: Changesets
      description: "Returns the specified changesets by date range.\n Requests are limited to 31 days and up to 1000 results\
        \ per page."
      operationId: getChangesetsUsingGET
      produces:
      - '*/*'
      parameters:
      - name: changesets
        in: query
        description: "One or more changeset type.\n Changesets: entities-added,entities-merged,entities-modified,entities-removed,fields-added,fields-modified,fields-removed,records-added,records-modified,records-removed"
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
        enum:
        - entities-added
        - entities-merged
        - entities-modified
        - entities-removed
        - fields-added
        - fields-modified
        - fields-removed
        - records-added
        - records-modified
        - records-removed
      - name: startDate
        in: query
        description: The start date of the changeset, inclusive.
        required: true
        type: string
        format: date-time
        allowEmptyValue: false
        x-example: '2021-05-10T00:00:00.000Z'
      - name: endDate
        in: query
        description: The end date of the changeset, inclusive, maximum date range is 31.
        required: true
        type: string
        format: date-time
        allowEmptyValue: false
        x-example: '2021-05-12T23:59:59.999Z'
      - name: pageNo
        in: query
        description: Page number of the total result set to return, default is 1.
        required: false
        type: integer
        default: 1
        format: int32
        allowEmptyValue: false
      - name: pageSize
        in: query
        description: Number of results out of the total result set per page to return, default is 1000, maximum is 1000.
        required: false
        type: integer
        default: 1000
        format: int32
        allowEmptyValue: false
      responses:
        '200':
          description: Content
          schema:
            type: integer
            format: int32
            minimum: -128
            maximum: 127
        '204':
          description: No Content
          schema:
            type: array
            items:
              $ref: '#/definitions/Changeset'
              originalRef: Changeset
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/ReasonResponse'
            originalRef: ReasonResponse
      security:
      - API key:
        - Global
      - OAuth:
        - Global
      deprecated: false
  /v2/corp/changesets/{changeset}:
    get:
      tags:
      - Datasets API
      summary: Changeset Report
      description: Returns a csv of the specified changeset type by date range provided. Limit of 1000 results per request.
      operationId: downloadChangesetsUsingGET
      produces:
      - '*/*'
      parameters:
      - name: changeset
        in: path
        description: changeset
        required: true
        type: string
        enum:
        - entities-added
        - entities-merged
        - entities-modified
        - entities-removed
        - fields-added
        - fields-modified
        - fields-removed
        - records-added
        - records-modified
        - records-removed
      - name: startDate
        in: query
        description: The start date of the report, inclusive.
        required: true
        type: string
        format: date-time
        allowEmptyValue: false
        x-example: '2021-05-10T00:00:00Z'
      - name: endDate
        in: query
        description: The end date of the report, exclusive.
        required: true
        type: string
        format: date-time
        allowEmptyValue: false
        x-example: '2021-05-12T00:00:00Z'
      - name: compression
        in: query
        description: Optional compression
        required: false
        type: string
        default: none
        allowEmptyValue: false
        enum:
        - zip
        - gzip
      responses:
        '200':
          description: Content
          schema:
            type: integer
            format: int32
            minimum: -128
            maximum: 127
        '204':
          description: No Content
          schema:
            type: object
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/ReasonResponse'
            originalRef: ReasonResponse
      security:
      - API key:
        - Global
      - OAuth:
        - Global
      deprecated: false
