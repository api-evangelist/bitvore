  /v2/corp/news/byid:
    get:
      tags:
      - News API
      summary: Corporate News by Organization Id
      description: "Provides a simple GET oriented corporate news search capability. The search criteria used when querying\
        \ news includes the following options specified as query parameters which can used together to refine the search results:\
        \ \n * Organization Id - An ID that uniquely identifies a company/organization. Querying by ID returns only news articles\
        \ where the identified organization is an actor in the story. The organization's primary ID is always a BvID, however,\
        \ if using an alternate ID, it will also be returned along with the organization. \n * Org Id Scheme - The type of\
        \ Id being used. Can be BvID, CUSIP, FIGI, ISIN or SEDOL. Certain IDs require a valid license. \n * Signal - An article\
        \ can be classified by one or more signals indicating that the article describes an event, or events, identified in\
        \ the Bitvore Signal taxonomy. The taxonomy is hierarchical and signal values are '.' encoded to represent that hierarchy,\
        \ i.e., Labor.Hiring. Querying by signal returns only articles classified by the given signal. All child signals in\
        \ the signal hierarchy will also be returned. For example querying for Labor will return Labor.Hiring and Labor.Strike\
        \ articles. The signals currently supported can be found [here](http://developer.bitvore.com/v2/docs/api-reference/signals).\n\
        \ * Free Form Text Search - A search for words or phrases can be performed against the articles matching any of the\
        \ previous options listed. \n * Article Type - Type of articles to return, News or PressRelease. By default all types\
        \ are returned.\n * Significance - Articles are classified by their significance. A highly significant article is\
        \ one that is alert worthy whereas less significant articles are more relevant when performing research. This option\
        \ will filter the results returned by the previous options listed. \n * Similarity - Indicates which (if any) similar\
        \ articles should be returned, options are \n \"Usage\" and \"None\", default is \"None\". \"Usage\" indicates similar\
        \ articles can be returned if they \n have different usage restrictions. In other word with this option two similar\
        \ articles can be returned \n if one is FullUse and the other is FairUse. \n * Org Field - By default each company\
        \ referenced in an article is identified by its ID and its name. Additional fields will be returned for each company\
        \ if specified here. The available options are name, domainName, ticker, city, state, and country. If available the\
        \ additional fields will be returned in the Org objects (ReferencedOrgs, MatchedOrgs, and MatchedArticleOrgs) in the\
        \ article. Note: Returning additional fields may cause a small increase in latency. \n \n\n The following are some\
        \ examples of using the API. \n\n To query for M&A news between 7/1/2018 and 7/31/2018 : \n\n ```js\n GET https://api.bitvore.com/v2/corp/news?signal=MergerAcquisition&startDate=2018-07-01T00:00:00.000+07:00&endDate=2018-07-31T23:59:59.999+07:00\n\
        \ ```\n \n\n The metadata tags of articles returned specific to corporate news in addition to the common tags above\
        \ are: \n * Signals - 0 or more signals detected in the article encoded with '.' notation such as Labor.Hiring. \n\
        \ * Referenced Orgs - 0 or more BvID/Name combinations identifying companies discussed in the article. \n \n\n A sample\
        \ successful response is: \n\n ```js\n {\n \t\"success\": true,\n \t\"returned\": 1,\n \t\"total\": 1,\n \t\"response\"\
        : [\n \t\t{\n \t\t\t\"key\": \"070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c\",\n \t\t\t\"articleType\"\
        : \"News\",\n \t\t\t\"title\": \"ACME aquires Wile E. Coyote\",\n \t\t\t\"sourceName\": \"acme.com\",\n \t\t\t\"sourceUrl\"\
        : \"http://ct.moreover.com/?a=41646891667&p=5jw&v=1&x=yg6DsqTFf8IC8ym026-o0A\",\n \t\t\t\"previewImageUrl\": \"http://acme.com/resources/coyote.jpg\"\
        ,\n \t\t\t\"excerpt\": \"The ACME corporation has completed the merger with Wile E. Coyote today ...\",\n \t\t\t\"\
        signals\": [\"MergeAcquisition.AcquisitionComplete\"],\n \t\t\t\"referencedOrgs\": [ \n \t\t\t\t{ \"bvId\" : \"a00001aaa\"\
        , \"name\" : \"ACME Corp\" }, \n \t\t\t\t{ \"bvId\" : \"a00001aab\", \"name\" : \"Wile E. Coyote Inc\" } \n \t\t\t\
        ],\n \t\t\t\"matchedArticleOrgs\": [ \n \t\t\t\t{ \"bvId\" : \"a00001aaa\", \"name\" : \"ACME Corp\" } \n \t\t\t],\n\
        \ \t\t\t\"matchedOrgs\": [ \n \t\t\t\t{ \"bvId\" : \"a00001aac\", \"name\" : \"A Company Manufacturing Everything\"\
        \ } \n \t\t\t],\n \t\t\t\"significance\": \"HIGH\",\n \t\t\t\"sentiment\" : 0.22555919, \n \t\t\t\"esgSentiment\"\
        \ : 0.78078979, \n \t\t\t\"articleLocations\": [\"United States\"],\n \t\t\t\"sourceLocation\": \"Germany\",\n \t\t\
        \t\"publishedAt\": \"2017-06-29T21:41:19.109Z\",\n \t\t\t\"availableAt\": \"2017-06-29T21:41:21.109Z\",\n \t\t}\n\
        \ \t]\n }\n ```\n \n\n Each article returned may have one or more groups of referenced articles. The referencedOrgs\
        \ property holds the list of companies that were directly mentioned in the article and were considered the primary\
        \ actors. In this example the article was about ACME merging with Wile E. Coyote which were considered the primary\
        \ actors. \n\n If there is more than one primary actor in an article it is often the case that only a subset of those\
        \ actors were in the original scope of the input query (bvIds or portfolio). The matchedArticleOrgs will hold that\
        \ subset of primary actors which were part of the input query. The system will look for articles about subsidiaries\
        \ of the companies in the original scope of the input query as well. When a subsidiary is the primary actor of a returned\
        \ article it will be in the referencedOrgs and matchedArticlesOrg field, but the parent company that was specified\
        \ in the query will be returned in the matchedOrgs property. \n\n In this example the original query was for articles\
        \ about A Company Manufacturing Everything. The system found this article about its child company ACME. Therefore\
        \ matchedArticleOrgs lists ACME and matchedOrgs lists A Company Manufacturing Everything which was in the original\
        \ query. \n\n A sample unsuccessful response is: \n\n ```js\n {\n \t\"success\": false,\n \t\"reason\": \"Bad bvId\
        \ found\",\n \t\"reasonSupport\": \"123456789 987654321\",\n \t\"count\": 0\n }\n ```\n"
      operationId: handleNewsSearchUsingGET_1
      produces:
      - '*/*'
      parameters:
      - name: ids
        in: query
        description: Organization Id
        required: true
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: idScheme
        in: query
        description: Organization Id Scheme
        required: false
        type: string
        default: BVID
        allowEmptyValue: false
        enum:
        - BVID
        - CUSIP
        - ISIN
        - SEDOL
        - FIGI
      - name: articleType
        in: query
        description: One or more types of articles to return. By default all types are returned.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
        enum:
        - News
        - PressRelease
      - name: signals
        in: query
        description: 'One or more signals. (Requires license: ''Corporate, Market & Industry'' and/or ''ESG'')'
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: themes
        in: query
        description: 'One or more themes. (Requires license: ''Themes'')'
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: text
        in: query
        description: Keyword or phrase to search for news
        required: false
        type: string
        allowEmptyValue: false
      - name: startDate
        in: query
        description: News date to start from. Time offset will be converted to UTC (Z).
        required: false
        type: string
        format: date-time
        allowEmptyValue: false
        x-example: '2021-04-10T00:00:00Z'
      - name: endDate
        in: query
        description: News date to end with. Time offset will be converted to UTC (Z)
        required: false
        type: string
        format: date-time
        allowEmptyValue: false
        x-example: '2021-04-11T23:59:59Z'
      - name: dateType
        in: query
        description: Indicates whether dates to query by should be published dates "published" or available dates (processing
          completed) "available". Default is published.
        required: false
        type: string
        default: published
        allowEmptyValue: false
      - name: pageNo
        in: query
        description: Page number of the total result set to return, default is 1.
        required: false
        type: integer
        default: 1
        format: int32
        allowEmptyValue: false
      - name: pageSize
        in: query
        description: Number of results out of the total result set per page to return, default is 100, maximum is 1000.
        required: false
        type: integer
        default: 100
        format: int32
        allowEmptyValue: false
      - name: significance
        in: query
        description: Significance of articles to return, possible values are "HIGH" and "MEDIUM", default is "HIGH". The parameter
          is a threshold so a value of MEDIUM will return MEDIUM and HIGH significance articles.
        required: false
        type: string
        default: HIGH
        allowEmptyValue: false
      - name: similarity
        in: query
        description: Indicates which (if any) similar articles should be returned, options are "Usage" and "None", default
          is "None". "Usage" indicates similar articles can be returned if they have different usage restrictions.
        required: false
        type: string
        default: None
        allowEmptyValue: false
      - name: orgField
        in: query
        description: One or more fields to return for each organization associated with the returned articles, by default
          only the organization's Id and name is returned.
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
        enum:
        - name
        - domainName
        - ticker
        - city
        - state
        - country
        - cusip
        - figi
        - isin
        - sedol
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/CorpNewsResultsResponse'
            originalRef: CorpNewsResultsResponse
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/AccessDeniedResponse'
            originalRef: AccessDeniedResponse
        '500':
          description: Internal error
