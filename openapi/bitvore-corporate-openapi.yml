  /v2/corp/sentimentscores:
    get:
      tags:
      - Sentiment Scores API
      summary: Organization Sentiment Score
      description: "### Organization Sentiment Scores \n\n Returns the daily sentiment scores of a given type for the specified\
        \ companies over a period of time. The scores of up to 10 companies identified by their Bitvore ID (BvID) can be returned\
        \ in a single call. The time period requested can be up to one year. The call options are: \n * BvID - Up to 10 Bitvore\
        \ ID's of companies to return scores for. \n * Score - Type of score to return. Options are growth, risk, and sentiment\
        \ (overall sentiment for a company). \n * Start - First day of the time series to return. In the format of yyyy-MM-dd,\
        \ 2019-10-01 for example. \n * End - Last day of the time series to return. In the format of yyyy-MM-dd, 2019-10-09\
        \ for example. \n \n\n The following is an example of using the API to return the growth scores for IBM, BvID b00001ab7,\
        \ between October 1st and October 7th. \n\n ```js\n GET https://api.bitvore.com/v2/corp/sentimentscores?bvIds=b00001ab7&scoreType=growth&startDate=2019-10-01&endDate=2019-10-07&key=xyz123\n\
        \ ```\n \n\n The API response will list the timeline of the returned data series as a range. It will then list the\
        \ scores per day in that range separately for each company requested. The list of scores for a company will be identified\
        \ by the company's BvID. An example of a response is as follows: \n\n ```js\n {\n \t\"success\": true,\n \t\"response\"\
        : {\n \t\t{\n \t\t\t\"timeline\": {\n \t\t\t\t\"start\": \"2019-10-01\",\n \t\t\t\t\"end\": \"2019-10-07\"\n \t\t\t\
        },\n \t\t\t\"series\": [\n \t\t\t\t{\n \t\t\t\t\t\"bvId\": \"b00001ab7\",\n \t\t\t\t\t\"scores\": [\n \t\t\t\t\t\t\
        0.4936433,\n \t\t\t\t\t\t0.4936433,\n \t\t\t\t\t\t0.4936433,\n \t\t\t\t\t\t0.15462846,\n \t\t\t\t\t\t0.15462846,\n\
        \ \t\t\t\t\t\t0.11870702,\n \t\t\t\t\t\t0.11870702\n \t\t\t\t\t]\n \t\t\t\t}\n \t\t\t]\n \t\t}\n \t}\n }\n ```\n"
      operationId: handleSentimentScoreQueryUsingGET_1
      produces:
      - '*/*'
      parameters:
      - name: bvIds
        in: query
        description: Bitvore Ids (up to 10) of organizations to get sentiment scores for.
        required: true
        type: array
        items:
          type: string
        collectionFormat: multi
        allowEmptyValue: false
      - name: scoreType
        in: query
        description: Type of scores to return.
        required: true
        type: string
        allowEmptyValue: false
        enum:
        - growth
        - risk
        - sentiment
      - name: startDate
        in: query
        description: Day of the first score to return. Format is 'yyyy-MM-dd' according to America/New_York timezone.
        required: true
        type: string
        allowEmptyValue: false
        x-example: '2021-04-29'
      - name: endDate
        in: query
        description: Day of the last score to return. Format is 'yyyy-MM-dd' according to America/New_York timezone.
        required: true
        type: string
        allowEmptyValue: false
        x-example: '2021-04-29'
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/BasicResponse'
            originalRef: BasicResponse
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/AccessDeniedResponse'
            originalRef: AccessDeniedResponse
        '500':
          description: Internal error
          schema:
            $ref: '#/definitions/InternalErrorResponse'
            originalRef: InternalErrorResponse
      security:
      - API key:
        - Global
      - OAuth:
        - Global
      deprecated: false
securityDefinitions:
  API key:
    type: apiKey
    name: X-BV-APIKEY
    in: header
  OAuth:
    type: oauth2
    tokenUrl: https://api.bitvore.com/oauth/accesstoken
    flow: application
    scopes:
      Global: Includes all Bitvore APIs
definitions:
  AccessDeniedResponse:
    type: object
    properties:
      reason:
        type: string
        example: access_denied
      reasonSupport:
        type: string
        example: You are not authorized for this resource.
      response:
        type: string
        example: UNAUTHORIZED
      success:
        type: boolean
        example: false
    title: AccessDeniedResponse
  BasicResponse:
    type: object
    properties:
      response:
        description: Response payload
        $ref: '#/definitions/OrganizationSentimentScoreTimeSeries'
        originalRef: OrganizationSentimentScoreTimeSeries
      success:
        type: boolean
        example: true
        description: Indicates whether the call was successful or not
    title: BasicResponse
    description: Default response wrapper for API requests.
  Changeset:
    type: object
    properties:
      name:
        type: string
      properties:
        type: array
        items:
          $ref: '#/definitions/EventProperty'
          originalRef: EventProperty
      timestamp:
        type: string
        format: date-time
      uuid:
        type: string
    title: Changeset
  Channel:
    type: object
    properties:
      channel:
        type: string
        enum:
        - FACEBOOK
        - LINKEDIN
        - TWITTER
      location:
        type: string
        example: https://www.facebook.com/ACME
        description: Direct source to the organizations channel
    title: Channel
  CorpNewsArticle:
    type: object
    properties:
      articleLocations:
        type: array
        example: United States
        description: The countries that the article is likely about.
        items:
          type: string
      articleType:
        type: string
        example: PressRelease
        description: Type of article. Possible values are "News" and "PressRelease
      availableAt:
        type: string
        example: '2017-06-29T21:41:21.109Z'
        description: Date available
      esgSentiment:
        type: number
        format: double
        example: 0.78078
        description: ESG Sentiment of the article. The value is a decimal value between -1 and 1, under 0 is negative while
          over 0 is positive.
      excerpt:
        type: string
        example: ACME announces long awaited acquisition. The acquisition of Wile E. Coyote was announced Thursday.
        description: Fragment or snippet, of the article
      key:
        type: string
        example: 070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c
        description: Key uniquely identifying the article
      matchedArticleOrgs:
        type: array
        description: Organizations that are the primary actors either directly or indirectly.
        items:
          $ref: '#/definitions/Organization'
          originalRef: Organization
      matchedOrgs:
        type: array
        description: Organizations that match the input organization scope that are primary actors in the article or related
          to those primary actors.
        items:
          $ref: '#/definitions/Organization'
          originalRef: Organization
      phrases:
        type: array
        example: referendum, embassy_attack
        description: 'Key phrases identified in Themed news. (Requires license: ''Themes'')'
        items:
          type: string
      previewImageUrl:
        type: string
        example: http://acme.com/resources/coyote.jpg
        description: URL of a preview image
      publishedAt:
        type: string
        example: '2017-06-29T21:41:21.109Z'
        description: Date published
      referencedOrgHierarchy:
        type: array
        description: Organizations who are the primary actors in the article and their parent Organizations.
        items:
          $ref: '#/definitions/Organization'
          originalRef: Organization
      referencedOrgs:
        type: array
        description: Organizations who are the primary actors in the article.
        items:
          $ref: '#/definitions/Organization'
          originalRef: Organization
      sentiment:
        type: number
        format: double
        example: 0.23456
        description: Sentiment of the article. The value is a decimal value between -1 and 1, under 0 is negative while over
          0 is positive.
      signals:
        type: array
        example:
        - Business.Labor
        - Business.Labor.Hiring
        description: 'Signals and topics. See glossary for available values. (Requires license: ''Corporate, Market & Industry''
          and/or ''ESG'')'
        items:
          type: string
      significance:
        type: string
        example: HIGH
        description: Significance of the article. Possible values are "HIGH" and "MEDIUM"
      similarityClusterId:
        type: string
        example: 075005015cf083aba01f0826ecfe718e965b577c572166b14a77652e
        description: Id of the similarity cluster it belongs to.
      sourceLocation:
        type: string
        example: Germany
        description: The country that is likely the source of the article.
      sourceName:
        type: string
        example: businesswire.com, The Washington Daybook
        description: Name or host name of the publisher of the article
      sourceUrl:
        type: string
        example: http://acme.com/press
        description: URL to the original source of the article
      themes:
        type: array
        example:
        - Brexit
        - TradeWar
        description: 'Trending Themes. See glossary for available values. (Requires license: ''Themes'')'
        items:
          type: string
      title:
        type: string
        example: ACME acquires Wile E. Coyote, Inc.
        description: Title
    title: CorpNewsArticle
    description: Corp news article.
  CorpNewsResultsResponse:
    type: object
    properties:
      response:
        type: array
        description: Response payload
        items:
          $ref: '#/definitions/CorpNewsArticle'
          originalRef: CorpNewsArticle
      returned:
        type: integer
        format: int32
        example: 10
        description: Number of items return
      success:
        type: boolean
        example: true
        description: Indicates whether the call was successful or not
      total:
        type: integer
        format: int32
        example: 100
        description: Total number of items available
    title: CorpNewsResultsResponse
    description: A paged result response.
  CorporateNewsRequest:
    type: object
    properties:
      articleTypes:
        type: array
        example:
        - News
        - PressRelease
        description: One or more types of arcticles to return. By default all types are returned.
        items:
          type: string
          enum:
          - News
          - PressRelease
      dateType:
        type: string
        description: Date type to consider while searching news. Either when the content was 'published', or when the content
          was made first 'available' after analysis.
        enum:
        - available
        - published
      endDate:
        type: string
        format: date-time
        example: '2021-04-11T23:59:59.000Z'
        description: Date to end with. Time offset will be converted to UTC (Z)
      orgField:
        type: array
        description: One or more fields to return for each organization associated with the returned articles, by default
          only the organization's Id and name is returned.
        items:
          type: string
          enum:
          - name
          - domainName
          - ticker
          - city
          - state
          - country
          - cusip
          - figi
          - isin
          - sedol
      orgScope:
        description: Identifies the organizations that should be the subject of the news to be returned. Only one of the supported
          options should be used at a time.
        $ref: '#/definitions/OrganizationScope'
        originalRef: OrganizationScope
      pageNo:
        type: integer
        format: int32
        example: 1
        description: Page number of the total result set to return.
      pageSize:
        type: integer
        format: int32
        example: 100
        description: Number of results out of the total result set per page to return, maximum is 1000.
      signals:
        type: array
        example:
        - Business.MergerAcquisitions
        - Business.FinancialFilings
        description: 'Signals and events. See glossary for available values. (Requires license: ''Corporate, Market & Industry''
          and/or ''ESG'')'
        items:
          type: string
      significance:
        type: string
        example: HIGH
        description: Significance of articles to return, possible values are "HIGH" and "MEDIUM", default is "HIGH". The parameter
          is a threshold so a value of MEDIUM will return MEDIUM and HIGH significance articles.
        enum:
        - HIGH
        - MEDIUM
      similarity:
        type: string
        description: Indicates which (if any) similar articles should be returned, options are "Usage" and "None", default
          is "None". "Usage" indicates similar articles can be returned if they have different usage restrictions.
      startDate:
        type: string
        format: date-time
        example: '2021-04-10T00:00:00.000Z'
        description: Date to start from. Time offset will be converted to UTC (Z)
      text:
        type: string
        example: blockchain
        description: Keyword search.
      themes:
        type: array
        example:
