      summary: Financial Filing Summaries Search
      description: "Returns summary information for the financial filings that meet the supplied criteria. Financial filings\
        \ can be selected with the following options:  \n * Filing Type - Type of filing, i.e., 8-K, 10-Q, etc.\n * Bitvore\
        \ ID - A Bitvore ID, known as a BvID, uniquely identifies a company/organization. Querying by BvID returns only filings\
        \ submitted by that company.\n * Free Form Text Search - A search for words or phrases can be performed against the\
        \ filings matching any of the previous options listed. \n * Org Field - By default the subject company of a filing\
        \ is identified by its ID and its name. Additional fields will be returned for each company if specified here. The\
        \ available options are name, domainName, ticker, city, state, and country. If available the additional fields will\
        \ be returned in the Org object in the summary. Note: Returning additional fields may cause a small increase in latency.\
        \ \n \r\n\r\nThe following are some examples of using the API. \r\n\r\nTo query for the filings submitted by IBM,\
        \ BvID b00001ab7 within the last 30 days in the PST timezone (using query param for api key): \r\n\r\n```js\n GET\
        \ https://api.bitvore.com/v2/corp/filings/financial/summaries?bvId=b00001ab7&offset=30&tz=PST&key=xyz123\n ```\n \r\
        \n\r\nTo query for all the 10-Q filings submitted within the last 30 days in the PST timezone: \r\n\r\n```js\n GET\
        \ https://api.bitvore.com/v2/corp/filings/financial/summaries?filingType=10-Q&offset=30&tz=PST&key=xyz123\n ```\n\
        \ \r\n\r\nThe filing summaries are essentially a set of metadata about the filings themselves. The metadata fields\
        \ are: \n * Key - A unique string identifying the submission in the Bitvore system. \n * Filing Type - The type of\
        \ filing (i.e., 8-K, 10-Q, etc.). \n * Title - Title of the filing as reported by the regulatory agency. \n * Source\
        \ URL - A URL to the filing provided by the regulatory agency. \n * Text - A text representation of the filing. For\
        \ SEC filings this will be the text of the primary filing document only. * Org - A structure that holds identifying\
        \ information about the company the filing is about. By default the structure will have the Bitvore ID and name of\
        \ the company. Other fields may be included based on the Org Field parameter. \n * Available At - The date at which\
        \ the filing was made available by the system. \n * Published At - The date the filing was submitted to the regulatory\
        \ agency. \n \r\n\r\nA sample successful response is: \r\n\r\n```js\n {\n \t\"success\": true,\n \t\"returned\": 1,\n\
        \ \t\"total\": 1,\n \t\"response\": [\n \t\t{\n \t\t\t\"key\": \"040000016b8b62e290bcb7e16fcb95b79000ad663679cbdb8566671c\"\
        ,\n \t\t\t\"filingId\": \"70858-000148105721004046\",\n \t\t\t\"filingType\": \"8-K\",\n \t\t\t\"files\": [\"https://www.sec.gov/Archives/edgar/data/70858/000148105721004046/form424b2.htm\"\
        , \"https://www.sec.gov/Archives/edgar/data/70858/000148105721004046/image_cover.jpg\"],\n \t\t\t\"title\": \" 8-K\
        \ - BlueLinx Holdings Inc. (0001301787) (Filer)\",\n \t\t\t\"sourceUrl\": \"https://www.sec.gov/Archives/edgar/data/1301787/000130178719000056/0001301787-19-000056-index.htm\"\
        ,\n \t\t\t\"org\": { \"BvId\" : \"b0004hvv7\", \"Name\" : \"BlueLinx Holdings Inc\" }, \n \t\t\t\"publishedAt\": \"\
        2019-06-24T21:41:19.109Z\",\n \t\t\t\"availableAt\": \"2017-06-24T21:41:21.109Z\",\n \t\t}\n \t]\n }\n ```\n "
      operationId: getFilingsUsingGET_1
      produces:
      - application/json
      parameters:
      - name: filingType
        in: query
