  /v2/corp/organizations/lookup:
    get:
      tags:
      - Organizations API
      summary: Organization Search
      description: "A lookup takes a single string as input to matching entities. The following are the matching rules used.\
        \ The search results are ordered according to the rules. \n\n 1. Exact match on name (case insensitive)\n 2. Exact\
        \ match on ticker\n 3. Exact match on domain name\n 4. Exact match on alias (case insensitive)\n 5. Starts with on\
        \ name (case insensitive)\n 6. Starts with on ticker\n 7. Starts with on domain name\n 8. Starts with on alias (case\
        \ insensitive)\n \n\n Example Request: \n\n \n\n ```js\n GET https://api.bitvore.com/v2/corp/organizations/search?q=acme\n\
        \ ```\n \n\n \n\n 0 or more companies may be returned that match the supplied query criteria. Only summary information\
        \ for each matching organization is supplied which includes the following fields: \n\n * ID \n * Name \n * Domain\
        \ Name \n * Ticker \n * State \n * Country \n * Parent \n "
      operationId: handleOrgLookupUsingGET_1
      produces:
      - '*/*'
      parameters:
      - name: q
        in: query
        description: Lookup option. Value is used to match multiple fields.
        required: false
        type: string
        allowEmptyValue: false
      - name: pageNo
        in: query
        description: Page number of the total result set to return, default is 1.
        required: false
        type: integer
        default: 1
        format: int32
        allowEmptyValue: false
      - name: pageSize
        in: query
        description: Number of results out of the total result set per page to return, default is 100, maximum is 1000.
        required: false
        type: integer
        default: 100
        format: int32
        allowEmptyValue: false
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/OrgResultsResponse'
            originalRef: OrgResultsResponse
