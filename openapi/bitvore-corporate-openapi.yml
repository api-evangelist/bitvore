    post:
      tags:
      - News API
      summary: Advanced Corporate News Query
      description: "Provides an advanced corporate news search capability. The search criteria used when querying news includes\
        \ a more advanced approach to identifying the company, or organization, scope of the news to return as well as the\
        \ other content oriented options listed above. The following are the options supported for identifying the organization\
        \ scope: \n * Bitvore ID - A Bitvore ID, known as a BvID, uniquely identifies a company/organization. Querying by\
        \ BvID returns only news articles where the identified company is an actor in the story.\n * Portfolio - A portfolio\
        \ is made up of one or more companies (BvIDs). Querying by portfolio returns only articles where at least one of the\
        \ companies in the portfolio are an actor in the article. This option cannot be used with the BvID or Foreign ID options.\
        \ \n * Foreign ID - If the Identification API is used to map BvIDs to ID's foreign to the Bitvore system the ID's\
        \ mapped to BvIDs are considered foreign ID's which can be used using this parameter instead of a BvID. This option\
        \ cannot be used with the BvID or Portfolio options. \n * Employees - Returns all articles referencing companies with\
        \ an estimated number of employees that falls within a specified range using the format of lower-upper, i.e. 50-250.\
        \ The upper bound may be omitted (50-) to indicate an unbounded range. The ranges must be defined using the predefined\
        \ measurements: 1, 10, 50, 100, 250, 500, 1000, 5000, 10000. This option cannot be used with the BvID, Foreign ID,\
        \ or Portfolio options. Note: On 1/11/2020 the range boundary of 200 was replaced by 100 and 250 and will be no longer\
        \ supported on 7/1/2020. \n * Revenue - Returns all articles referencing companies with an estimated revenue that\
        \ falls within a specified range using the format of lower-upper, i.e. 500-1000. The upper bound may be omitted (500-)\
        \ to indicate an unbounded range. The ranges must be defined using the predefined measurements:  0, 1, 10, 50, 100,\
        \ 500, 1000, 10000. This option cannot be used with the BvID, Foreign ID, or Portfolio options. Note: On 1/11/2020\
        \ the range boundary of 200 was replaced with 500 and will be no longer supported on 7/1/2020. \n * NAICS Industry\
        \ - Returns all articles referencing companies operating within the industry identified by the specified [NAICS](https://www.naics.com/search/)\
        \ code. \n * SIC Industry - Returns all articles referencing companies operating within the industry identified by\
        \ the specified [SIC](https://www.osha.gov/pls/imis/sicsearch.html) code. \n * HQ Location - Returns all articles\
        \ referencing companies whose headquarters is located in the specified location. The location is in the format of\
        \ city/state/country, i.e., Los Angeles/California/United States. \n * HQ FIPS Area - Returns all articles referencing\
        \ companies whose headquarters is located in the county or CBSA identified by the given FIPS code. FIPS codes for\
        \ counties can be found [here](https://www.census.gov/prod/techdoc/cbp/95-96cd/fips-st.pdf). FIPS codes for CBSAs\
        \ can be found [here](https://www2.census.gov/programs-surveys/cps/methodology/2015%20Geography%20Cover.pdf). Maps\
        \ of CBSAs can be found [here](https://www.census.gov/geographies/reference-maps/2020/geo/cbsa.html). \n \n\n The\
        \ following content oriented query options are also supported: \n * Signal - An article can be classified by one or\
        \ more signals indicating that the article describes an event, or events, identified in the Bitvore Signal taxonomy.\
        \ The taxonomy is hierarchical and signal values are '.' encoded to represent that hierarchy, i.e., Labor.Hiring.\
        \ Querying by signal returns only articles classified by the given signal. All child signals in the signal hierarchy\
        \ will also be returned. For example querying for Labor will return Labor.Hiring and Labor.Strike articles. The signals\
        \ currently supported can be found [here](https://api.bitvore.com/v2/docs/api-reference/signals).\n * Free Form Text\
        \ Search - A search for words or phrases can be performed against the articles matching any of the previous options\
        \ listed. \n * Article Type - Type of articles to return, News or PressRelease. By default all types are returned.\n\
        \ * Significance - Articles are classified by their significance. A highly significant article is one that is alert\
        \ worthy whereas less significant articles are more relevant when performing research. This option will filter the\
        \ results returned by the previous options listed. \n * Usage - A news article may have licensing restrictions placed\
        \ on it. To filter search \n results to only fair use content specify \"FairUse\" for the Usage option. To filter\
        \ results to only \n commercially licensed content that grants full use of the content specify \"FullUse\" for the\
        \ Usage option. \n Specifying \"All\", which is the default option, does not filter the results at all. \n * Org Field\
        \ - By default each company referenced in an article is identified by its ID and its name. Additional fields will\
        \ be returned for each company if specified here. The available options are name, domainName, ticker, city, state,\
        \ and country. If available the additional fields will be returned in the Org objects (ReferencedOrgs, MatchedOrgs,\
        \ and MatchedArticleOrgs) in the article. Note: Returning additional fields may cause a small increase in latency.\n\
        \ \n\n The following are some examples of using the API. \n\n To query for the news about IBM, BvID b00001ab7, published\
        \ within the last 3 days in the PST timezone (using HTTP header for api key): \n\n ```js\n POST https://api.bitvore.com/v2/corp/news\
        \ \n Accept: application/json\n X-BV-APIKEY: xyz123... \n\n { \n \t\"orgScope\": { \n \t\t\"ids\": [\"b00001ab7\"\
        ], \n \t\t\"orgIdScheme\": \"BVID\" \n \t}, \n \t\"startDate\": \"2018-07-01T09:00:00.000+07:00\", \n \t\"endDate\"\
        : \"2018-07-03T23:59:59.999+07:00\" \n } \n ```\n \n\n To query for the news about all executive changes between 9:00AM\
        \ PST 7/1/2018 and 5:00PM PST on 7/31/2018: \n\n ```js\n POST https://api.bitvore.com/v2/corp/news \n Accept: application/json\n\
        \ X-BV-APIKEY: xyz123... \n\n { \n \t\"signal\": [\"ExecutiveChanges\"], \n \t\"startDate\": \"2018-07-01T09:00:00.000+07:00\"\
        , \n \t\"endDate\": \"2018-07-31T17:00:00.000+07:00\" \n } \n ```\n \n\n To query for the news about a companies with\
        \ annual revenue between 50M and 100M in the last 30 days: \n\n ```js\n POST https://api.bitvore.com/v2/corp/news\
        \ \n Accept: application/json\n X-BV-APIKEY: xyz123... \n\n { \n \t\"orgScope\": { \n \t\t\"revRange\": \"50-100\"\
        \ \n \t}, \n \t\"startDate\": \"2018-07-01T09:00:00.000Z\", \n \t\"endDate\": \"2018-07-31T17:00:00.000Z\" \n } \n\
        \ ```\n \n\n The metadata tags of articles returned specific to corporate news in addition to the common tags above\
        \ are: \n * Signals - 0 or more signals detected in the article encoded with '.' notation such as Labor.Hiring. \n\
        \ * Referenced Orgs - 0 or more BvID/Name combinations identifying companies discussed in the article. \n \n\n Example\
        \ Response: \n\n ```js\n {\n \t\"success\": true,\n \t\"returned\": 1,\n \t\"total\": 1,\n \t\"response\": [\n \t\t\
        {\n \t\t\t\"key\": \"070000015cf083aba01f0826ecfe718e965b577c572166b14a77651c\",\n \t\t\t\"articleType\": \"News\"\
        ,\n \t\t\t\"title\": \"ACME acquires Wile E. Coyote\",\n \t\t\t\"sourceName\": \"acme.com\",\n \t\t\t\"sourceUrl\"\
        : \"http://ct.moreover.com/?a=41646891667&p=5jw&v=1&x=yg6DsqTFf8IC8ym026-o0A\",\n \t\t\t\"previewImageUrl\": \"http://acme.com/resources/coyote.jpg\"\
        ,\n \t\t\t\"excerpt\": \"The ACME corporation has completed the merger with Wile E. Coyote today ...\",\n \t\t\t\"\
        signals\": [\"MergeAcquisition.AcquisitionComplete\"],\n \t\t\t\"referencedOrgs\": [ \n \t\t\t\t{ \"bvId\" : \"a00001aaa\"\
        , \"name\" : \"ACME Corp\" }, \n \t\t\t\t{ \"bvId\" : \"a00001aab\", \"name\" : \"Wile E. Coyote Inc\" } \n \t\t\t\
        ],\n \t\t\t\"matchedArticleOrgs\": [ \n \t\t\t\t{ \"bvId\" : \"a00001aaa\", \"name\" : \"ACME Corp\" } \n \t\t\t],\n\
        \ \t\t\t\"matchedOrgs\": [ \n \t\t\t\t{ \"bvId\" : \"a00001aac\", \"name\" : \"A Company Manufacturing Everything\"\
        \ } \n \t\t\t],\n \t\t\t\"significance\": \"HIGH\",\n \t\t\t\"sentiment\" : 0.22555919, \n \t\t\t\"esgSentiment\"\
        \ : 0.78078979, \n \t\t\t\"articleLocations\": [\"United States\"],\n \t\t\t\"sourceLocation\": \"Germany\",\n \t\t\
        \t\"publishedAt\": \"2017-06-29T21:41:19.109Z\",\n \t\t\t\"availableAt\": \"2017-06-29T21:41:21.109Z\",\n \t\t}\n\
        \ \t]\n }\n ```\n "
      operationId: handleCorpAdvancedSearchUsingPOST_1
      consumes:
      - application/json
      produces:
      - '*/*'
