      - Portfolios API
      summary: Add Portfolio Item
      description: Adds items to the portfolio with the given Id, the added items are returned
      operationId: handleAddPortfolioItemsUsingPOST_1
      parameters:
      - name: portfolioId
        in: path
        description: Portfolio Id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
