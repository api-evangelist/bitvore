openapi: 3.2.0
info:
  title: Bitvore Portfolios API API
  license:
    name: Copyright Bitvore Corp. 2026
  version: '1.0'
  description: 'Operations tagged Portfolios API across 3 of this provider''s published API definitions: bitvore-corporate-openapi.yml, bitvore-custom-api-l-openapi.yml, bitvore-muni-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.bitvore.com/
tags:
- name: Portfolios API
  description: Manage Organization-based Portfolios
paths:
  /v2/corp/portfolios:
    get:
      tags:
      - Portfolios API
      summary: Get Portfolios
      description: Returns all portfolios for a user.
      operationId: handleGetPortfoliosUsingGET_1
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
                originalRef: PortfolioResponse
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
        '500':
          description: Internal error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
      security:
      - API key:
        - Global
      - OAuth:
        - Global
      deprecated: false
    post:
      tags:
      - Portfolios API
      summary: Add Portfolio
      description: Creates a new portfolio
      operationId: handleAddPortfolioUsingPOST_1
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
                originalRef: PortfolioSummary
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
        '500':
          description: Internal error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
      security:
      - API key:
        - Global
      - OAuth:
        - Global
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioSummary'
              originalRef: PortfolioSummary
        description: portfolio
        required: true
  /v2/corp/portfolios/{portfolioId}:
    get:
      tags:
      - Portfolios API
      summary: Get Portfolio
      description: Returns a portfolio by Id. Items can be optionally returned.
      operationId: handleGetPortfolioUsingGET_1
      parameters:
      - name: portfolioId
        in: path
        description: Portfolio Id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
                originalRef: PortfolioSummary
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
        '500':
          description: Internal error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
      security:
      - API key:
        - Global
      - OAuth:
        - Global
      deprecated: false
    put:
      tags:
      - Portfolios API
      summary: Update Portfolio
      description: Changes the portfolio with the given Id, the result of the changes are returned as a portfolio
      operationId: handleModifyPortfolioUsingPUT_1
      parameters:
      - name: portfolioId
        in: path
        description: Portfolio Id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
                originalRef: PortfolioSummary
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
        '500':
          description: Internal error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
      security:
      - API key:
        - Global
      - OAuth:
        - Global
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioSummary'
              originalRef: PortfolioSummary
        description: portfolio
        required: true
    delete:
      tags:
      - Portfolios API
      summary: Delete Portfolio
      description: Deletes the portfolio with the given Id
      operationId: handleDeletePortfolioUsingDELETE_1
      parameters:
      - name: portfolioId
        in: path
        description: Portfolio Id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
        '500':
          description: Internal error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
      security:
      - API key:
        - Global
      - OAuth:
        - Global
      deprecated: false
  /v2/corp/portfolios/{portfolioId}/itemUploads:
    post:
      tags:
      - Portfolios API
      summary: Upload Portfolio Items
      description: Uploads a CSV file of portfolio items. The Id Scheme column must exist in the header; CUSIP for Muni API and BVID for Corp API
      operationId: handleUploadPortfolioItemsUsingPOST_1
      parameters:
      - name: portfolioId
        in: path
        description: Portfolio Id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
                originalRef: PortfolioSummary
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
        '500':
          description: Internal error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
      security:
      - API key:
        - Global
      - OAuth:
        - Global
      deprecated: false
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                replaceItems:
                  description: Replace items (true|false), otherwise append/update
                file:
                  type: string
                  description: Portfolio CSV file
                  format: binary
              required:
              - file
