      - API key:
        - Global
      - OAuth:
        - Global
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PortfolioItem'
                originalRef: PortfolioItem
        description: items
        required: true
    delete:
      tags:
      - Portfolios API
      summary: Delete Portfolio Items
      description: Deletes the specified items in the portfolio with the given Id. If ids is null, all items will be deleted.
      operationId: handleDeletePortfolioItemsUsingDELETE_2
      parameters:
      - name: portfolioId
        in: path
        description: Portfolio Id
        required: true
        schema:
          type: integer
          format: int64
      - name: ids
        in: query
        description: Id of item(s) to remove
        required: false
        allowEmptyValue: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReasonResponse'
                originalRef: ReasonResponse
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
